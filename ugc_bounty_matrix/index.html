<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ugc_bounty_matrix ｜ 商業戰略定位全案知識庫</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Markdown & Syntax & Mermaid Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/yaml.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
      
      /* Dark Theme (Default) */
      --bg-body: #090a0d;
      --bg-sidebar: #0f1117;
      --bg-card: #151821;
      --bg-surface: #1a1e2a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #e2b857;
      --gold-primary: #e2b857;
      --gold-light: #f6d88b;
      --gold-dark: #b88d30;
      --blue-accent: #38bdf8;
      --green-accent: #4ade80;
      --sidebar-width: 320px;
      --toc-width: 260px;
    }

    body.theme-light {
      --bg-body: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #b88d30;
      --gold-primary: #b88d30;
      --gold-light: #927021;
      --gold-dark: #745615;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 20px 18px 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .project-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(226, 184, 87, 0.25);
    }

    .project-title-group {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .project-name {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-badge {
      font-size: 0.72rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Search Box */
    .search-container {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Sidebar Navigation Tree */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }

    .nav-category {
      margin-bottom: 18px;
    }

    .category-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 6px;
      font-size: 0.86rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(226, 184, 87, 0.12);
      color: var(--gold-primary);
      font-weight: 600;
      border-left: 3px solid var(--gold-primary);
    }

    .nav-item-icon {
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn:hover {
      border-color: var(--gold-primary);
    }

    /* Main Content Area */
    #main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Action Bar */
    .top-bar {
      height: 52px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--bg-body);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .doc-breadcrumbs {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .doc-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Document Viewer Container */
    .content-layout {
      display: flex;
      flex: 1;
      position: relative;
    }

    .markdown-container {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 32px 100px 32px;
      overflow-wrap: break-word;
      line-height: 1.75;
      font-size: 1.02rem;
    }

    /* Right Table of Contents (TOC) */
    #toc-container {
      width: var(--toc-width);
      min-width: var(--toc-width);
      padding: 30px 20px 40px 10px;
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      font-size: 0.82rem;
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
    }

    .toc-title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .toc-list {
      list-style: none;
    }

    .toc-item {
      margin: 4px 0;
    }

    .toc-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1.4;
      transition: all 0.15s;
    }

    .toc-link:hover {
      color: var(--text-main);
      background: var(--bg-surface);
    }

    .toc-link.active {
      color: var(--gold-primary);
      font-weight: 600;
      border-left: 2px solid var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .toc-item.depth-3 .toc-link {
      padding-left: 20px;
      font-size: 0.78rem;
    }

    /* Markdown Typography & Styling */
    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 900;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 14px;
      margin-top: 10px;
      margin-bottom: 24px;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      font-weight: 800;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 38px;
      margin-bottom: 18px;
      color: var(--text-main);
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 16px;
    }

    .markdown-body strong {
      font-weight: 700;
      color: var(--gold-light);
    }

    body.theme-light .markdown-body strong {
      color: #92400e;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--gold-primary);
      background: rgba(226, 184, 87, 0.06);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 18px 0;
      color: var(--text-muted);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f472b6;
    }

    .markdown-body pre {
      background: #111318 !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.88rem;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.92rem;
    }

    .markdown-body table th,
    .markdown-body table td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body table th {
      background: var(--bg-surface);
      font-weight: 700;
      color: var(--text-main);
    }

    .markdown-body table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    body.theme-light .markdown-body table tr:nth-child(even) {
      background: #f8fafc;
    }

    /* Mermaid Card, Viewport & Interactive Zoom */
    .mermaid-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin: 24px 0;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .mermaid-card:hover {
      border-color: rgba(226, 184, 87, 0.4);
      box-shadow: 0 6px 28px rgba(226, 184, 87, 0.12);
    }

    .mermaid-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .mermaid-badge {
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
    }

    .mermaid-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mermaid-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .mermaid-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .mermaid-btn.primary {
      background: rgba(226, 184, 87, 0.18);
      border-color: var(--gold-primary);
      color: var(--gold-light);
      font-weight: 700;
    }

    .mermaid-btn.primary:hover {
      background: var(--gold-primary);
      color: #000;
    }

    .mermaid-viewport {
      min-height: 180px;
      max-height: 520px;
      overflow: auto;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
      position: relative;
      background: radial-gradient(circle at center, rgba(226, 184, 87, 0.02) 0%, transparent 70%);
    }

    .mermaid-canvas {
      display: inline-block;
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mermaid-canvas svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Mermaid Fullscreen Lightbox Modal */
    .mermaid-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 5, 8, 0.92);
      backdrop-filter: blur(14px);
      z-index: 9999;
      padding: 24px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
    }

    .mermaid-modal.active {
      display: flex;
    }

    .modal-dialog {
      width: 95vw;
      height: 92vh;
      background: #0d0f15;
      border: 1px solid var(--gold-primary);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), 0 0 30px rgba(226, 184, 87, 0.25);
    }

    .modal-header {
      height: 54px;
      background: #141721;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .modal-title {
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
    }

    .modal-scale-indicator {
      background: rgba(226, 184, 87, 0.18);
      color: var(--gold-primary);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      font-weight: 700;
      border: 1px solid rgba(226, 184, 87, 0.3);
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      background: #1a1e2a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .modal-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .modal-btn.close-btn {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-weight: 700;
    }

    .modal-btn.close-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .modal-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 36, 52, 0.6) 0%, #08090d 100%);
      cursor: grab;
      user-select: none;
    }

    .modal-body:active {
      cursor: grabbing;
    }

    .modal-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.04s ease-out;
      will-change: transform;
    }

    .modal-canvas svg {
      display: block;
      filter: drop-shadow(0 12px 36px rgba(0, 0, 0, 0.7));
    }

    .modal-hint {
      position: absolute;
      bottom: 16px;
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid rgba(226, 184, 87, 0.25);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--gold-light);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* Callout Alerts */
    .callout {
      border-left: 4px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 18px 0;
    }

    .callout.important {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }

    .callout.warning {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    .callout.tip {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.08);
    }

    /* YAML Formatter */
    .yaml-viewer {
      background: #111318;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    /* Mobile Responsive */
    @media (max-width: 1024px) {
      #toc-container {
        display: none;
      }
    }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: -320px;
      }
      #sidebar.open {
        transform: translateX(320px);
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Document Tree -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="project-brand">
        <div class="project-icon">UG</div>
        <div class="project-title-group">
          <div class="project-name">ugc_bounty_matrix</div>
          <div class="project-badge">商業戰略全案門戶</div>
        </div>
      </div>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-box" placeholder="搜尋全案文件與關鍵字...">
      </div>
    </div>

    <nav class="sidebar-nav" id="nav-tree">
      <!-- Generated Dynamically -->
    </nav>

    <div class="sidebar-footer">
      <span>39 份核心文檔</span>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">深色模式</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Viewer -->
  <main id="main">
    <div class="top-bar">
      <div class="doc-breadcrumbs" id="breadcrumbs">
        <span>文檔</span> / <strong id="current-doc-title">載入中...</strong>
      </div>
      <div class="doc-actions">
        <button class="action-btn" onclick="copyMarkdown()">📋 複製原始 MD</button>
        <button class="action-btn" onclick="window.print()">🖨️ 列印 / 轉 PDF</button>
      </div>
    </div>

    <div class="content-layout">
      <div class="markdown-container">
        <article class="markdown-body" id="article-content">
          <!-- Rendered by marked.js -->
        </article>
      </div>
      <aside id="toc-container">
        <div class="toc-title">📌 本頁目錄 (TOC)</div>
        <ul class="toc-list" id="toc-list">
          <!-- Rendered dynamically -->
        </ul>
      </aside>
    </div>
  </main>

  <!-- Mermaid Fullscreen Interactive Lightbox Modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="onModalBackdropClick(event)">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <span>🔍 Mermaid 架構圖檢視器</span>
          <span class="modal-scale-indicator" id="modal-zoom-text">100%</span>
        </div>
        <div class="modal-controls">
          <button class="modal-btn" onclick="zoomModal(1.2)" title="放大 (亦可滾動滑鼠滾輪)">➕ 放大</button>

      "raw": "# 共鳴創作者計畫 ‧ 專案戰略簡報 (Project Brief)\n\n> **內部專案代號**：`ugc_bounty_matrix`  \n> **對外官方計畫**：**共鳴創作者計畫 (Resonance Creator Program)**  \n> **核心定位本質**：**雙邊市場獲客網絡（Two-Sided Creator-to-Business Network）**\n\n---\n\n## 🎯 雙邊角色精準定位與價值主張 (Dual-Sided Value Proposition)\n\n本專案居於「品牌老闆獲客需求」與「青年學生打工供給」的黃金交集點，建立去中心化的成果分銷樞紐：\n\n```mermaid\nflowchart LR\n    subgraph Creators [\"【創作者 / 學生端】(供給方)\"]\n        C1[\"痛點: 超商罰站 $185、接案改稿被白嫖\"]\n        C2[\"承諾: 滿千+互動秒領 $500 (時薪翻2.5~6倍)\"]\n        C3[\"保障: 零收費、AI 預審通過不退件、帳號資產歸自己\"]\n    end\n\n    subgraph Platform [\"【共鳴創作者計畫】(中樞樞紐)\"]\n        P[\"去中心化成果驗收共創網絡\\n• AI 預審與彈藥庫質檢\\n• 雙門禁防刷驗收\\n• 對數階梯爆款稀釋\"]\n    end\n\n    subgraph Bosses [\"【品牌老闆端】(買單方)\"]\n        B1[\"痛點: 官方投流貴、網紅外包沒流量\"]\n        B2[\"承諾: 零觀看不給錢、每一分錢只為名單買單\"]\n        B3[\"價值: $50 獲取高意圖名單 + 百萬爆款紅利\"]\n    end\n\n    Creators <-->|\"提供素人真誠創意與多點分發\"| Platform\n    Platform <-->|\"提供低成本高轉化名單與爆款流量\"| Bosses\n```\n\n---\n\n## ⚡ 雙方確認極簡三步驟架構 (The 3-Step Lightning Flow)\n\n> **核心原則：小學生 3 秒看懂！「創作者出點子 ➔ AI 自動跑分體檢 ➔ 老闆一鍵打勾開拍」！**\n\n```mermaid\nflowchart LR\n    classDef step1 fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px,color:#111827;\n    classDef step2 fill:#e0f2fe,stroke:#0284c7,stroke-width:3px,color:#111827;\n    classDef step3 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#111827;\n\n    S1[\"📱 步驟 1：創作者上傳點子<br/>一兩句話/迷因/AI分鏡<br/>自由發揮 ✕ 零門檻送出\"]:::step1\n    --> S2[\"🤖 步驟 2：AI 3秒智能跑分<br/>自動檢測『關聯度 ＋ 紅線』<br/>創作者拿綠燈 ✕ 老闆免審稿\"]:::step2\n    --> S3[\"💼 步驟 3：老闆一鍵打勾同意<br/>儀表板看評分 ➔ 一鍵放行<br/>創作者開心開工 ✕ 滿千領錢！\"]:::step3\n```\n\n---\n\n## 🖥️ 平台雙方確認介面示意圖 (UI Mockup Architecture)\n\n平台在介面上如何呈現？創作者與老闆看到的是同一個客觀驗證卡片：\n\n```text\n┌────────────────────────────────────────────────────────────────────────┐\n│ ⚡ 共鳴 AI 創意驗證平台 ‧ 任務審核卡片 (Task #2026-088)                  │\n├────────────────────────────────────────────────────────────────────────┤\n│ 👤 創作者提案內容 (一句話/迷因皆可)：                                  │\n│   「我想拍期末考熬夜搶廁所的搞笑短劇，最後轉折到喝益生菌，留言留+1抽試用包」│\n├────────────────────────────────────────────────────────────────────────┤\n│ 🤖 AI 智能體檢雷達 (即時秒測)：                                        │\n│   • 品牌產品關聯度 (Relevance)： [████████░░] 88% (合格，生活自然融入)  │\n│   • 法規與安全紅線 (Safety)   ： [██████████] 100% 安全 (0違規，無療效)│\n│   • 老闆指定 CTA 完整度       ： [█████████░] 92% (帶出留言+1抽試用)   │\n│   ➔ 綜合判定：🟢 綠燈通過！(AI 自動產出過關保險代碼: #PASS-8821)       │\n├────────────────────────────────────────────────────────────────────────┤\n│ 💼 品牌老闆確認區 (1 秒勾選)：                                        │\n│   [ ✔ 同意開拍放行 ]      [ 💬 微調建議 (選填) ]                        │\n│   *(提示：系統支援「評分大於 80 分自動放行」，老闆可全自動託管)*       │\n└────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## ⚡ 平台核心作業流：專業時序圖 ✕ 秒懂極簡流程圖\n\n### 1. 【對外秒懂版】老闆與創作者 3 秒看懂的合作閉環：\n```mermaid\nflowchart LR\n    classDef boss fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef ai fill:#e0f2fe,stroke:#0284c7,stroke-width:2px,color:#111827;\n    classDef creator fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef cash fill:#f3e8ff,stroke:#9333ea,stroke-width:2px,color:#111827;\n\n    Step1[\"💼 1. 老闆出題<br/>設定賣點 ＋ 自選 CTA 優惠\"]:::boss\n    --> Step2[\"🤖 2. AI 綠燈保險<br/>點子丟上去 ➔ 3秒測出合規<br/>(老闆一鍵勾選 ✕ 創作者免退件)\"]:::ai\n    --> Step3[\"📱 3. 自由創作 (真人/AI皆可)<br/>發布個人頻道 ✕ 帶上指定 CTA\"]:::creator\n    --> Step4[\"💰 4. 滿千秒結算<br/>自然破 1,000 播放 ✕ 截圖入帳！\"]:::cash\n```\n\n### 2. 【後台管理版】AI 智能協同驗證時序流程 (The AI Verification Flow)：\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Creator as 創作者 (學生/斜槓/AI創作者)\n    participant Platform as 【共鳴 AI 智能驗證平台】\n    actor Boss as 品牌老闆 (企業主)\n\n    Boss->>Platform: 1. 發布任務包：設定產品核心賣點 ＋ 指定結尾 CTA (優惠碼)\n    Creator->>Platform: 2. 提交創作靈感 (一句話/迷因/AI分鏡/大綱皆可)\n    Platform->>Platform: 3. AI 核心引擎自動檢測：計算關聯性、安全紅線、CTA存在度\n    Platform-->>Creator: 4. 即時回傳評分 (綠燈通過，若有偏離 AI 自動提供順手微調建議)\n    Platform-->>Boss: 5. 後台儀表板同步展示：高分提案聚合，老闆可一鍵勾選確認或自動放行\n    Creator->>Creator: 6. 開機創作/剪輯 (真人實拍/AI生成皆可) 並發布個人頻道\n    Creator->>Platform: 7. 發布滿 48hr 上傳 2 張截圖 (播放破千 + 台灣受眾 >= 70%)\n    Platform-->>Creator: 8. 系統審核通過，48hr 內撥款 $500！\n```\n\n---\n\n## 📐 方案 A 驗收標準與加價階梯矩陣 (Plan A & Escalation Milestones)\n\n| 流量里程碑 ($V$) | 創作者累計領取賞金 | 老闆支付專案費用 | 平台單支淨利潤 | 老闆獲得等效 CPM | 商業本質與權責劃分 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **門檻：1,000 觀看** | **NT$ 500 元** | **NT$ 800 元** | **＋NT$ 300 元** | **$800 / 千次** | **素材製作 ＋ 首波千人曝光**<br>驗收條件：自然流量滿 1k ＋ 台灣受眾 >= 70% 截圖 |\n| **突破：10,000 觀看** | **NT$ 1,200 元** (補差額 $700) | **NT$ 1,800 元** (補差額 $1,000) | **＋NT$ 600 元** | **$180 / 千次** | **演算法破圈** (自帶素人信任，CPM 等同投流) |\n| **大爆：50,000 觀看** | **NT$ 2,500 元** (補差額 $1,300) | **NT$ 3,800 元** (補差額 $2,000) | **＋NT$ 1,300 元** | **$76 / 千次** | **全網擴散** (超額自然流暴擊，名單成本暴跌) |\n| **神作：100,000 觀看**| **NT$ 3,500 元** (封頂加發 $1k) | **NT$ 5,000 元** (封頂加付 $1.2k) | **＋NT$ 1,500 元** | **$50 / 千次** | **百萬頂級爆款** (流量費用封頂，防預算穿透) |\n| **10 萬觀看以上** | **流量賞金封頂**<br>轉入純 CPS 抽成 15%~20% | **流量費用封頂**<br>依真實銷售額抽成 25%~30% | **淨賺 10% 佣金** | 趨近於 $0 (純賺) | **長尾被動收入** (影片永久留存，出單才抽成) |\n\n---\n\n## 🎯 關鍵權責邊界：CTA 是老闆自己決定的！\n\n1. **對品牌老闆說（給予商業主導權）**：\n   > 「老闆，行銷拆成兩件事：前半段創作者負責把片子拍好看、把 1,000 個真人留在螢幕前聽完產品；**而後半段結尾的 CTA（行動呼籲、優惠誘因）完全由您親自決定！**\n   > 您可以要求放『留言領 9 折券』或『私訊免費領樣品』。創作者保證完整傳播給千人受眾；但最後有多少人買，取決於您的 CTA 誘因夠不夠香！**創作者負責把 1,000 個人帶到您的攤位前，而攤位放什麼好康吸引他掏錢，由您作主！**」\n2. **對創作者學生說（消除業績壓力）**：\n   > 「同學們，你們是靠創意和剪輯賺打工錢，不是來當業務員背業績的！產品好不好賣是老闆定價和優惠的事。官方給你們老闆指定的結尾台詞，你們只要在最後 5 秒順順講出來。**只要影片自然滿 1,000 觀看且受眾 70% 在台灣，500 塊就穩穩入帳，絕不以『有沒有人買』扣款！**」\n\n### 1. 對品牌老闆說話（獲客艦隊定位）\n*   **核心標語**：\n    > **「不用先砸十萬賭流量！發動百位創作者自建矩陣，每一塊錢只為『真實破千觀看＋精準諮詢』買單！」**\n*   **三大殺手級利益點**：\n    1. **零試錯成本**：沒達到 1,000 觀看或沒人互動，老闆一毛錢都不用付。\n    2. **買到精準潛在客戶 (Lead)**：$500 元換取 10 個留言「+1/想買」的高意圖諮詢，單個名單成本僅 $50 元（比 Meta 投流便宜 60%）。\n    3. **去中心化真人背書**：幾十位素人以個人頻道真實推薦，演算法多點開花，主帳號零封禁與 IP 風險。\n\n### 2. 對創作者/學生說話（高薪自由舞台定位）\n*   **核心標語**：\n    > **「告別超商時薪 185 罰站！用你的手機剪 1 分鐘短影音，滿千自然觀看加互動秒領 $500，爆款單支最高 $3,500 ＋ 永久被動抽成！」**\n*   **三大殺手級利益點**：\n    1. **實質時薪翻 2.5 ~ 6.5 倍**：1 分鐘短影音製作約 45 分鐘，滿千領 $500（換算時薪 $475~$1,200）。\n    2. **絕不白嫖與主觀退件**：AI 大綱預審通過即背書，達標 48 小時內必撥款，不憑老闆主觀美感挑刺。\n    3. **自建自媒體個人資產**：影片發在個人號上，流量、粉絲與長尾銷售分潤全歸創作者所有。\n    4. **終生零收費保證**：免學費、免樣品費、免保證金，乾乾淨淨的真金白銀合作。\n"
    },

      "raw": "# 階段一：資產解構與信任狀審計報告 (Asset Audit)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/01_assets.yaml`](../_thinking/00_core/01_assets.yaml)  \n> **定位狀態**：審計完成  \n> **戰略主線**：**成果驗收保底 ✕ 爆款指數稀釋 ✕ 去中心化推薦矩陣**\n\n---\n\n## 1. 核心硬資產審計與真實信任狀 (Reason to Believe, RTB)\n\n「共鳴創作者計畫」並非空泛的網路兼職群組，而是基於精確的**單元經濟學（Unit Economics）與博弈論機制設計**，為了解決傳統短影音外包低效、投流高成本而誕生的創新生態。\n\n### 核心硬資產審計表：\n\n| 資產代號 | 資產名稱 | 客觀事實與 RTB (Reason to Believe) | 轉化為商業獲客與創作者端之價值 |\n| :--- | :--- | :--- | :--- |\n| **RTB-1** | **成果導向雙門禁賞金機制** | 拋棄傳統「賣工時」的 MP4 交付，改以「自然 1,000 觀看 ＋ 5~10 則真實互動/15次點擊」作為解鎖 $500 保底條件。 | 創作者享有「只要努力開頭好就能拿錢」的掌控感；品牌主將單個高意圖潛在客戶 (Lead) 成本壓在 $30~$50，遠超官方廣告。 |\n| **RTB-2** | **AI 預審與三層防刷防禦棧** | 開機前 AI 腳本大綱 30 秒預審、發布中 ManyChat 關鍵字追蹤、結算時台灣受眾 >70% 截圖與 48hr 冷卻期。 | 從機制上杜絕機器人假量與刷播放量套利，確保流入品牌的每一位都是真人。 |\n| **RTB-3** | **對數階梯爆款稀釋模型** | 1k 觀看 $500 (CPM $500 當製作補貼) ➔ 10k 觀看累計 $1,200 (CPM $120) ➔ 50k 觀看累計 $2,500 (CPM $50) ➔ 100k 觀看累計 $3,500 (CPM $35)。 | 激勵創作者死磕前 3 秒鉤子，而品牌綜合獲客成本隨播放量指數級下降，徹底杜絕行銷預算穿透風險。 |\n| **RTB-4** | **去中心化多點推薦矩陣** | 創作者以個人或自建垂直號發布，形成「多方真實自發推薦」的社會證明 (Social Proof)。 | 破除單一官方帳號強烈廣告感，多賽道同發測試演算法，主帳號零封禁與 IP 風險。 |\n\n---\n\n## 2. 嚴格模式約束宣告 (Constraints)\n\n1. **創作者端零門檻與零白嫖約束**：\n   - 嚴禁收取任何入會費、保證金或培訓費（與 Andrew Tate 的 HU 傳銷模式劃清界線）。\n   - 審核標準全面前置於 Step 2 AI 預審；凡通過預審且達標者，官方 48 小時內保證撥款，絕不以主觀審美刁難。\n2. **財務上限約束（Hard Ceiling）**：\n   - 單支影片純流量獎金以 100,000 觀看累計 $3,500 元為上限；10 萬以上一律轉入 15%~20% CPS 導流分潤，保護品牌現金流。\n3. **品牌安全紅線約束**：\n   - 嚴禁虛假療效、絕對誇大保證、低俗誘惑、政治爭議或侵權音樂。\n"
    },

      "raw": "# 階段二：心智階梯探測與生態位審定 (Mental Ladder)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/02_ladder_landmines.yaml`](../_thinking/00_core/02_ladder_landmines.yaml)  \n> **核心結論**：**探測市場既有心智梯隊，裁定全新物種心智空白！**\n\n---\n\n## 1. 既有短影音外包與獲客心智階梯\n\n在目標受眾（創作者與品牌老闆）的大腦記憶體中，已經被三大既有梯隊佔據：\n\n1. **第一梯隊：傳統工時接案外包（以 MP4 檔案計費）**\n   - 認知印記：收費高（單支 $1,500~$3,000）、反覆改稿耗時耗力、發布後 0 播放外包商照收錢，老闆承擔全部風險。\n2. **第二梯隊：官方競價廣告投流（Meta / TikTok Ads）**\n   - 認知印記：租來的冰冷流量、廣告感極重、停投即死，獲客成本年年飆升（CPL > $150）。\n3. **第三梯隊：海外傳銷式矩陣裂變（TikTok Affiliate / HU）**\n   - 認知印記：先收創作者月費學費，純 CPS 成交分潤；創作者前期 0 收益挫折感極重，被視為割韭菜。\n\n---\n\n## 2. 第四梯隊：共鳴創作者計畫之空白突圍 (White Space)\n\n本案在雙邊大腦中搶佔的全新生態位：  \n**「去中心化成果驗收共創網絡 (Decentralized Bounty Partner)」**\n\n- **對創作者**：不賣時間罰站，1 分鐘短影音，滿千觀看加互動秒領 $500，爆款單支最高 $3,500！\n- **對品牌老闆**：零觀看老闆付 $0 元，以 $40~$50 超低單價獲取真實買家名單與百萬爆款紅利！\n"
    },
    "00_core_positioning/02_white_space_verdict.md": {

      "name": "02_white_space_verdict.md",
      "isYaml": false,
      "raw": "# 階段二：心智階梯與生態位生態審計 (Mental Ladder & Ecosystem)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/02_category.yaml`](../_thinking/00_core/02_category.yaml)  \n> **定位狀態**：審計完成  \n\n---\n\n## 1. 現存市場三大既有心智梯隊對比\n\n短影音行銷生態中，品牌主與創作者早已被三種傳統模式所固化，每一種都存在無法調和的致命痛點：\n\n```mermaid\nquadrantChart\n    title 短影音外包與獲客模式生態位分佈\n    x-axis \"低確定性 (純賭博/0保底)\" --> \"高確定性 (有明確回報)\"\n    y-axis \"高成本 / 高摩擦\" --> \"低成本 / 高效率\"\n    quadrant-1 \"【本案生態位】共鳴創作者計畫\"\n    quadrant-2 \"傳統工時外包 (接案社團/外包網)\"\n    quadrant-3 \"海外純CPS分銷 (TikTok Affiliate/HU)\"\n    quadrant-4 \"官方投流廣告 (Meta/TikTok Ads)\"\n    \"傳統工時外包\": [0.75, 0.25]\n    \"官方投流廣告\": [0.85, 0.15]\n    \"海外純CPS分銷\": [0.15, 0.70]\n    \"共鳴創作者計畫\": [0.80, 0.85]\n```\n\n### 三大傳統模式之致命死穴：\n\n1. **傳統接案外包（以工時/檔案計費）**：\n   - **收費**：單支短影音 NT$ 800 ~ 2,500 元。\n   - **死穴**：**業主承擔所有風險**。創作者交出 MP4 檔案就結案，發上網只有 30 個人看，業主照樣付全額，ROI 極度不可測。\n2. **官方競價投流（Meta / TikTok Ads）**：\n   - **收費**：CPM NT$ 80 ~ 250，單個名單 NT$ 80 ~ 200。\n   - **死穴**：**租來的流量，廣告感極重**。觀眾看到贊助標籤直接滑走，且競價年年上漲，停投流量立刻歸零。\n3. **海外矩陣純 CPS 分銷（TikTok Affiliate / Andrew Tate HU）**：\n   - **收費**：0 底薪，成交抽成 5%~20% 或每個月先收創作者 $49 美元學費。\n   - **死穴**：**把銷售轉化風險全推給創作者**。90% 認真剪片的新手因初期 0 成交而心灰意冷放棄，流失率高達 95%，且被視為詐騙割韭菜。\n\n---\n\n## 2. 白地機會裁決 (White Space Verdict)\n\n市場留下的最大空白生態位是：  \n**「有保底成果驗收、讓創作者尊嚴勞動、同時讓品牌獲得真實互動名單的去中心化共創網絡」**。這個市場真空空白具有不可替代性：\n\n- **對創作者的佔位心智**：「不做超商廉價工，1 分鐘短影音，滿千自然觀看加互動秒領 $500，爆款單支最高 $3,500！」\n- **對品牌主的佔位心智**：「不付冤枉外包費，不買冰冷假廣告，以 $50 單價獲取高意圖真實名單與百萬自然曝光！」\n"
    },

      "name": "03_landmines_report.md",

      "raw": "# 階段三：戰略地雷排查與反脆弱防禦 (Strategic Landmines)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **定位狀態**：排查完畢  \n> **核心目標**：建立歷史倒閉避坑指南與死穴防火牆\n\n---\n\n## 🛑 四大潛在地雷與反脆弱排查避坑對策\n\n在執行「去中心化短影音賞金矩陣」時，市場上最容易踩入的四大地雷及本案的避雷規範：\n\n### 地雷 1：機器人刷量套利（Bots & Farms Arbitrage）\n*   **風險症狀**：職業刷手花 20 元買 1,000 播放量，向官方詐領 500 元賞金。\n*   **底層物理死穴**：刷純播放量極其便宜（協議請求成本 < 0.05 元），但刷「逼真的台灣住宅 IP 與真實停留時長」極其昂貴（成本高達 300~600 元，刷手套利直接倒賠）。\n*   **最有效、最輕鬆的避雷對策**：\n    1. **卡死後台受眾地理檢驗**：提報截圖中，受眾地區「台灣比例必須 ≥ 70%」，封殺海外廉價機房 IP。\n    2. **卡死 48~72 小時結算冷卻期**：影片發布滿 48 小時後才結算，避開瞬間灌水並等待平台自然清洗假量。\n    3. **CTA 由老闆決定，創作者完整傳達**：創作者負責把千人帶到攤位前，老闆負責決定促銷優惠誘因。\n\n### 地雷 2：素材千篇一律導致平台降權（Shadowban）\n*   **風險症狀**：所有創作者拿同一份官方錄屏與文案直接發布，被 TikTok / Reels 判定為搬運垃圾，直接鎖 0 播放。\n*   **避雷解法**：\n    - 官方絕不提供「整支成片」，只提供「心智模組彈藥庫」（30 組開頭鉤子、5 種痛點敘事、多套 CTA）。\n    - 創作者必須自行出鏡、重新剪輯配樂或二次原創，確保音頻與視覺特徵碼之唯一性。\n\n### 地雷 3：創作者因退件產生白嫖怨氣（Labor Friction）\n*   **風險症狀**：創作者花 1 小時拍完，老闆以「我覺得拍得不好看」為主觀理由拒付款，引發社群炎上。\n*   **避雷解法**：\n    - **全流程審核前置（Step 2 AI 預審）**：在創作者動工錄影前，AI 系統即針對大綱台詞評分。一旦預審通過，只要事後達標，官方無條件 48 小時內撥款，絕不刁難。\n\n### 地雷 4：爆款過多導致行銷預算穿透（Budget Runaway）\n*   **風險症狀**：多支影片衝上百萬播放，若採線性計費，老闆將面臨數十萬巨額支出。\n*   **避雷解法**：\n    - **對數平滑階梯封頂**：1k ($500) ➔ 10k ($1,200) ➔ 50k ($2,500) ➔ 100k ($3,500 封頂)。\n    - 單支影片流量賞金上限就是 $3,500 元，10 萬以上一律走純 CPS 導流分潤，邊際固定成本歸零。\n"
    },

      "raw": "# 階段三：四維定位假說收斂報告 (Positioning Hypotheses)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/03_hypotheses.yaml`](../_thinking/00_core/03_hypotheses.yaml)  \n\n---\n\n## 🎯 雙軌四維假說模型\n\n本專案居於雙邊市場樞紐，提出「雙軌推進、飛輪互哺」之戰略假說體系：\n\n### 軌道 A：大學生高時薪斜槓打工顛覆軌 (存量替代)\n*   **品類分化**：從傳統被動排班「體力打工」中分化出「成果導向影音共創」。\n*   **巨人對立**：直接對立超商、手搖飲、餐飲外場時薪 $185 罰站體力榨取。\n*   **極致取捨**：不承諾躺平暴富，只承諾「認真做出達標內容即享有超商 2.5~6 倍等效時薪」。\n*   **核心標語**：**「別再用青春罰站領 185！剪 1 分鐘短影音，滿千播放秒領 $500！」**\n\n### 軌道 B：品牌老闆去中心化成效獲客艦隊軌 (增量顛覆)\n*   **品類分化**：從傳統「賭博式外包與投流」中分化出「只為名單買單之素人推薦矩陣」。\n*   **巨人對立**：直接對立 Meta/TikTok 年年攀升之高昂 CPM 競價無底洞與傳統外包之 0 保證。\n*   **極致取捨**：不賣死板精修廣告，只賣生活場景中素人高轉化真誠體驗。\n*   **核心標語**：**「不用先砸十萬賭流量！發動百位創作者自建矩陣，每一塊錢只為真實觀看與買家名單買單！」**\n"
    },

      "raw": "# 階段四：紅隊與藍軍極限博弈審判辯論 (Red Team Debate)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/04_red_team_scores.yaml`](../_thinking/00_core/04_red_team_scores.yaml)  \n\n---\n\n## 🥊 雙軌紅隊極限壓力博弈對決\n\n### 審判 1：創作者流失與信心崩塌拷問\n- **紅軍發難**：\n  > 「如果學生連續拍了 2 支影片只有 500 播放沒達標，一毛錢拿不到，他會不會立刻放棄，覺得平台在白嫖他？」\n- **藍軍防禦**：\n  > 1. **短影音自然常態**：只要帳號正常且套用官方前 3 秒鉤子，破千是推薦池基準；\n  > 2. **爆款追溯補償機制**：影片留在創作者自己頻道上，只要第三支衝上 10k 爆款，獎金累計至 $1,200（大爆至 $2,500），一次把前兩支的工時溢價全額補齊！\n\n### 審判 2：機器人刷量黑客攻擊拷問\n- **紅軍發難**：\n  > 「台灣社群到處都是刷量工作室，花 20 元刷 1,000 播放詐領 500 元，平台第一天就會被刷破產！」\n- **藍軍防禦**：\n  > 1. **雙門禁鎖定**：只看播放數一律付 0 元！必須搭配留言區真實觀眾留言「+1/詢價」；\n  > 2. **後台受眾地理檢驗**：提報必須附帶後台數據截圖，台灣受眾比例低於 70% 視為無效數據，並設有 48hr 冷卻審核期。\n\n---\n\n## 🎯 決策閘門收斂判定\n審判結果證實：雙軌模式具備極高的抗風險能力，**准予推進決策閘門與後續模組放量！**\n"
    },

      "raw": "# 階段四與五：核心假說、雙邊攻防論證與決策門禁 (Decision Gate)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **門禁狀態**：**HUMAN_DECISION_GATE APPROVED (DUAL-SIDED ALIGNED)**  \n> **決策閘門結論**：本決策閘門確立「語言釘子」與雙邊核心承諾！\n\n---\n\n## 📌 核心武器錨點\n* **語言釘子 (Verbal Nail)**：不賣時間罰站，1分鐘短影音，滿千加互動秒領 $500！\n* **視覺錘 (Visual Hammer)**：手機入帳 $500 推播通知 ＋ 留言區 +1 滾動瀑布\n\n---\n\n## 🥊 雙邊紅藍軍深度攻防論證\n\n### 對決 A：品牌老闆端攻防\n- **紅軍質疑（老闆視角）**：\n  > 「學生素人自製的影片品質會不會很差？會不會拿我的產品亂講話，甚至破壞品牌形象？」\n- **藍軍抗辯（戰略防禦）**：\n  > 1. **AI 腳本預審 ＋ 彈藥庫模組化**：創作者不是天馬行空亂拍，必須套用官方提供的「前 3 秒開頭鉤子」與「痛點積木」。開機前必須經由 AI 預審通過，違規誇大與侵權一票否決。\n  > 2. **素人感才是當今短影音轉化的最高境界**：現在觀眾對精緻官方廣告已有強烈抗體，素人在生活場景中的真實體驗分享，轉換率往往是精修廣告的 3~5 倍！\n\n### 對決 B：創作者學生端攻防\n- **紅軍質疑（學生視角）**：\n  > 「如果我辛苦剪完影片發布，結果演算法只給我 500 觀看沒達到 1,000，我豈不是白忙一場被白嫖？」\n- **藍軍抗辯（戰略防禦）**：\n  > 1. **短影音演算法的自然常態**：只要不是搬運抄襲帳號，套用官方爆款開頭，突破 1,000 是平台基礎推薦池的標準常態。\n  > 2. **個人帳號資產留存與爆款追溯**：影片發在創作者自己的頻道，即使這支只有 500 播放，也為帳號累積了權重與內容；只要下一支衝上破萬爆款，獎金立刻追溯到 $1,200~$3,500，一次把前面的工時收益全數超額補齊！\n\n---\n\n## 🎯 終局拍板決策（雙邊定位宣言）\n\n1. **面對品牌老闆**：\n   - 定位為**「去中心化成效獲客艦隊」**。\n   - 核心承諾：零底薪風險、只為真實觀看與高意圖名單買單、$50 單價顛覆傳統投流。\n2. **面對創作者學生**：\n   - 定位為**「自由高薪影音共創舞台」**。\n   - 核心承諾：告別超商罰站、1分鐘滿千秒領 $500、AI 預審杜絕退件、自建個人賺錢頻道。\n"
    },

      "raw": "project_id: \"ugc_bounty_matrix\"\nmodule: \"jtbd_forces\"\nanalyzed_at: \"2026-11-28\"\n\ncreator_forces:\n  role: \"創作者端 / 大學生與青年斜槓 (供給方)\"\n  push_of_situation:\n    score: 9.2\n    pains:\n      - id: C-PUSH-1\n        title: \"超商/外場打工的體力榨取與廉價感\"\n        description: \"時薪僅 NT$ 185，必須連續站立 6~8 小時、搬重物、面對奧客，時間被嚴格綁死，身心俱疲且無技能積累。\"\n      - id: C-PUSH-2\n        title: \"傳統接案市場的白嫖與無限改稿\"\n        description: \"接案社團單支片開價 $500~$800，業主反覆改色調、字幕三四版，最後結算拖延數週甚至跳票。\"\n      - id: C-PUSH-3\n        title: \"個人自媒體起號的零收益焦慮\"\n        description: \"自己開帳號剪片發了十幾支，播放量卡在幾百，零變現路徑，找不到持續投入的理由。\"\n\n  pull_of_new:\n    score: 9.5\n    desires:\n      - id: C-PULL-1\n        title: \"1分鐘滿千秒領 $500 的即時爽感\"\n        description: \"做 1 支 1 分鐘短影音，自然推破 1,000 觀看（受眾台灣 >= 70%），立即領取 $500（超商 2.7 小時工資），48 小時入帳。\"\n      - id: C-PULL-2\n        title: \"爆款追溯與被動收入夢想\"\n        description: \"破萬加發 $1,200、破五萬加發 $2,500、破十萬加發 $3,500 封頂，且享受專屬碼永久 CPS 分潤。\"\n      - id: C-PULL-3\n        title: \"完全自由與自建帳號資產\"\n        description: \"不用幫老闆當槍手，影片發在自己頻道上；可用 AI 工具、無腦迷因或正經實測皆可，資產全歸自己。\"\n\n  habit_and_inertia:\n    score: 4.5\n    habits:\n      - id: C-HABIT-1\n        title: \"去既有兼職打工的舒適慣性\"\n        description: \"習慣了去實體店打卡上班的被動勞動模式，雖然累但不需要動腦思考文案與演算法。\"\n\n  anxiety_of_new:\n    score: 5.2\n    anxieties:\n      - id: C-ANXIETY-1\n        title: \"害怕被白嫖或拍完被退件\"\n        description: \"『如果我拍完了，老闆嫌不好看故意不給錢怎麼辦？』\"\n        countermeasure: \"AI 大綱 30 秒預審機制，審核前置；只要預審過且達標，官方保證撥款，絕不主觀挑刺。\"\n      - id: C-ANXIETY-2\n        title: \"害怕背負產品賣不動的業績壓力\"\n        description: \"『如果我拍了但沒人買，會不會拿不到錢？』\"\n        countermeasure: \"CTA 權責徹底解耦：結尾台詞由老闆自定，創作者只負責把 1,000 真人帶到攤位前，不考核成交轉換率。\"\n\n  verdict:\n    propelling_force: 18.7 # Push (9.2) + Pull (9.5)\n    dragging_force: 9.7 # Habit (4.5) + Anxiety (5.2)\n    net_momentum: 9.0 # 強烈前進動能\n\nboss_forces:\n  role: \"品牌老闆端 / 企業主與電商創辦人 (買單方)\"\n  push_of_situation:\n    score: 9.4\n    pains:\n      - id: B-PUSH-1\n        title: \"官方競價投流成本失控 (吸毒式流量)\"\n        description: \"Meta / TikTok 廣告 CPM 飆漲至 $180~$250，單個名單成本破 $150，很多還是誤觸路人；且停投流量立刻歸零，嚴重侵蝕淨利潤。\"\n      - id: B-PUSH-2\n        title: \"網紅與外包代操的『賭博式黑盒』\"\n        description: \"花數萬元發包接案或找網紅業配，交出 MP4 檔案後發布只有 300 播放，外包商與網紅推諉給演算法，老闆承擔 100% 虧損風險。\"\n      - id: B-PUSH-3\n        title: \"官方單一帳號廣告感過重與封禁風險\"\n        description: \"消費者看到官方品牌號本能滑走，信任度低；且單一帳號一旦踩線被降權封禁，全公司短影音資產瞬間化為烏有。\"\n\n  pull_of_new:\n    score: 9.6\n    desires:\n      - id: B-PULL-1\n        title: \"風險倒置：零觀看老闆付 $0 元\"\n        description: \"沒達到 1,000 播放老闆一毛錢不用付！把過去外包承擔的試錯風險徹底轉移，每一分預算都花在刀口上。\"\n      - id: B-PULL-2\n        title: \"掌控行銷主導權：CTA 由老闆親自決定\"\n        description: \"創作者保證把老闆指定的優惠碼與促銷指令完整傳遞給千人受眾，行銷誘因與成交抓手 100% 由老闆掌控。\"\n      - id: B-PULL-3\n        title: \"百位素人自建矩陣 ✕ 爆款超額流量白送\"\n        description: \"全台數十至數百位素人在個人頻道真實推薦，演算法多點開花；一旦出現 5 萬、10 萬大爆款，超額流量全部白送給品牌！\"\n\n  habit_and_inertia:\n    score: 5.0\n    habits:\n      - id: B-HABIT-1\n        title: \"既有投流習慣與代理商綁定路徑依賴\"\n        description: \"習慣了在後台無腦刷卡投廣告看儀表板，雖然貴但流程熟悉；或者習慣找熟識的傳統代操公司。\"\n\n  anxiety_of_new:\n    score: 5.5\n    anxieties:\n      - id: B-ANXIETY-1\n        title: \"害怕學生買機器人刷量詐領預算\"\n        description: \"『學生花 20 塊去蝦皮買 1,000 播放，我豈不是成冤大頭？』\"\n        countermeasure: \"黑產物理死穴反制：卡死受眾地區『台灣 ≥ 70%』截圖（刷台灣住宅真機成本需 $300~$600，刷手直接倒賠破產）＋ 48hr 冷卻審核。\"\n      - id: B-ANXIETY-2\n        title: \"害怕素人亂拍、品質粗糙破壞品牌形象\"\n        description: \"『如果學生在影片裡講錯話、踩醫療法規怎麼辦？』\"\n        countermeasure: \"AI 腳本大綱 30 秒預審：自動檢測安全紅線與品牌關聯度，踩線一票否決；且素人生活真實體驗轉化率遠高於死板精緻廣告。\"\n\n  verdict:\n    propelling_force: 19.0 # Push (9.4) + Pull (9.6)\n    dragging_force: 10.5 # Habit (5.0) + Anxiety (5.5)\n    net_momentum: 8.5 # 極高推動意願，痛點直擊老闆錢包\n"
    },

boss_cumulative: 3800 # 補差額 $2,000\n        platform_margin: 1300\n        effective_cpm: 76\n      viral_tier_3:\n        views: 100000\n        creator_cumulative: 3500 # 封頂加發 $1,000\n        boss_cumulative: 5000 # 封頂加付 $1,200\n        platform_margin: 1500\n        effective_cpm: 50\n      cps_commission:\n        description: \"10 萬觀看後流量費用封頂，轉入純 CPS 抽成：老闆付 25%~30%，創作者抽 15%~20%，平台淨賺 10%\"\n\n# 迭代紀錄\niteration_history:\n  - date: \"2026-11-28\"\n    phase: \"PHASE_00_PROJECT_INIT\"\n    decision: \"正式確立專案 ugc_bounty_matrix。定調對外品牌為『共鳴創作者計畫』，確立『滿千觀看＋有效導流』雙指標防刷結算模型與階梯指數稀釋財務曲線。\"\n"

      "name": "01_target_recon.md",
      "isYaml": false,
      "raw": "# 跨界突變升維分析報告 (Cross-Industry Mutation Report)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/cross_industry/cross_industry_model.yaml`](../../_thinking/cross_industry/cross_industry_model.yaml)  \n> **模組狀態**：突變完成  \n> **核心目標**：**高價值目標界三大篩選漏斗與心智真空探測**  \n> **核心結論**：**吸取 Web3 賞金之透明、TikTok 矩陣之裂變、外送零工之靈活，在目標界中徹底剔除三者的詐騙與剝削弊端，雜交出全新物種！**\n\n---\n\n## 1. 三大跨界物種基因雜交模型\n\n```mermaid\nflowchart TD\n    classDef w3 fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef tt fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n    classDef gig fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef our fill:#fce4ec,stroke:#c2185b,stroke-width:3px,color:#111827;\n\n    W3[\"1. Web3 Bounties (加密賞金)<br/>• 借其: 成果達標即撥款之透明機制<br/>• 剔除: 虛擬空氣幣與審核黑箱\"]:::w3\n    TT[\"2. TikTok 矩陣 / HU (切片裂變)<br/>• 借其: 去中心化多號開花與 CPS 抽成<br/>• 剔除: 先繳學費傳銷感與純賭運氣\"]:::tt\n    GIG[\"3. Uber / 外送 (零工經濟)<br/>• 借其: 手機隨時隨地開工的極致自由<br/>• 剔除: 體力罰站與無技能積累\"]:::gig\n\n    W3 & TT & GIG --> OUR[\"【本案新物種】共鳴創作者計畫<br/>• 現金成果保底 ($500)<br/>• 爆款指數平滑 (最高 $3,500)<br/>• 終生零收費 + 個人自媒體資產留存\"]:::our\n```\n\n---\n\n## 2. 跨界突變優勢對比矩陣\n\n| 跨界對象 | 原始行業的死穴 (Deadly Flaws) | 本案突變升維後的解決方案 (Mutation Edge) |\n| :--- | :--- | :--- |\n| **Web3 Bounties** | 發放代幣容易歸零、提現門檻高、審核黑箱常跳票。 | **新台幣真金白銀**：達標後 48 小時內銀行直接匯款入帳。 |\n| **TikTok Affiliate / HU** | 新手前期 0 收益挫折感極大（90% 流失）、先收會費被視為詐騙。 | **降低承諾門檻**：不賭終端下單，只要「滿千＋留言互動」即保底 $500；**終生零收費**贏得信任。 |\n| **Uber / 外送工讀** | 日曬雨淋、有交通事故風險、時薪固定鎖死在 $185。 | **室內數位創作**：一部手機開工，換算實質時薪 $475~$1,200，且為自己累積百萬播放與粉絲個人資產。 |\n"
    },

      "raw": "# 跨界能力逆向整合度與非對稱防禦橋接 (Capability Bridge)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/cross_industry/cross_industry_model.yaml`](../../_thinking/cross_industry/cross_industry_model.yaml)  \n\n---\n\n## 🌉 跨界能力逆向整合度評估 (Fit Index ≥ 4.0)\n\n本專案跨界突變之成敗，取決於能否將「Web3 的公開賞金激勵」、「TikTok 的矩陣裂變切片」與「零工經濟的無拘束」無縫焊接：\n\n| 跨界借鏡構件 | 本業核心實力之橋接能力 | 整合度評分 (1~5分) | 評定理由與防禦紅線 |\n| :--- | :--- | :---: | :--- |\n| **賞金雙門禁驗證** | 自研 AI 30 秒大綱質檢 ＋ 後台受眾數據審核流程 | **4.9 分** | 徹底杜絕 Web3 的審核黑箱與空氣幣，以新台幣現金 48 小時內秒結。 |\n| **矩陣自建帳號裂變** | 模組化彈藥庫（30 組開頭鉤子 ＋ 痛點積木） | **4.8 分** | 創作者無需自行構思劇本，降低動工門檻，且避開搬運被降權的陷阱。 |\n| **高意圖自動私訊** | ManyChat 關鍵字自動觸發 ＋ 專屬領取短鏈 | **4.7 分** | 解決短影音難以直接放可點擊外鏈的平台限制，打造順暢轉化閉環。 |\n\n> **綜合整合度評分**：**4.8 分**（遠超 4.0 分門檻），確認該跨界突變高度可行，絕非生硬硬湊！\n"
    },

      "isYaml": false,
      "raw": "# 跨界目標界新品類命名與測謊方案 (Category Naming & Testing)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/cross_industry/cross_industry_model.yaml`](../../_thinking/cross_industry/cross_industry_model.yaml)  \n\n---\n\n## 🏷️ 目標界新品類命名轉譯\n\n嚴禁在市場上自稱「影音剪輯代操」或「分銷聯盟」，必須在目標界語境中確立新身份：\n\n*   **品類新名稱**：**「去中心化成果驗收共創網絡 (Decentralized Bounty Partner)」**\n*   **品類心智定位**：\n    - 在創作者心智中：**「不賣時間罰站、滿千有保底的自媒體成長舞台」**\n    - 在品牌主心智中：**「零觀看不給錢、每一分錢只買買家名單的獲客艦隊」**\n\n---\n\n## 🧪 零代碼預售測謊路線圖\n\n1. **第 1 階段：種子創作者招募測謊**\n   - 在 Dcard / 大學生社群發布「1 分鐘短影音滿千領 $500」招募貼文，目標 48 小時內吸引 20 位學生報名加入。\n2. **第 2 階段：首批 10 支影片實測測謊**\n   - 投產 10 支影片，驗證是否有 3 支以上突破 1,000 播放，並產生至少 30 則留言 +1 互動。\n3. **第 3 階段：品牌主商業閉環測謊**\n   - 拿這 10 支實測數據向中小企業主提案 NT$ 38,000 種子包，測出老闆真實掏錢付費意願！\n"
    },

      "raw": "# JTBD 痛點剛度與前進動力分析報告 (JTBD Forces Matrix)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/jtbd_forces/jtbd_model.yaml`](../../_thinking/jtbd_forces/jtbd_model.yaml)  \n> **模組狀態**：審定通過 (雙邊 JTBD 深度對齊)  \n> **核心結論**：  \n> • **創作者端淨動能 +9.0**（前進推動力 18.7 >> 後退阻力 9.7）  \n> • **品牌老闆端淨動能 +8.5**（前進推動力 19.0 >> 後退阻力 10.5）  \n> **雙邊市場痛點均具備極強剛度，能同時引發供給端瘋狂出片與需求端爽快掏錢！**\n\n---\n\n## 🧭 雙邊前進四力動能對照模型 (Dual-Sided Four Forces)\n\n```mermaid\nflowchart TD\n    classDef push fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef pull fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef habit fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef anxiety fill:#ede7f6,stroke:#4527a0,stroke-width:2px,color:#111827;\n\n    subgraph BOSS [\"【角色 A：品牌老闆端 (買單方)】淨動能: +8.5\"]\n        BP[\"1. 現狀痛苦推力 (Push: 9.4)<br/>• 官方投流成本年年飆漲，停投即死<br/>• 網紅代操 0 保證，花數萬只得 300 播放<br/>• 官方單一號廣告感重，消費者直接滑走\"]:::push\n        BPL[\"2. 新品類吸引力 (Pull: 9.6)<br/>• 零觀看付 $0 元，風險徹底倒置<br/>• CTA 誘因完全由老闆自定主導<br/>• 百位素人矩陣擴散，百萬爆款超額流量白送\"]:::pull\n        BH[\"3. 既有習慣 (Habit: 5.0)<br/>• 習慣後台刷卡投流或熟識代理商\"]:::habit\n        BA[\"4. 嘗新焦慮 (Anxiety: 5.5)<br/>• 怕機器人假量 ➔ 卡死台灣>=70%截圖消除<br/>• 怕素人亂講 ➔ AI 30秒預審守住紅線\"]:::anxiety\n    end\n\n    subgraph CREATOR [\"【角色 B：創作者學生端 (供給方)】淨動能: +9.0\"]\n        CP[\"1. 現狀痛苦推力 (Push: 9.2)<br/>• 超商外場時薪 $185 罰站體力榨取<br/>• 接案社團改稿改到半夜被惡意拖欠<br/>• 個人起號零變現之巨大無力感\"]:::push\n        CPL[\"2. 新品類吸引力 (Pull: 9.5)<br/>• 1分鐘滿千秒領 $500 (時薪翻2.5~6倍)<br/>• 爆款階梯追溯至 $3,500 ＋ 永久抽成<br/>• 完全自由創作 (可用AI/迷因)，不背業績\"]:::pull\n        CH[\"3. 既有習慣 (Habit: 4.5)<br/>• 習慣不動腦的被動排班實體工讀\"]:::habit\n        CA[\"4. 嘗新焦慮 (Anxiety: 5.2)<br/>• 怕拍完被白嫖 ➔ AI 預審綠燈必撥款<br/>• 怕賣不動拿不到錢 ➔ 權責解耦不看轉換率\"]:::anxiety\n    end\n\n    BP & BPL -. \"推動切換\" .-> BH & BA\n    CP & CPL -. \"推動切換\" .-> CH & CA\n```\n\n---\n\n## 👔 角色 A：品牌老闆端 JTBD 痛點推拉力深剖 (Boss Perspective)\n\n老闆雇用（Hire）本計畫的核心工作（Job to be Done）：  \n**「在不承擔巨額試錯虧損的前提下，以最低單價取得大量真實台灣受眾的注意力與高意圖買家諮詢！」**\n\n### 1. 現狀痛苦推力 (Push: 9.4 分)\n*   **痛點 B-1（吸毒式流量）**：Meta / TikTok 競價廣告 CPM 居高不下（$180~$250），名單單價破 $150 且包含大量誤觸路人；一旦停投，業績立即斷崖式下跌。\n*   **痛點 B-2（外包抽卡賭博）**：找網紅業配一支動輒數萬，發布後若演算法不給量，網紅推諉給平台，老闆承擔 100% 虧損。\n*   **痛點 B-3（官方號信任崩塌）**：消費者對品牌官方號有天然戒心，看見「贊助」標籤 1.5 秒內滑走。\n\n### 2. 新品類吸引力 (Pull: 9.6 分)\n*   **吸引力 B-1（絕對安全邊際）**：**零觀看老闆付 $0 元！** 每一筆預算都只為通過台灣真人演算法檢驗的達標影片買單。\n*   **吸引力 B-2（掌控行銷誘因）**：**結尾 CTA 由老闆親自決定！** 創作者負責將 1,000 個真人帶到攤位前，老闆負責決定攤位放 9 折碼還是免費樣品，誘因主導權 100% 在手。\n*   **吸引力 B-3（超額爆款紅利）**：動員百位創作者自建矩陣，一旦出現 5 萬、10 萬大爆款，暴增的數十萬次曝光全數白送給老闆！\n\n### 3. 阻力與焦慮粉碎機制 (Anxiety Killers for Boss)\n*   **焦慮：學生買機器人刷量怎麼辦？**  \n    ➔ **物理死穴反制**：卡死「後台受眾台灣 ≥ 70% 截圖」（刷台灣真機住宅 IP 成本高達 $300~$600，刷手直接倒賠破產）＋ 48 小時冷卻期。\n*   **焦慮：學生亂拍破壞形象怎麼辦？**  \n    ➔ **AI 預審機制**：開機前自動檢測法規紅線與品牌關聯度，踩線一票否決；且素人生活真實感轉化率遠勝死板精緻廣告。\n\n---\n\n## 🙋‍♂️ 角色 B：創作者學生端 JTBD 痛點推拉力深剖 (Creator Perspective)\n\n創作者雇用（Hire）本計畫的核心工作（Job to be Done）：  \n**「在不被排班綁死、不出賣體力、不背負業績壓力的前提下，用手機與短影音創意換取遠高於超商的高額時薪！」**\n\n### 1. 現狀痛苦推力 (Push: 9.2 分)\n*   **痛點 C-1（體力榨取）**：超商餐飲時薪僅 $185，連續罰站 8 小時身心俱疲，且無任何自媒體複利技能積累。\n*   **痛點 C-2（被白嫖刁難）**：接案市場業主反覆改稿四五版，結算拖延數週甚至跳票。\n*   **痛點 C-3（起號無收益）**：自己做帳號卡在幾百播放無法變現，缺乏正反饋。\n\n### 2. 新品類吸引力 (Pull: 9.5 分)\n*   **吸引力 C-1（時薪碾壓）**：1 分鐘短影音耗時 45 分鐘，滿千領 $500，等效時薪 $475~$1,200（超商 2.5~6.5 倍）。\n*   **吸引力 C-2（創作完全自由）**：真人拍、無腦迷因演、或全程用 AI 剪輯皆可，平台 100% 擁抱 AI 工具！\n*   **吸引力 C-3（爆款被動收入）**：破萬加發 $1,200、破五萬加發 $2,500、破十萬加發 $3,500 封頂，且享受長尾 CPS 抽成。\n\n### 3. 阻力與焦慮粉碎機制 (Anxiety Killers for Creator)\n*   **焦慮：拍完被老闆嫌難看故意不給錢？**  \n    ➔ **AI 綠燈保險**：大綱通過 AI 30 秒預審即官方背書，達標必撥款，任何人不能憑主觀挑刺。\n*   **焦慮：萬一沒人買東西，我會不會被扣錢？**  \n    ➔ **權責徹底解耦**：產品賣不賣得動是老闆定價和 CTA 的事，創作者只負責內容與千人曝光，不考核成交轉換率！\n\n---\n\n## 🎯 雙邊前進動能總結\n本案的商業切入點之所以無懈可擊，在於**同時解決了老闆「怕買到假流量與高風險」的深夜痛點，以及學生「怕出賣體力與被白嫖」的現實困境**，雙向淨動能（+8.5 與 +9.0）共同驅動去中心化飛輪高速旋轉！這套痛點分析也直接轉化為創作者前 3 秒開頭 Hook 庫的底層心理動能！\n"
    },

      "raw": "# 官方普查與商業規模測算報告 (Market Sizing Census Report)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/market_sizing/census_model.yaml`](../../_thinking/market_sizing/census_model.yaml)  \n> **模組狀態**：測算完成  \n> **數據來源**：台灣教育部統計處大專校院校務統計 ✕ 主計總處青年勞動與斜槓普查  \n\n---\n\n## 1. 商業規模三級測算模型 (TAM / SAM / SOM)\n\n```mermaid\nflowchart TD\n    classDef tam fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef sam fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n    classDef som fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n\n    TAM[\"1. TAM (全台大專打工族 ＋ 斜槓影音創作者)<br/>• 創作者總母體: 155 萬人<br/>• 宏觀短影音潛在年產值: NT$ 93 億元\"]:::tam\n    --> SAM[\"2. SAM (具備手機剪輯能力且渴望靈活高薪之核心群體)<br/>• 核心活躍大學生群體: 19.7 萬人<br/>• 年外包可服務產值: NT$ 11.8 億元\"]:::sam\n    --> SOM[\"3. SOM (啟動 1~2 年目標簽約活躍夥伴)<br/>• 平台活躍創作者: 6,000 位<br/>• 年撮合交付影片: 43.2 萬支<br/>• 平台年交易額 (GMV): NT$ 2.16 億元<br/>• 平台年營收 (20% 服務抽成): NT$ 4,320 萬元\"]:::som\n```\n\n---\n\n## 2. 雙邊市場供需規模撮合推演\n\n### (1) 供給端（大學生打工池）：\n- 台灣大專在學生約 114 萬人，工讀打工比例高達 62%（約 70.6 萬人）。\n- 其中超過 28%（約 19.7 萬人）平時即有使用 CapCut/剪映、IG Reels 發短影音之習慣。\n- **結論**：供給端池子極大，只要「滿千領 $500」的即時兌現口碑在校園社群傳開，獲取創作者的邊際成本極低。\n\n### (2) 需求端（中小企業與品牌主獲客池）：\n- 台灣中小企業超過 160 萬家，其中至少 20 萬家急需透過短影音獲取新客。\n- 只要有 500~1,000 家品牌主每月撥出 2~5 萬元的獲客預算，即可完全吃下數千名創作者的產能，達到 **供需平衡且高利潤運轉**。\n"
    },
    "modules/mental_weapons/06_brand_channel_ip.md": {
      "path": "modules/mental_weapons/06_brand_channel_ip.md",
      "title": "品牌頻道 IP 矩陣 ✕ 三大直球欄目 ✕ 敏捷開機 SOP (Brand Channel IP)",
      "name": "06_brand_channel_ip.md",
      "isYaml": false,
      "raw": "# 品牌頻道 IP 矩陣 ✕ 三大直球欄目 ✕ 敏捷開機 SOP (Brand Channel IP)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/mental_weapons/weapons_matrix.yaml`](../../_thinking/mental_weapons/weapons_matrix.yaml)  \n\n---\n\n## 📺 三大直球欄目規劃 (The 3 Pillar Formats)\n\n為了讓全台創作者矩陣在演算法上持續獲得推薦，官方設計三大定位鮮明的常態欄目：\n\n### 欄目 1：【超商逃離日記】（打造學生斜槓打工標竿 IP）\n*   **定位**：專門記錄年輕人「如何用短影音技能替代體力勞動」的真實成長歷程。\n*   **更新頻率**：每週 2~3 支。\n*   **內容主線**：曬收益截圖、分享開頭 3 秒鉤子心得、採訪同學加入後的改變。\n*   **吸睛標籤**：`#大學生打工` `#短影音變現` `#拒絕超商罰站` `#共鳴計畫`\n\n### 欄目 2：【真假神器測謊局】（打造客觀好物推薦 IP）\n*   **定位**：站在消費者視角「替大家實測排雷、找出真正寶藏神器」。\n*   **更新頻率**：每週 1~2 支。\n*   **內容主線**：拿市售痛點產品與合作產品對比，暴力實測，最後給出良心評價並發放專屬折扣。\n*   **吸睛標籤**：`#好物推薦` `#生活神器` `#避坑指南` `#真實開箱`\n\n### 欄目 3：【30秒避坑小課堂】（打造專業乾貨與教學 IP）\n*   **定位**：快速輸出實用技巧與省錢攻略。\n*   **更新頻率**：每週 3 支。\n*   **內容主線**：極短快節奏乾貨，引發觀眾收藏與轉發。\n\n---\n\n## 👤 創作者角色卡體系 (Creator Persona Cards)\n\n官方引導創作者認領的三大角色定位（不用每個人都一樣）：\n\n| 角色卡代號 | 角色人設名稱 | 核心說話語氣與視覺特徵 | 適合發揮的型態 |\n| :--- | :--- | :--- | :--- |\n| **IP-A** | **「耿直大膽的打工大學生」** | 說話接地氣、帶點幽默自嘲、真實不做作，代表廣大學生發聲。 | 型態 P-1（生活反差）、型態 P-3（微短劇） |\n| **IP-B** | **「毒舌理性的實測學長/姐」** | 凡事講求數據、討厭智商稅、專挑產品缺點講，信任度極高。 | 型態 P-2（暴力實測）、型態 P-4（避坑乾貨） |\n| **IP-C** | **「低調神秘的剪輯技術宅」** | 不露臉、只靠神級卡點節奏與 AI 旁白說話，畫面極致絲滑。 | 型態 P-5（無臉錄屏 AI 剪輯） |\n\n---\n\n## 🚀 創作者 1~4 週敏捷開機 SOP (Agile Onboarding)\n\n*   **第 1 週（破冰起跑）**：\n    - 領取官方專屬身分代碼與 30 組標題庫。\n    - 挑選【型態 P-1】或【型態 P-3】發布前 2 支影片，達成人生第一筆 $500 元成果獎金。\n*   **第 2 週（數據微調）**：\n    - 檢視後台留存率，由 AI 預審微調前 3 秒開頭鉤子。\n    - 留言區部署自動私訊（ManyChat），將互動率提升至 10 人以上。\n*   **第 3 週（衝刺爆款）**：\n    - 嘗試【型態 P-2 暴力實測】，追逐演算法第一波破萬推薦，解鎖 $1,200 累計賞金。\n*   **第 4 週（被動分潤期）**：\n    - 帳號權重提升，建立專屬標籤，開啟長尾 CPS 訂單抽成，每月享有持續被動現金流。\n"
    },

      "raw": "# 創作者實拍型態庫 ✕ 微短劇故事重構 ✕ 發射載體 ✕ CTA 積木庫 (Creative Archetypes)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/mental_weapons/weapons_matrix.yaml`](../../_thinking/mental_weapons/weapons_matrix.yaml)  \n> **使用對象**：簽約合作創作者、大學生兼職夥伴、自媒體號主  \n> **核心定位**：**短影音心智武器之獨立實拍發射載體**  \n\n---\n\n## 🎭 P-1~P-5 五大實拍創作型態庫 (The 5 Creative Archetypes)\n\n為了讓創作者不卡關、不離題，官方提供五種可直接對照演出的實拍型態：\n\n### 【型態 P-1：真實生活反差型（適合學生日常日常）】\n*   **視覺符號**：宿舍書桌、泡麵、剛下課的書包。\n*   **敘事結構**：從「超商打工累成狗」或「月底吃土」切入 ➔ 拿出一支手機開始剪輯 ➔ 手機震動跳出 $500 入帳推播 ➔ 真實驚喜神情。\n*   **完播心法**：前 3 秒禁止任何廣告感，完全是朋友聊天視角，真實感拉滿。\n\n### 【型態 P-2：產品暴力實測拆解型（適合好物與神器推廣）】\n*   **視覺符號**：桌面乾淨、特寫鏡頭、強烈對比道具。\n*   **敘事結構**：提出一般市售產品的 3 大坑點 ➔ 拿出推薦神器一秒解決 ➔ 畫面特寫操作流暢度 ➔ 觀眾看完立即被種草。\n*   **完播心法**：用快節奏剪輯配卡點音效，15 秒內完成「質疑 ➔ 實測 ➔ 打臉 ➔ 臣服」心理曲線。\n\n### 【型態 P-3：微短劇反轉型（高完播率之王）】\n*   **角色設定**：兩個學生（室友 A：剛從手搖飲打工下班滿身大汗；室友 B：在床上優雅吹冷氣玩手機）。\n*   **劇情衝突**：\n    - A 抱怨：「今天又被奧客搞，站了 4 小時才賺七百塊，累死了……你怎麼整天躺著還有錢叫外送？」\n    - B 微笑把手機給 A 看：「因為我剛剪完一支 1 分鐘短影音，系統剛撥款 500 給我。」\n    - A 驚呼：「真的假的？！教我！」\n    - B 轉向鏡頭：「想要領彈藥庫的，留言區留【+1】我發給你！」\n\n### 【型態 P-4：乾貨避坑與逆向教學型（適合知識與自媒體個人號）】\n*   **視覺符號**：綠幕背景、圖文高亮圈選、口播語速明快。\n*   **敘事結構**：「90% 的人都不知道這個省錢密碼」➔ 拆解官方活動與優惠漏洞 ➔ 指引領取路徑。\n\n### 【型態 P-5：無臉錄屏 AI 解說型（適合不想露臉的創作者）】\n*   **視覺符號**：高畫質螢幕錄製 ＋ AI 擬真人聲配音 ＋ 醒目卡點花字字幕。\n*   **敘事結構**：直球演示軟體/工具/產品使用前後對比，零社交負擔開工。\n\n---\n\n## 🧱 萬用直球 CTA 積木庫 (Call-To-Action Blocks)\n\n影片最後 5 秒必須強制套用以下三組直球積木之一，杜絕「謝謝觀看」的無效結尾：\n\n1. **【互動導流型積木】**：\n   > **「想要領取完整清單/優惠券的，不要到處找了，直接在留言區留【+1】，我私訊發給你！」**\n2. **【主頁外鏈型積木】**：\n   > **「限時折扣碼我放在個人主頁第一條連結，點進去直接現折 200，手慢就搶完了！」**\n3. **【兼職招募型積木】**：\n   > **「別再問我怎麼加入的，留言區留【我想做】，官方彈藥庫直接免費私訊發你！」**\n\n---\n\n## ✅ 創作者開機自我檢核表 (Pre-Flight Checklist)\n\n創作者按下「錄影鍵」前必須自檢的四大指標：\n- [ ] 前 3 秒是否出現明確衝突、痛點或數字？（嚴禁自我介紹）\n- [ ] 聲音是否清晰、環境無嘈雜噪音？\n- [ ] 結尾是否包含明確的 CTA 指令（留+1 或點主頁）？\n- [ ] 腳本大綱是否已通過 AI 預審（未踩誇大、醫療療效等違禁紅線）？\n"
    },

      "raw": "# 特勞特定位 8 大心智武器庫實戰手冊 (Mental Weapons Kit)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/mental_weapons/weapons_matrix.yaml`](../../_thinking/mental_weapons/weapons_matrix.yaml)  \n> **模組狀態**：實戰就緒  \n> **核心定位**：**去中心化短影音外包分銷矩陣 ✕ 成果驗收保底 ✕ 爆款指數稀釋**\n\n---\n\n## 🎯 8 大心智武器總覽架構\n\n```mermaid\nflowchart TD\n    subgraph MindEntry [\"大腦進入層 (1~3 秒)\"]\n        W1[\"1. 語言釘子 (Verbal Nail)<br/>不賣時間罰站，1分鐘短影音，滿千加互動秒領 $500！\"]\n        W2[\"2. 視覺錘 (Visual Hammer)<br/>手機跳出入帳通知 ＋ 留言區 +1 刷屏瀑布\"]\n        W3[\"3. 品類新坐標 (Category Name)<br/>去中心化成果驗收共創網絡\"]\n    end\n\n    subgraph MindBattle [\"心智對決層 (3~10 秒)\"]\n        W4[\"4. 戰略公敵標靶 (Anti-Position)<br/>打倒超商罰站廉價工 ✕ 傳統外包改稿白嫖\"]\n        W5[\"5. 三大硬核信任狀 (The 3 RTBs)<br/>成果保底 ✕ 爆款稀釋 ✕ AI 預審防刷棧\"]\n        W6[\"6. 致命異議爆破彈 (Objection Killer)<br/>大綱預審通過即背書，達標48hr必撥款！\"]\n    end\n\n    subgraph MindSpread [\"口碑與傳播層 (自主裂變)\"]\n        W7[\"7. 市井轉述口金句 (Social Currency)<br/>『昨天發一支滿千人看，500元秒入帳，比超商好賺太多！』\"]\n        W8[\"8. 公關新聞引爆點 (PR Spike)<br/>『大學生打工革命：超商離職潮與短影音共創現象』\"]\n    end\n```\n\n---\n\n### 武器 1：語言釘子 (Verbal Nail)\n> **「不賣時間罰站，用好內容創造真實共鳴！1 分鐘短影音，滿千自然觀看加互動現領 $500，爆款單支最高 $3,500 ＋ 永久導流分潤！」**\n*   **作戰目的**：直接把「超商打工罰站」與「短影音現賺 500」做強烈反差，1 秒扎入大學生與斜槓族心智。\n\n### 武器 2：視覺錘 (Visual Hammer)\n*   **超級符號**：**「左邊是銀行/街口入帳 $500 元的推播通知，右邊是短影音留言區觀眾瘋狂留言『+1、已私訊』的滾動瀑布」**。\n*   **心智暗示**：這不是虛無縹緲的畫大餅，而是看得見的真金白銀與熱烈反饋。\n\n### 武器 3：品類新坐標 (Category Anchor)\n*   **新品類名**：**去中心化成果驗收共創網絡 (Decentralized Bounty Partner)**\n*   **借用認知**：告別傳統「按工時外包」的剝削與「純 CPS 分銷」的零底薪，建立「有保底成果驗收、爆款加碼分享」的新物種。\n\n### 武器 4：戰略公敵標靶 (Anti-Positioning)\n*   **三大公敵**：\n    1. 超商/餐飲工讀生時薪 185 元的被動體力罰站。\n    2. 傳統接案業主反覆刁難改稿、結算拖延的白嫖行徑。\n    3. 海外傳銷式矩陣先收創作者學費、0 成交即 0 收入的割韭菜行為。\n\n### 武器 5：三大硬核信任狀 (Reason to Believe, RTB)\n1. **成果保底雙門禁**：滿 1,000 觀看 ＋ 5~10 則真實互動/15次點擊，直接鎖定單個高意圖名單成本在 $30~$50。\n2. **對數平滑階梯稀釋**：1k ($500) ➔ 10k ($1,200) ➔ 50k ($2,500) ➔ 100k ($3,500 封頂)，品牌平均 CPM 降至 $35 元。\n3. **AI 預審機制**：30 秒大綱質檢，開機前確認合規；結算配合後台受眾台灣 >70% 截圖，杜絕一切假流量。\n\n### 武器 6：致命異議爆破彈 (Objection Killer)\n*   **創作者最大恐懼**：「我拍完了，老闆挑刺說不好看故意不給錢怎麼辦？」\n*   **直球擊碎話術**：\n    > **「我們只做客觀數據驗收，絕不憑老闆主觀審美退件！只要你的大綱通過 Step 2 AI 預審，且發布後達到 1,000 播放與基本互動，48 小時內系統自動撥款，絕不刁難！」**\n\n### 武器 7：市井轉述社交金句 (Social Currency)\n*   **大學生向同學炫耀的口語**：\n    > **「欸，我昨天剪了一支 1 分鐘影片發在自己 IG，剛破千人看，500 塊真的秒入帳！比在飲料店搖飲料搖 3 個小時爽太多了，你要不要也來做？」**\n\n### 武器 8：公關新聞引爆點 (PR Spike)\n*   **新聞話題引爆**：\n    > **《大學生打工新常態：超商掀起逃離潮？用短影音自然流換取時薪 475 元的共鳴創作者生態》**\n\n---\n\n## 👔 特別加收：面向品牌老闆 (Boss) 商務洽談銷售戰鬥卡 (Sales Battlecard)\n\n當面對企業主、中小企業老闆提案本合作時，直接調用以下四大封喉話術：\n\n1. **破冰話術（打碎傳統投流信仰）**：\n   > 「老闆，現在 Meta 廣告費越來越貴、買名單一個都要一百多塊，而且停投流量就死。我們這套計畫不是叫你花大錢買廣告，而是幫你發動全台灣幾十位素人創作者，在他們自己的帳號幫你推薦。重點是：**影片沒達到 1,000 播放、沒帶來留言互動，你一毛錢都不用付！**」\n2. **信任防禦（消除品質擔憂）**：\n   > 「你一定會擔心學生亂拍。我們有自研的 **AI 腳本預審系統**，開機前就把開頭鉤子、產品利益點和法規紅線鎖死，既保留素人的真誠真實感，又保證商業訴求精準傳達。」\n3. **終局算盤（算帳給老闆看）**：\n   > 「你撥 5 萬元預算，可以買到 100 支達標的短影音、至少 10 萬次自然真實曝光，而且直接帶來 500~1,000 個留言 +1 的真實買家名單！換算下來一個潛在客戶只要 $50 塊。而且只要裡面爆了 2 支破萬影片，所有的超額自然流量全都白送給你！」\n"
    },

      "raw": "# 創作者實戰彈藥庫 ‧ 30 組直球標題庫與口播腳本深稿 (Video Testing Scripts)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **使用對象**：簽約合作創作者、大學生斜槓夥伴、自媒體號主  \n> **規格標準**：前 3 秒強鉤子 ✕ 痛點共鳴 ✕ 解決方案 ✕ 留言區直球 CTA  \n> **核心資產**：**官方 30 組核心標題庫與實拍腳本**\n\n---\n\n## 💥 30 條直球開頭黃金鉤子與標題庫清單 (The 30 Golden Hooks)\n\n### 分類 A：打工抗拒與時薪對比類（針對大學生/兼職族）\n1. 「如果你還在超商罰站 8 小時賺 185，請立刻把這支影片看完！」\n2. 「這是我大學打工做過最爽的一份工作，在家剪 1 分鐘片現賺 500。」\n3. 「別再用青春去搖飲料了！教你用手機零成本做出能領薪水的短影音。」\n4. 「時薪 185 vs 1分鐘賺 500，聰明的大學生早就這樣選了。」\n5. 「為什麼我們學校越來越多同學，開始不想去外包接案了？」\n6. 「花 1 小時看劇，跟花 1 小時剪片現領 500，你選哪一個？」\n7. 「這家公司居然只要影片破 1,000 人看就直接發錢，是不是搞慈善？」\n8. 「室友問我為什麼都不出門上班，卻每週都有錢吃大餐？」\n9. 「算筆帳給你看：在超商罰站一整天，還不如剪兩支好影片。」\n10. 「拒絕當廉價工讀生！大學生用自媒體賺第一桶金的真實路徑。」\n\n### 分類 B：產品神器與真實體驗類（針對觀眾導流）\n11. 「這是我今年用過最相見恨晚的神器，早知道 3 年前就該買了！」\n12. 「千萬別隨便買這個，因為用過之後你就再也回不去了。」\n13. 「如果你的生活常常遇到這個爛問題，花 10 秒看我怎麼解決。」\n14. 「全網都在推的這個東西到底是不是智商稅？我實測給你看。」\n15. 「後悔沒有早點發現！這個小東西幫我省下了整整 3 個小時。」\n16. 「身邊朋友都在問我這到底是什麼黑科技？今天一次說清楚。」\n17. 「如果你跟我一樣痛恨這件事，那你一定要試試看這個方法。」\n18. 「花小錢解決大麻煩！連我媽用了都說讚的生活必備好物。」\n19. 「被問了 800 次的秘密終於公開了，記得先點讚收藏免得找不到。」\n20. 「這不是業配，這是我自己掏錢買了三次還在用的寶藏產品。」\n\n### 分類 C：乾貨避坑與逆向思維類（針對高轉化觀眾）\n21. 「90% 的人都不知道，其實只要改掉這個習慣就能省下一大筆錢！」\n22. 「如果你正在找解決方案，聽我一句勸：先別急著花大錢。」\n23. 「實話實說！市面上同類產品這麼多，為什麼我只認準這一家？」\n24. 「這是我花了 3,000 塊買教訓才總結出來的經驗，免費告訴你。」\n25. 「別再傻傻踩坑了！三招教你挑出最適合自己的真正好貨。」\n26. 「這款神作到底是怎麼做到評價一面倒的？看完你就懂了。」\n27. 「如果你每個月都在為這件事煩惱，這支影片就是為你拍的。」\n28. 「花 30 秒學會這一招，讓你少走 3 個月彎路。」\n29. 「很多人問我差在哪裡？今天直接上對比給你看，一目了然！」\n30. 「想要徹底搞定這個問題？看這一支影片就完全足夠了！」\n\n---\n\n## 🎬 兩套標準 60 秒四層口播實拍深稿範本\n\n### 範本 1：【大學生兼職共鳴型口播深稿】（吸引更多人加入或建立真實信任）\n\n| 秒數 | 鏡頭畫面 | 口播台詞 (逐字稿) | 心智作用 |\n| :--- | :--- | :--- | :--- |\n| **0~3s** | 手機直接自拍，背景在宿舍或書桌，手上晃著剛領到的入帳通知。 | 「別再用青春去超商罰站領 185 了！在家剪 1 分鐘片，滿千播放現拿 500 塊！」 | **視覺錘＋語言釘子**：打破傳統時薪認知。 |\n| **4~15s** | 鏡頭切換到手機剪映/CapCut 畫面，快速滑動幾段素材。 | 「以前我也在飲料店打工，站到腳底筋膜炎一個月才賺那一萬多塊。後來朋友介紹我這個夥伴計畫，官方直接提供現成文案和開頭積木，你只要用自己手機拍幾段、剪一剪發在自己的 IG 或 TikTok。」 | **Push 痛點共鳴**：喚醒體力打工的委屈與疲累。 |\n| **16~40s** | 鏡頭回到真人，展示後台數據突破 1,000 觀看的畫面。 | 「重點來了！他不用你百萬粉絲，只要演算法正常推薦過 1,000 觀看，而且留言區有人問你怎麼買，500 塊直接入帳！如果運氣好被推上破萬爆款，獎金還能一路加到三千多，而且影片是留在你自己的頻道上，粉絲流量全算你的！」 | **RTB 信任狀展示**：可達成的門檻與巨大回報。 |\n| **41~60s** | 鏡頭直視觀眾，手指指向下方留言區。 | 「別再懷疑是不是詐騙了，完全不用繳保證金、不用買教材！想要領取官方彈藥庫和詳細規則的，直接在留言區留【+1】，我私訊把懶人包發給你！」 | **直球 CTA**：觸發留言互動與 ManyChat 導流閉環。 |\n\n---\n\n### 範本 2：【生活好物痛點直球型口播深稿】（針對產品銷售與名單導流）\n\n| 秒數 | 鏡頭畫面 | 口播台詞 (逐字稿) | 心智作用 |\n| :--- | :--- | :--- | :--- |\n| **0~3s** | 特寫狼狽痛苦表情，桌面上一團混亂或遇到麻煩的特寫。 | 「如果你每天也在為這件事抓狂，求求你花 10 秒看我怎麼搞定！」 | **前 3 秒強鉤子**：直擊日常具體痛點。 |\n| **4~18s** | 鏡頭展示原本舊方法的痛苦、費時、浪費錢。 | 「以前為了解決這個問題，我買了一堆號稱好用的工具，結果全部是智商稅，不是用兩次就壞，就是步驟超級繁瑣，真的越用越火大！」 | **Push 痛點加深**：喚醒花冤枉錢的憤怒。 |\n| **19~42s** | 拿出推薦產品，展示一秒解決問題的絲滑過程。 | 「直到上週室友推給我這個神器，直接一鍵搞定！不用複雜設定，拿起來就能用，我原本要弄半小時的事情，現在 3 分鐘搞定，整個下午時間都多出來了！」 | **Pull 新品類爽感**：展示對比強烈的解決方案。 |\n| **43~60s** | 產品拿在胸前，另一手指向螢幕下方。 | 「現在官方有限時優惠活動，還能免費領試用！想知道是哪一款的，留言區留【+1】或點我個人主頁第一條連結，專屬折扣碼也在那裡，快去看看！」 | **直球 CTA**：拉動留言區 +1 與主頁 Bio 點擊。 |\n"

      "raw": "# 行動承諾與微型測謊漏斗模組報告 (Skin in the Game & Anti-Fraud Funnel)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/pretotyping_funnel/funnel_model.yaml`](../../_thinking/pretotyping_funnel/funnel_model.yaml)  \n> **模組狀態**：實戰就緒  \n> **核心哲學**：**徹底封殺虛榮指標——用「AI 30 秒預審 ＋ 雙門禁意圖承諾 ＋ 後台受眾截圖」建立不可作弊的防刷漏斗！**\n\n---\n\n## 1. 三級行動承諾防刷漏斗架構 (The 3-Tier Commitment Ladder)\n\n```mermaid\nflowchart TD\n    classDef l1 fill:#ffebee,stroke:#c62828,stroke-width:1px,color:#111827;\n    classDef l2 fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef l3 fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n\n    L1[\"階梯 1: 虛榮指標 (嚴禁單獨撥款！)<br/>• 純播放量、點讚、純愛心表情 ➔ 刷量工作室 20 元即可刷滿，零商業價值！\"]:::l1\n    --> L2[\"階梯 2: 行為與隱私承諾 (解鎖 $500 門檻)<br/>• 滿 1,000 自然播放 ＋ 留言區 5~10 則真實『+1 / 詢價』<br/>• 後台數據截圖：台灣受眾比例 >= 70%\"]:::l2\n    --> L3[\"階梯 3: 貨幣與訂單承諾 (終極爆款與分潤)<br/>• 觀眾透過創作者專屬折扣碼完成下單 ➔ 創作者享 15%~20% 永久分潤！\"]:::l3\n```\n\n---\n\n## 2. 物理經濟學防刷死穴：為什麼只抓「台灣受眾 ≥ 70%」與「48hr 冷卻」？\n\n黑產工作室刷量存在無法克服的致命弱點：**「刷純播放量極其便宜（無頭協議請求，成本 < $0.05），但刷『逼真的台灣真人住宅 IP 與實播留存』極其昂貴（成本 > $300~$600）！」**\n\n```mermaid\nflowchart LR\n    classDef cheap fill:#ffebee,stroke:#c62828,stroke-width:1px,color:#111827;\n    classDef expensive fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef pass fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n\n    A[\"刷量工作室試圖套利 $500 賞金\"] --> B{\"黑產作弊路徑抉擇\"}\n    B -- \"路徑 1: 便宜協議假量 (成本 $20)\" --> C[\"海外機房 IP (印尼/越南/俄羅斯)<br/>❌ 後台受眾台灣 < 20% ➔ 5秒被系統識破拒撥款！\"]:::cheap\n    B -- \"路徑 2: 逼真真人量 (台灣住宅IP+真機播放)\" --> D[\"真機牆實播20秒 + 台灣住宅寬頻流量<br/>❌ 物理黑產成本高達 $300~$600 ➔ 刷手倒賠破產，主動放棄！\"]:::expensive\n    A --> E[\"正常創作者自然流 (台灣真人受眾 >= 70%)\"] --> F[\"✅ 48小時無痛截圖，秒領 $500！\"]:::pass\n```\n\n### 兩大客觀鐵律門禁（創作者 10 秒截圖，黑產直接破產）：\n1. **後台受眾地理檢驗：台灣 (Taiwan) 比例必須 ≥ 70%**：\n   - 徹底封殺海外廉價機房 IP 與低質流量，將刷量成本人為推高至 500 元以上，消除任何套利利潤空間。\n2. **48 ~ 72 小時延遲結算冷卻期**：\n   - 影片發布滿 48 小時後才開放提報。徹底避開瞬間灌水腳本，並等待平台定期清洗過濾假數據。\n\n---\n\n## 3. 核心落地：AI 30 秒大綱質檢 Prompt 標準規格\n\n創作者在開機前，於 LINE 官方帳號輸入其腳本大綱，系統背後之後台 LLM 質檢規則：\n\n```text\n【系統角色】\n你是「共鳴創作者計畫」的 AI 內容質檢官。你的任務是在 30 秒內審核創作者提交的 1 分鐘短影音大綱，判定是否放行開機。\n\n【審核輸入】\n1. 前 3 秒開頭台詞\n2. 影片核心痛點與解決方案\n3. 結尾行動呼籲 (CTA)\n\n【評分標準卡 (滿分 100，>= 80 放行)】\n1. 前 3 秒鉤子 (30%): 是否具備衝突感、數字對比或強烈提問？（平淡自我介紹直接給 0 分）\n2. 痛點與賣點真實性 (30%): 是否符合官方彈藥庫之核心價值？有無離題？\n3. 直球 CTA 設計 (20%): 是否有明確提醒觀眾「留言區留+1」或「點主頁連結領專屬優惠」？\n4. 合規與紅線檢測 (20%): 嚴禁色情低俗、誇大療效、侵權爭議或絕對化保證（踩線一票否決）\n\n【輸出格式】\n- 判定結果：【🟢 審核通過，准予開拍】 或 【🟡 建議調整】\n- 具體微調建議（若未通過，需給予 1~2 句直接可用的改進文案）\n```\n\n---\n\n## 3. 測謊與撥款三色信號燈判決卡 (Traffic Light Matrix)\n\n| 信號燈級別 | 創作者提報數據特徵 | 系統後台判定結論 | 處置動作 |\n| :--- | :--- | :--- | :--- |\n| 🔴 **紅燈 (作弊或無效)** | 播放數 > 1,000，但留言為 0 或全為機器人純表情；後台台灣受眾 < 50%。 | **判定為外部刷量工作室灌水** | 駁回撥款，提醒創作者更換為自然流內容；累犯 2 次列入黑名單。 |\n| 🟡 **黃燈 (內容瑕疵)** | 播放數 > 3,000，但留言區僅 1~2 則互動，點擊率 < 0.5%。 | **有流量但 CTA 吸引力不足** | 發放基本 $300 補貼，輔導創作者調整結尾鉤子。 |\n| 🟢 **綠燈 (真金白銀)** | 播放數 >= 1,000，留言區有 5 則以上「+1/想了解」，台灣受眾 > 70%。 | **真實高意圖轉換閉環確立！** | **48 小時內秒撥 $500 打工金**，後續爆款加碼持續追溯！ |\n"
    },

      "raw": "# 履約瓶頸排查與 7 Powers 防禦壁壘報告 (Scale Readiness & 7 Powers)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/scale_defense/defense_model.yaml`](../../_thinking/scale_defense/defense_model.yaml)  \n> **模組狀態**：防禦就緒  \n> **核心結論**：**反向定位（Counter-Positioning）形成天然絕緣牆——傳統廣告代理商就算眼紅也無法模仿，因為會直接摧毀其高額月費主業！**\n\n---\n\n## 1. 7 Powers 商業壁壘審查矩陣 (Hamilton Helmer 7 Powers)\n\n```mermaid\nflowchart TD\n    classDef moat fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef op fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n\n    subgraph DEFENSE [\"【7 Powers 結構性護城河】\"]\n        M1[\"1. 反向定位 (Counter-Positioning) ➔ 傳統影音代操無法跟進 (自傷高利潤主業)\"]:::moat\n        M2[\"2. 雙邊網絡效應 (Network Effects) ➔ 創作者與品牌雙向飛輪鎖定\"]:::moat\n        M3[\"3. 程序工藝防禦 (Process Power) ➔ AI 30秒預審與三層防刷技術棧\"]:::moat\n        M4[\"4. 轉換成本 (Switching Costs) ➔ 創作者專屬碼長尾被動 CPS 資產綁定\"]:::moat\n    end\n\n    subgraph FULFILLMENT [\"【TOC 履約抗崩潰檢驗】\"]\n        O1[\"瓶頸排查：單月達標影片破千支時，核銷與對帳可能塞車\"]:::op\n        O2[\"交付極簡化：ManyChat API 自動對接 ＋ 批量金流轉帳 SOP\"]:::op\n    end\n\n    DEFENSE --- FULFILLMENT\n```\n\n---\n\n## 2. 巨頭為何不敢模仿？反向定位（Counter-Positioning）深度拆解\n\n市場上資金雄厚的傳統 4A 廣告代理商或大型影音代操工作室，為什麼無法輕易抄死我們？\n\n1. **商業模式內在衝突**：\n   - 傳統代理商的利潤建立在「向客戶收取固定高額製作費（一支 $15,000~$30,000）與月度服務費」。\n   - 如果他們宣布「一支只收 $500，且沒達到 1,000 播放一毛不收」，他們原有的高毛利大客戶會立刻質疑既有合約，**跟進模仿等於直接砍死自己的金牛業務**。\n2. **組織基因與成本結構不同**：\n   - 傳統公司養了大量全職企劃、攝影師、剪輯師，固定人事成本極高，必須靠高單價合約支撐。\n   - 本案走的是「輕資產、去中心化素人矩陣 ＋ AI 預審平台化」，固定邊際成本趨近於零，具備天然的定價破壞力。\n\n---\n\n## 3. TOC 履約瓶頸排查 (Constraint Management)\n\n當去中心化矩陣在全台灣校園快速裂變，單月合格影片達到 500~1,000 支時，系統可能面臨的崩潰點與防範措施：\n\n| 潛在瓶頸 (Bottleneck) | 壓力測試情境 (Stress Test) | 預防與解除措施 (SOP) |\n| :--- | :--- | :--- |\n| **後台對帳與轉帳塞車** | 每月 500 筆 $500 元小額撥款，人工匯款手續繁瑣且易出錯。 | 導入企業批量轉帳（街口支付/Line Pay/網銀批次上傳），審核通過一鍵批次撥付。 |\n| **假名單惡意灌水 (Spam)** | 創作者請朋友狂刷留言「+1」洗名單。 | 規定名單必須經過 ManyChat 自動私訊領取「實名折扣碼」或留下有效聯絡方式才計入有效 Lead。 |\n| **品牌主產品斷貨風險** | 單支影片衝上 10 萬觀看，爆發瞬間訂單，老闆無法交貨。 | 在入駐合約中明確庫存預警線，一旦爆單，該創作者影片轉向「早鳥候補登記」。 |\n"
    },
    "modules/unit_economics/02_breakeven_cap.md": {

      "raw": "# 單元經濟模型與獲客破產臨界線測算 (Unit Economics Report)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/unit_economics/economics_model.yaml`](../../_thinking/unit_economics/economics_model.yaml)  \n> **模組狀態**：審計完成  \n> **核心指標**：**CAC Cap 獲客成本上限防線 ✕ 保本轉換率臨界點 ✕ 邊際貢獻測算**  \n> **核心結論**：**雙贏防線——創作者享有 2.5x ~ 6.5x 超商時薪；品牌獲客 CAC 鎖死在 $5.8 ~ $50 元，確保保本並較官方競價投流節省 58% ~ 95% 預算！**\n\n---\n\n## 1. 創作者收益與時薪矩陣分析 (Creator Side)\n\n傳統學生打工（便利商店、手搖飲、餐飲外場）目前法定基本時薪為 **NT$ 185 元**，且必須承擔固定排班、通勤與高強度體力耗損。\n\n在「共鳴創作者計畫」中，熟練創作者製作 1 支 1 分鐘短影音（包含套用官方彈藥庫、拍攝/剪輯/AI配音、發布）平均耗時 **45 ~ 60 分鐘**。\n\n### 創作者三級收益測算表：\n\n| 創作者等級與投入程度 | 月產出量 (每週工時) | 流量表現分佈假設 | 基礎達成金 ($500) | 爆款階梯加碼 | 導流 CPS 抽成 ($200/單) | **預估每月總收入** | **實質等效時薪** (對比工讀 $185) |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| **新手兼職 / 試水溫** | 4 支 (每週 1 小時) | 3 支滿 1k、1 支未滿 | $1,500 | $0 | 帶來 2 單 ($400) | **NT$ 1,900** | **NT$ 475 / hr** (2.56 倍) |\n| **熟練創作者 / 穩定副業** | 10 支 (每週 2.5 小時) | 7 支滿 1k、2 支破萬、1 支未滿 | $4,500 | $1,400 (破萬補貼) | 帶來 10 單 ($2,000) | **NT$ 7,900** | **NT$ 790 / hr** (4.27 倍) |\n| **爆款收割機 / 核心夥伴** | 18 支 (每週 4.5 小時) | 10 支滿千、5 支破萬、2 支大爆 (50k+) | $8,500 | $6,100 (高額爆款加碼) | 帶來 35 單 ($7,000) | **NT$ 21,600** | **NT$ 1,200 / hr** (6.48 倍) |\n\n> **創作者心理價值確立**：即使是新手，做 1 支片滿千觀看拿到 $500，換算時薪也是超商的 2.5 倍以上；一旦產出爆款，時薪直接破千元，具備極強的長期留存黏性。\n\n---\n\n## 2. 品牌主獲客成本與邊際 CPM 指數稀釋模型 (Brand Side)\n\n品牌主最大的恐懼是「當冤大頭買了假流量」或「被爆款穿透預算」。以下為品牌端在各階段流量下的真實財務指標：\n\n```mermaid\nxychart-beta\n    title \"影片觀看數 vs 品牌每千次展示成本 (CPM)\"\n    x-axis [\"1,000 觀看\", \"10,000 觀看\", \"50,000 觀看\", \"100,000 觀看\"]\n    y-axis \"平均 CPM (TWD)\" 0 --> 550\n    bar [500, 120, 50, 35]\n```\n\n### 品牌獲客指標對比表：\n\n| 流量里程碑 ($V$) | 品牌累計支出 ($TWD$) | 帶來的真實意圖動作 (Leads) | 單個名單獲取成本 (CPL) | 品牌平均 CPM | 對比 Meta 投流平均名單成本 ($120/Lead) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **1,000 觀看** | **$500** | **10 個 (+1 或點擊)** | **$50.0 / 名單** | **$500** | **現省 58.3%**（兼買到原創影片） |\n| **10,000 觀看** | **$1,200** | **80 個** | **$15.0 / 名單** | **$120** | **現省 87.5%** |\n| **50,000 觀看** | **$2,500** | **350 個** | **$7.14 / 名單** | **$50** | **現省 94.0%** |\n| **100,000 觀看** | **$3,500** (封頂) | **600 個** | **$5.83 / 名單** | **$35** | **現省 95.1%** |\n\n---\n\n## 3. 業界四大行銷管道 10 萬元殘酷基準對比 (Industry Benchmark Battle)\n\n當品牌老闆手握 **NT$ 100,000 元行銷預算** 時，投入四種不同管道的真實獲客投報率（ROI）橫向基準對比：\n\n| 評估維度 | 管道 1：傳統影音代操 / 接案外包 | 管道 2：找 KOL / 網紅業配 | 管道 3：Meta / TikTok 官方廣告投流 | **管道 4：共鳴創作者計畫 (本案)** |\n| :--- | :--- | :--- | :--- | :--- |\n| **10 萬元買到什麼？** | 買到 5~8 支剪好的 MP4 檔案 | 買到 1~2 位萬粉網紅發 1 支片 | 買到約 50 萬次冷冰冰的廣告曝光 | **買到 80~100 支原創影片 ＋ 百位素人自建帳號真實推薦** |\n| **觀看數保證機制** | **0 保證**<br>(發布後只有 30 人看，外包商照收 10 萬) | **0 保證**<br>(網紅只負責發，若被演算法埋沒算你倒楣) | 依競價展示<br>(花完就沒了) | **雙門禁保證**<br>**(沒達到 1,000 播放 ＋ 互動，該支影片老闆付 $0 元！)** |\n| **獲取潛在客戶成本<br>(Cost Per Lead, CPL)** | 無法預估<br>(通常 > $200 / 名單) | 極高且難以追蹤<br>(通常 > $300 / 名單) | 約 **NT$ 120 ~ $180 / 名單**<br>(點進來常是誤觸路人) | **僅 NT$ 40 ~ $50 / 名單**<br>**(留言區主動喊「+1/想買」的高意圖精準買家)** |\n| **長尾資產累積** | 零<br>(死在自己沒人看的新帳號) | 差<br>(網紅過兩天就發新業配，被迅速洗掉) | **停投立刻歸零**<br>(像吸毒一樣不能停) | **永久留在全台百位創作者頻道**<br>(長尾自然搜尋＋持續被動出單) |\n| **消費者信任度** | 差（官方自賣自誇） | 差（觀眾一眼看出接業配） | 極差（「贊助」標籤，本能直接滑走） | **極高（素人生活真實體驗，社群信任感最強）** |\n| **預算風險誰承擔？** | **老闆承擔 100% 虧損風險** | **老闆承擔 100% 虧損風險** | **老闆承擔競價波動風險** | **【風險倒置】未達標我們負責，老闆只為真實成效買單！** |\n\n---\n\n## 4. 平台收費表 vs 創作者支出表利潤模型 (Platform Margin Architecture)\n\n作為平台營運樞紐，平台賺取的是**獲客服務價差 ＋ 爆款溢價 ＋ 後續長尾 CPS 抽成**：\n\n### (1) 單支影片階梯利潤對照表：\n\n| 流量與成效里程碑 | 1. 向品牌老闆收取 (Revenue) | 2. 支付給創作者 (Payout) | 3. 平台單支毛利 (Gross Profit) | 4. 平台毛利率 | 商業邏輯與利潤支撐 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **首發達標 (1k 播放 + 互動)** | **NT$ 800 元** | **NT$ 500 元** | **＋NT$ 300 元** | **37.5%** | 基礎撮合、AI 預審與客觀防刷質檢費 |\n| **破萬爆款 (10,000 觀看)** | **NT$ 1,800 元** | **NT$ 1,200 元** (累計) | **＋NT$ 600 元** | **33.3%** | 爆款流量溢價 (老闆獲萬次曝光 CPM 僅 $180) |\n| **五萬大爆款 (50,000 觀看)**| **NT$ 3,800 元** | **NT$ 2,500 元** (累計) | **＋NT$ 1,300 元** | **34.2%** | 全網擴散紅利 (帶來 350+ 名單，單支利潤破千) |\n| **十萬神作 (100,000 觀看)**| **NT$ 5,000 元** | **NT$ 3,500 元** (封頂) | **＋NT$ 1,500 元** | **30.0%** | 頂級爆款封頂，之後流量不再加收 |\n| **後續真實成交 (CPS 抽成)**| **收取商品銷售額 25%~30%** | **分潤給創作者 15%~20%** | **淨賺 10% 佣金** | **10% 淨提成** | 爆款影片長期留存，長尾被動現金流 |\n\n### (2) 品牌主月度專案打包收費方案：\n\n*   **方案 A：【種子測水溫專案包】（破冰首選）**\n    - **收費**：**NT$ 38,000 元**\n    - **交付保證**：交付 **30 支**滿千觀看＋有互動影片（未達標免費補拍或退款），預估 30,000+ 曝光 ＋ 150~300 個真實諮詢名單。\n    - **平台支出**：創作者底金 $15,000 ＋ 爆款儲備 $5,000 ＝ $20,000\n    - **👉 平台單案淨利**：**NT$ 18,000 元（淨利率 47.3%）**\n*   **方案 B：【品牌矩陣突圍包】（主力方案）**\n    - **收費**：**NT$ 98,000 元**\n    - **交付保證**：交付 **80 支**達標影片 ＋ 3~5 支破萬爆款，預估 150,000~300,000 曝光 ＋ 800~1,500 個真實名單。\n    - **平台支出**：創作者底金 $40,000 ＋ 爆款加碼 $15,000 ＝ $55,000\n    - **👉 平台單案淨利**：**NT$ 43,000 元（淨利率 43.8%）**\n*   **方案 C：【全網霸屏旗艦包】（大品牌大促）**\n    - **收費**：**NT$ 250,000 元**\n    - **交付保證**：交付 **200 支**達標影片 ＋ 多支 5 萬、10 萬大爆款，預估 800,000~1,500,000 曝光 ＋ 2,000+ 高意圖名單。\n    - **平台支出**：創作者底金 $100,000 ＋ 爆款加碼 $40,000 ＝ $140,000\n    - **👉 平台單案淨利**：**NT$ 110,000 元（淨利超過 11 萬元！）**\n\n---\n\n## 5. 獲客破產臨界線與安全邊際結論 (Breakeven Verdict)\n\n1. **底線安全邊際 (Downside Floor)**：\n   - 就算最慘狀況——創作者全部剛好卡在 1,000 觀看，品牌也是以 **$50 元/名單** 取得高意圖潛在客戶，同時還獲得了合法可二創的原創影片素材（市價 $1,000+）。\n2. **天花板爆款暴擊 (Upside Ceiling)**：\n   - 一旦出現 5 萬、10 萬大爆款，獲客成本雪崩式下跌至 **$5.8 元/名單**，CPM 壓低至 **$35 元**。\n   - 10 萬觀看後流量獎金封頂，完全轉入 CPS（有成交才分潤），徹底消滅預算黑洞。\n"
    },

      "raw": "# 雙邊品牌受眾轉化落地頁規劃手冊 (Web Translation Architecture)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../../_thinking/web_translation/web_model.yaml`](../../_thinking/web_translation/web_model.yaml)  \n> **模組狀態**：規劃完成  \n> **鐵律遵循**：**大腦隱形，受眾心動！0% 定位理論黑話，100% 直擊受眾靈魂的大白話轉化動線！**\n\n---\n\n## ⚡ 核心視覺動線：極簡三步驟秒懂圖 ✕ 平台確認介面示意\n\n### 1. 【超簡單三步秒懂圖】任何人一眼看懂：\n```mermaid\nflowchart LR\n    S1[\"📱 1. 創作者上傳點子<br/>一句話/迷因/AI分鏡皆可<br/>自由創作 ✕ 零門檻送出\"] --> S2[\"🤖 2. AI 3秒智能跑分<br/>自動測關聯度與安全紅線<br/>創作者拿綠燈 ✕ 老闆免審稿\"] --> S3[\"💼 3. 老闆一鍵打勾同意<br/>儀表板看評分 ➔ 一鍵開拍<br/>滿千自然推薦直接撥款！\"]\n```\n\n### 2. 【雙方確認平台介面示意圖】：\n*   創作者提交：一句話梗概（例如：「拍吃泡麵發呆，打字說留言+1救救期末考打工仔領9折碼」）。\n*   AI 體檢儀表板：\n    - 關聯性：88%（產品自然帶出）\n    - 安全紅線：100% 合規（零違法誇大）\n    - CTA 存在度：95%（指定折扣碼精準露出版位）\n*   老闆端按鈕：【✔ 一鍵打勾放行】（亦可開啟評分 > 80 分自動通過）。\n\n---\n\n## ⚡ 核心視覺動線：極簡四步閉環 ✕ AI 智能驗證時序\n\n### 1. 面向受眾秒懂四步圖：\n```mermaid\nflowchart LR\n    Step1[\"💼 老闆出題<br/>設定賣點 ＋ 自選 CTA\"] --> Step2[\"🤖 AI 3秒驗證<br/>測關聯度與紅線 (免退件)\"]\n    Step2 --> Step3[\"📱 自由創作 (真人/AI)<br/>自建頻道帶指定 CTA 發布\"] --> Step4[\"💰 滿千截圖結算<br/>台灣受眾破千秒領 $500！\"]\n```\n\n### 2. 後台 AI 智能協同驗證時序流程 (The AI Verification Flow)：\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Creator as 創作者 (學生/斜槓/AI創作者)\n    participant Platform as 【共鳴 AI 智能驗證平台】\n    actor Boss as 品牌老闆 (企業主)\n\n    Boss->>Platform: 1. 發布任務包：設定產品核心賣點 ＋ 指定結尾 CTA (優惠碼)\n    Creator->>Platform: 2. 提交創作靈感 (一句話/迷因/AI分鏡/大綱皆可)\n    Platform->>Platform: 3. AI 核心引擎自動檢測：計算關聯性、安全紅線、CTA存在度\n    Platform-->>Creator: 4. 即時回傳評分 (綠燈通過，若有偏離 AI 自動提供順手微調建議)\n    Platform-->>Boss: 5. 後台儀表板同步展示：高分提案聚合，老闆可一鍵勾選確認或自動放行\n    Creator->>Creator: 6. 開機創作/剪輯 (真人實拍/AI生成皆可) 並發布個人頻道\n    Creator->>Platform: 7. 發布滿 48hr 上傳 2 張截圖 (播放破千 + 台灣受眾 >= 70%)\n    Platform-->>Creator: 8. 系統審核通過，48hr 內撥款 $500！\n```\n\n---\n\n## 📱 門戶 A：面向創作者與大學生（招募轉化動線）\n\n*   **Hero 首屏大標題**：\n    > **「別再用青春罰站領 185！剪 1 分鐘短影音，滿千觀看加互動秒領 $500，爆款單支最高 $3,500！」**\n*   **Hero 視覺錘**：手機入帳 $500 元推播通知截圖 ＋ 留言區「+1」刷屏動態效果。\n*   **四大免疑慮承諾徽章**：\n    1. 🟢 **終生 0 費用**：不用繳保證金、不用買教材、不推銷任何軟體。\n    2. 🟢 **免想文案**：官方提供 30 組爆款開頭鉤子與腳本積木。\n    3. 🟢 **絕不白嫖**：AI 預審通過即背書，達標 48 小時內銀行直接撥款。\n    4. 🟢 **資產全歸你**：影片發在個人號，粉絲與長期抽成分潤全是你的。\n*   **直球行動按鈕 (CTA)**：【立即領取官方彈藥庫，開啟第一支 $500 挑戰】（點擊跳轉 LINE 官方預審 Bot）。\n\n---\n\n## 👔 門戶 B：面向企業主與品牌老闆（獲客提案動線）\n\n*   **Hero 首屏大標題**：\n    > **「告別官方投流無底洞！發動百位素人自建矩陣，每一分錢只為『真實破千播放＋高意圖買家諮詢』買單！」**\n*   **四大業界殘酷基準橫向對比表 (對比傳統外包、網紅、Meta 投流)**：\n    - 展示 10 萬元預算下，本案如何以 $40~$50 超低名單單價帶回 1,600~2,500 個真實諮詢名單（較 Meta 投流省 60% 以上）。\n*   **三大算盤刀法話術**：\n    1. **算風險**：零觀看、零互動，老闆付 $0 元！\n    2. **算單價**：官方名單一個 $120~$180，本案只需 $40~$50。\n    3. **算暴擊**：百位素人同時下場，爆發 5 萬、10 萬超額爆款流量全白送給老闆！\n*   **核心品控保障**：\n    - 展示「AI 腳本預審」如何確保素人影片 100% 傳達品牌訴求，嚴禁虛假誇大。\n*   **零風險試水溫 Offer**：\n    - **【NT$ 38,000 種子測水溫專案】**：保證交付 30 支滿千觀看＋有互動影片，未達標按比例退款！\n*   **直球行動按鈕 (CTA)**：【預約獲客沙盒試跑方案】（線上填表，當天提供產品專屬爆款選題規劃）。\n"

          "raw": "# 階段四與五：核心假說、雙邊攻防論證與決策門禁 (Decision Gate)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **門禁狀態**：**HUMAN_DECISION_GATE APPROVED (DUAL-SIDED ALIGNED)**  \n> **決策閘門結論**：本決策閘門確立「語言釘子」與雙邊核心承諾！\n\n---\n\n## 📌 核心武器錨點\n* **語言釘子 (Verbal Nail)**：不賣時間罰站，1分鐘短影音，滿千加互動秒領 $500！\n* **視覺錘 (Visual Hammer)**：手機入帳 $500 推播通知 ＋ 留言區 +1 滾動瀑布\n\n---\n\n## 🥊 雙邊紅藍軍深度攻防論證\n\n### 對決 A：品牌老闆端攻防\n- **紅軍質疑（老闆視角）**：\n  > 「學生素人自製的影片品質會不會很差？會不會拿我的產品亂講話，甚至破壞品牌形象？」\n- **藍軍抗辯（戰略防禦）**：\n  > 1. **AI 腳本預審 ＋ 彈藥庫模組化**：創作者不是天馬行空亂拍，必須套用官方提供的「前 3 秒開頭鉤子」與「痛點積木」。開機前必須經由 AI 預審通過，違規誇大與侵權一票否決。\n  > 2. **素人感才是當今短影音轉化的最高境界**：現在觀眾對精緻官方廣告已有強烈抗體，素人在生活場景中的真實體驗分享，轉換率往往是精修廣告的 3~5 倍！\n\n### 對決 B：創作者學生端攻防\n- **紅軍質疑（學生視角）**：\n  > 「如果我辛苦剪完影片發布，結果演算法只給我 500 觀看沒達到 1,000，我豈不是白忙一場被白嫖？」\n- **藍軍抗辯（戰略防禦）**：\n  > 1. **短影音演算法的自然常態**：只要不是搬運抄襲帳號，套用官方爆款開頭，突破 1,000 是平台基礎推薦池的標準常態。\n  > 2. **個人帳號資產留存與爆款追溯**：影片發在創作者自己的頻道，即使這支只有 500 播放，也為帳號累積了權重與內容；只要下一支衝上破萬爆款，獎金立刻追溯到 $1,200~$3,500，一次把前面的工時收益全數超額補齊！\n\n---\n\n## 🎯 終局拍板決策（雙邊定位宣言）\n\n1. **面對品牌老闆**：\n   - 定位為**「去中心化成效獲客艦隊」**。\n   - 核心承諾：零底薪風險、只為真實觀看與高意圖名單買單、$50 單價顛覆傳統投流。\n2. **面對創作者學生**：\n   - 定位為**「自由高薪影音共創舞台」**。\n   - 核心承諾：告別超商罰站、1分鐘滿千秒領 $500、AI 預審杜絕退件、自建個人賺錢頻道。\n"

          "raw": "# 共鳴創作者計畫 ‧ 專案戰略簡報 (Project Brief)\n\n> **內部專案代號**：`ugc_bounty_matrix`  \n> **對外官方計畫**：**共鳴創作者計畫 (Resonance Creator Program)**  \n> **核心定位本質**：**雙邊市場獲客網絡（Two-Sided Creator-to-Business Network）**\n\n---\n\n## 🎯 雙邊角色精準定位與價值主張 (Dual-Sided Value Proposition)\n\n本專案居於「品牌老闆獲客需求」與「青年學生打工供給」的黃金交集點，建立去中心化的成果分銷樞紐：\n\n```mermaid\nflowchart LR\n    subgraph Creators [\"【創作者 / 學生端】(供給方)\"]\n        C1[\"痛點: 超商罰站 $185、接案改稿被白嫖\"]\n        C2[\"承諾: 滿千+互動秒領 $500 (時薪翻2.5~6倍)\"]\n        C3[\"保障: 零收費、AI 預審通過不退件、帳號資產歸自己\"]\n    end\n\n    subgraph Platform [\"【共鳴創作者計畫】(中樞樞紐)\"]\n        P[\"去中心化成果驗收共創網絡\\n• AI 預審與彈藥庫質檢\\n• 雙門禁防刷驗收\\n• 對數階梯爆款稀釋\"]\n    end\n\n    subgraph Bosses [\"【品牌老闆端】(買單方)\"]\n        B1[\"痛點: 官方投流貴、網紅外包沒流量\"]\n        B2[\"承諾: 零觀看不給錢、每一分錢只為名單買單\"]\n        B3[\"價值: $50 獲取高意圖名單 + 百萬爆款紅利\"]\n    end\n\n    Creators <-->|\"提供素人真誠創意與多點分發\"| Platform\n    Platform <-->|\"提供低成本高轉化名單與爆款流量\"| Bosses\n```\n\n---\n\n## ⚡ 雙方確認極簡三步驟架構 (The 3-Step Lightning Flow)\n\n> **核心原則：小學生 3 秒看懂！「創作者出點子 ➔ AI 自動跑分體檢 ➔ 老闆一鍵打勾開拍」！**\n\n```mermaid\nflowchart LR\n    classDef step1 fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px,color:#111827;\n    classDef step2 fill:#e0f2fe,stroke:#0284c7,stroke-width:3px,color:#111827;\n    classDef step3 fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#111827;\n\n    S1[\"📱 步驟 1：創作者上傳點子<br/>一兩句話/迷因/AI分鏡<br/>自由發揮 ✕ 零門檻送出\"]:::step1\n    --> S2[\"🤖 步驟 2：AI 3秒智能跑分<br/>自動檢測『關聯度 ＋ 紅線』<br/>創作者拿綠燈 ✕ 老闆免審稿\"]:::step2\n    --> S3[\"💼 步驟 3：老闆一鍵打勾同意<br/>儀表板看評分 ➔ 一鍵放行<br/>創作者開心開工 ✕ 滿千領錢！\"]:::step3\n```\n\n---\n\n## 🖥️ 平台雙方確認介面示意圖 (UI Mockup Architecture)\n\n平台在介面上如何呈現？創作者與老闆看到的是同一個客觀驗證卡片：\n\n```text\n┌────────────────────────────────────────────────────────────────────────┐\n│ ⚡ 共鳴 AI 創意驗證平台 ‧ 任務審核卡片 (Task #2026-088)                  │\n├────────────────────────────────────────────────────────────────────────┤\n│ 👤 創作者提案內容 (一句話/迷因皆可)：                                  │\n│   「我想拍期末考熬夜搶廁所的搞笑短劇，最後轉折到喝益生菌，留言留+1抽試用包」│\n├────────────────────────────────────────────────────────────────────────┤\n│ 🤖 AI 智能體檢雷達 (即時秒測)：                                        │\n│   • 品牌產品關聯度 (Relevance)： [████████░░] 88% (合格，生活自然融入)  │\n│   • 法規與安全紅線 (Safety)   ： [██████████] 100% 安全 (0違規，無療效)│\n│   • 老闆指定 CTA 完整度       ： [█████████░] 92% (帶出留言+1抽試用)   │\n│   ➔ 綜合判定：🟢 綠燈通過！(AI 自動產出過關保險代碼: #PASS-8821)       │\n├────────────────────────────────────────────────────────────────────────┤\n│ 💼 品牌老闆確認區 (1 秒勾選)：                                        │\n│   [ ✔ 同意開拍放行 ]      [ 💬 微調建議 (選填) ]                        │\n│   *(提示：系統支援「評分大於 80 分自動放行」，老闆可全自動託管)*       │\n└────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## ⚡ 平台核心作業流：專業時序圖 ✕ 秒懂極簡流程圖\n\n### 1. 【對外秒懂版】老闆與創作者 3 秒看懂的合作閉環：\n```mermaid\nflowchart LR\n    classDef boss fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef ai fill:#e0f2fe,stroke:#0284c7,stroke-width:2px,color:#111827;\n    classDef creator fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef cash fill:#f3e8ff,stroke:#9333ea,stroke-width:2px,color:#111827;\n\n    Step1[\"💼 1. 老闆出題<br/>設定賣點 ＋ 自選 CTA 優惠\"]:::boss\n    --> Step2[\"🤖 2. AI 綠燈保險<br/>點子丟上去 ➔ 3秒測出合規<br/>(老闆一鍵勾選 ✕ 創作者免退件)\"]:::ai\n    --> Step3[\"📱 3. 自由創作 (真人/AI皆可)<br/>發布個人頻道 ✕ 帶上指定 CTA\"]:::creator\n    --> Step4[\"💰 4. 滿千秒結算<br/>自然破 1,000 播放 ✕ 截圖入帳！\"]:::cash\n```\n\n### 2. 【後台管理版】AI 智能協同驗證時序流程 (The AI Verification Flow)：\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Creator as 創作者 (學生/斜槓/AI創作者)\n    participant Platform as 【共鳴 AI 智能驗證平台】\n    actor Boss as 品牌老闆 (企業主)\n\n    Boss->>Platform: 1. 發布任務包：設定產品核心賣點 ＋ 指定結尾 CTA (優惠碼)\n    Creator->>Platform: 2. 提交創作靈感 (一句話/迷因/AI分鏡/大綱皆可)\n    Platform->>Platform: 3. AI 核心引擎自動檢測：計算關聯性、安全紅線、CTA存在度\n    Platform-->>Creator: 4. 即時回傳評分 (綠燈通過，若有偏離 AI 自動提供順手微調建議)\n    Platform-->>Boss: 5. 後台儀表板同步展示：高分提案聚合，老闆可一鍵勾選確認或自動放行\n    Creator->>Creator: 6. 開機創作/剪輯 (真人實拍/AI生成皆可) 並發布個人頻道\n    Creator->>Platform: 7. 發布滿 48hr 上傳 2 張截圖 (播放破千 + 台灣受眾 >= 70%)\n    Platform-->>Creator: 8. 系統審核通過，48hr 內撥款 $500！\n```\n\n---\n\n## 📐 方案 A 驗收標準與加價階梯矩陣 (Plan A & Escalation Milestones)\n\n| 流量里程碑 ($V$) | 創作者累計領取賞金 | 老闆支付專案費用 | 平台單支淨利潤 | 老闆獲得等效 CPM | 商業本質與權責劃分 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **門檻：1,000 觀看** | **NT$ 500 元** | **NT$ 800 元** | **＋NT$ 300 元** | **$800 / 千次** | **素材製作 ＋ 首波千人曝光**<br>驗收條件：自然流量滿 1k ＋ 台灣受眾 >= 70% 截圖 |\n| **突破：10,000 觀看** | **NT$ 1,200 元** (補差額 $700) | **NT$ 1,800 元** (補差額 $1,000) | **＋NT$ 600 元** | **$180 / 千次** | **演算法破圈** (自帶素人信任，CPM 等同投流) |\n| **大爆：50,000 觀看** | **NT$ 2,500 元** (補差額 $1,300) | **NT$ 3,800 元** (補差額 $2,000) | **＋NT$ 1,300 元** | **$76 / 千次** | **全網擴散** (超額自然流暴擊，名單成本暴跌) |\n| **神作：100,000 觀看**| **NT$ 3,500 元** (封頂加發 $1k) | **NT$ 5,000 元** (封頂加付 $1.2k) | **＋NT$ 1,500 元** | **$50 / 千次** | **百萬頂級爆款** (流量費用封頂，防預算穿透) |\n| **10 萬觀看以上** | **流量賞金封頂**<br>轉入純 CPS 抽成 15%~20% | **流量費用封頂**<br>依真實銷售額抽成 25%~30% | **淨賺 10% 佣金** | 趨近於 $0 (純賺) | **長尾被動收入** (影片永久留存，出單才抽成) |\n\n---\n\n## 🎯 關鍵權責邊界：CTA 是老闆自己決定的！\n\n1. **對品牌老闆說（給予商業主導權）**：\n   > 「老闆，行銷拆成兩件事：前半段創作者負責把片子拍好看、把 1,000 個真人留在螢幕前聽完產品；**而後半段結尾的 CTA（行動呼籲、優惠誘因）完全由您親自決定！**\n   > 您可以要求放『留言領 9 折券』或『私訊免費領樣品』。創作者保證完整傳播給千人受眾；但最後有多少人買，取決於您的 CTA 誘因夠不夠香！**創作者負責把 1,000 個人帶到您的攤位前，而攤位放什麼好康吸引他掏錢，由您作主！**」\n2. **對創作者學生說（消除業績壓力）**：\n   > 「同學們，你們是靠創意和剪輯賺打工錢，不是來當業務員背業績的！產品好不好賣是老闆定價和優惠的事。官方給你們老闆指定的結尾台詞，你們只要在最後 5 秒順順講出來。**只要影片自然滿 1,000 觀看且受眾 70% 在台灣，500 塊就穩穩入帳，絕不以『有沒有人買』扣款！**」\n\n### 1. 對品牌老闆說話（獲客艦隊定位）\n*   **核心標語**：\n    > **「不用先砸十萬賭流量！發動百位創作者自建矩陣，每一塊錢只為『真實破千觀看＋精準諮詢』買單！」**\n*   **三大殺手級利益點**：\n    1. **零試錯成本**：沒達到 1,000 觀看或沒人互動，老闆一毛錢都不用付。\n    2. **買到精準潛在客戶 (Lead)**：$500 元換取 10 個留言「+1/想買」的高意圖諮詢，單個名單成本僅 $50 元（比 Meta 投流便宜 60%）。\n    3. **去中心化真人背書**：幾十位素人以個人頻道真實推薦，演算法多點開花，主帳號零封禁與 IP 風險。\n\n### 2. 對創作者/學生說話（高薪自由舞台定位）\n*   **核心標語**：\n    > **「告別超商時薪 185 罰站！用你的手機剪 1 分鐘短影音，滿千自然觀看加互動秒領 $500，爆款單支最高 $3,500 ＋ 永久被動抽成！」**\n*   **三大殺手級利益點**：\n    1. **實質時薪翻 2.5 ~ 6.5 倍**：1 分鐘短影音製作約 45 分鐘，滿千領 $500（換算時薪 $475~$1,200）。\n    2. **絕不白嫖與主觀退件**：AI 大綱預審通過即背書，達標 48 小時內必撥款，不憑老闆主觀美感挑刺。\n    3. **自建自媒體個人資產**：影片發在個人號上，流量、粉絲與長尾銷售分潤全歸創作者所有。\n    4. **終生零收費保證**：免學費、免樣品費、免保證金，乾乾淨淨的真金白銀合作。\n"

          "raw": "# 階段一：資產解構與信任狀審計報告 (Asset Audit)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/01_assets.yaml`](../_thinking/00_core/01_assets.yaml)  \n> **定位狀態**：審計完成  \n> **戰略主線**：**成果驗收保底 ✕ 爆款指數稀釋 ✕ 去中心化推薦矩陣**\n\n---\n\n## 1. 核心硬資產審計與真實信任狀 (Reason to Believe, RTB)\n\n「共鳴創作者計畫」並非空泛的網路兼職群組，而是基於精確的**單元經濟學（Unit Economics）與博弈論機制設計**，為了解決傳統短影音外包低效、投流高成本而誕生的創新生態。\n\n### 核心硬資產審計表：\n\n| 資產代號 | 資產名稱 | 客觀事實與 RTB (Reason to Believe) | 轉化為商業獲客與創作者端之價值 |\n| :--- | :--- | :--- | :--- |\n| **RTB-1** | **成果導向雙門禁賞金機制** | 拋棄傳統「賣工時」的 MP4 交付，改以「自然 1,000 觀看 ＋ 5~10 則真實互動/15次點擊」作為解鎖 $500 保底條件。 | 創作者享有「只要努力開頭好就能拿錢」的掌控感；品牌主將單個高意圖潛在客戶 (Lead) 成本壓在 $30~$50，遠超官方廣告。 |\n| **RTB-2** | **AI 預審與三層防刷防禦棧** | 開機前 AI 腳本大綱 30 秒預審、發布中 ManyChat 關鍵字追蹤、結算時台灣受眾 >70% 截圖與 48hr 冷卻期。 | 從機制上杜絕機器人假量與刷播放量套利，確保流入品牌的每一位都是真人。 |\n| **RTB-3** | **對數階梯爆款稀釋模型** | 1k 觀看 $500 (CPM $500 當製作補貼) ➔ 10k 觀看累計 $1,200 (CPM $120) ➔ 50k 觀看累計 $2,500 (CPM $50) ➔ 100k 觀看累計 $3,500 (CPM $35)。 | 激勵創作者死磕前 3 秒鉤子，而品牌綜合獲客成本隨播放量指數級下降，徹底杜絕行銷預算穿透風險。 |\n| **RTB-4** | **去中心化多點推薦矩陣** | 創作者以個人或自建垂直號發布，形成「多方真實自發推薦」的社會證明 (Social Proof)。 | 破除單一官方帳號強烈廣告感，多賽道同發測試演算法，主帳號零封禁與 IP 風險。 |\n\n---\n\n## 2. 嚴格模式約束宣告 (Constraints)\n\n1. **創作者端零門檻與零白嫖約束**：\n   - 嚴禁收取任何入會費、保證金或培訓費（與 Andrew Tate 的 HU 傳銷模式劃清界線）。\n   - 審核標準全面前置於 Step 2 AI 預審；凡通過預審且達標者，官方 48 小時內保證撥款，絕不以主觀審美刁難。\n2. **財務上限約束（Hard Ceiling）**：\n   - 單支影片純流量獎金以 100,000 觀看累計 $3,500 元為上限；10 萬以上一律轉入 15%~20% CPS 導流分潤，保護品牌現金流。\n3. **品牌安全紅線約束**：\n   - 嚴禁虛假療效、絕對誇大保證、低俗誘惑、政治爭議或侵權音樂。\n"

          "raw": "# 階段二：心智階梯探測與生態位審定 (Mental Ladder)\n\n> **所屬專案**：`ugc_bounty_matrix` (共鳴創作者計畫)  \n> **數據母體**：[`../_thinking/00_core/02_ladder_landmines.yaml`](../_thinking/00_core/02_ladder_landmines.yaml)  \n> **核心結論**：**探測市場既有心智梯隊，裁定全新物種心智空白！**\n\n---\n\n## 1. 既有短影音外包與獲客心智階梯\n\n在目標受眾（創作者與品牌老闆）的大腦記憶體中，已經被三大既有梯隊佔據：\n\n1. **第一梯隊：傳統工時接案外包（以 MP4 檔案計費）**\n   - 認知印記：收費高（單支 $1,500~$3,000）、反覆改稿耗時耗力、發布後 0 播放外包商照收錢，老闆承擔全部風險。\n2. **第二梯隊：官方競價廣告投流（Meta / TikTok Ads）**\n   - 認知印記：租來的冰冷流量、廣告感極重、停投即死，獲客成本年年飆升（CPL > $150）。\n3. **第三梯隊：海外傳銷式矩陣裂變（TikTok Affiliate / HU）**\n   - 認知印記：先收創作者月費學費，純 CPS 成交分潤；創作者前期 0 收益挫折感極重，被視為割韭菜。\n\n---\n\n## 2. 第四梯隊：共鳴創作者計畫之空白突圍 (White Space)\n\n本案在雙邊大腦中搶佔的全新生態位：  \n**「去中心化成果驗收共創網絡 (Decentralized Bounty Partner)」**\n\n- **對創作者**：不賣時間罰站，1 分鐘短影音，滿千觀看加互動秒領 $500，爆款單支最高 $3,500！\n- **對品牌老闆**：零觀看老闆付 $0 元，以 $40~$50 超低單價獲取真實買家名單與百萬爆款紅利！\n"
        },
