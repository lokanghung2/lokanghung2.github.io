          "raw": "# 🎯 慢酵所 (MANXIAO LAB) 特勞特 8 大實戰心智武器庫\n\n> **專案代號**：`mantou` ｜ **正式品牌**：**【慢酵所】** *(承襲新竹竹北 30 年莒光老麵原型工藝)*  \n> **對應神經元母體**：[`../../_thinking/mental_weapons/weapons_matrix.yaml`](../../_thinking/mental_weapons/weapons_matrix.yaml)  \n> **雙階戰略貫穿聲明**：本武器庫嚴格對齊 [`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)，完整配備**【階段 1（軌道 A）：不脹氣・3秒回彈老麵饅頭】**與**【階段 2（軌道 B）：東方蒸製酸種輕主食】**雙軌彈藥，零空洞形容詞，隨取即用！\n\n---\n\n## 🧭 八大心智武器雙軌作戰全景圖\n\n```mermaid\nflowchart TD\n    classDef entry fill:#fef3c7,stroke:#d97706,stroke-width:2px,color:#111827;\n    classDef battle fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef spread fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    subgraph MindEntry [\"⚡ 大腦進入層（1~3 秒奪取注意力）\"]\n        W1[\"武器 1：語言釘子<br/>A軌：壓扁 3 秒彈回來，進胃才不脹氣！<br/>B軌：配黑咖啡也不脹氣的東方酸種！\"]:::entry\n        W2[\"武器 2：視覺錘<br/>雙指壓扁 3 秒 100% 回彈 ＋<br/>電鍋掀蓋熱氣直衝切開起司地瓜橫切面\"]:::entry\n        W3[\"武器 3：品類新坐標<br/>A軌：12h 預分解回彈老麵饅頭<br/>B軌：100% 純水蒸東方酸種輕主食\"]:::entry\n    end\n\n    subgraph MindBattle [\"⚔️ 心智對決層（3~10 秒擊潰防線）\"]\n        W4[\"武器 4：戰略公敵標靶<br/>30分鐘速發死麵糰 ＆<br/>高油傷胃流沙包／生吐司\"]:::battle\n        W5[\"武器 5：三大硬核信任狀<br/>3秒物理回彈 ✕ 竹北30年SGS零添加 ✕<br/>試吃2顆不滿意免退回全額退\"]:::battle\n        W6[\"武器 6：致命異議爆破彈<br/>比歐包省一半錢 ✕ 免顧火電鍋8分鐘 ✕<br/>42%保水原塊起司地瓜小孩搶吃\"]:::battle\n    end\n\n    subgraph MindSpread [\"🔥 口碑與公關層（茶水間與社群自傳播）\"]\n        W7[\"武器 7：市井轉述口金句<br/>辦公室美式咖啡搭檔金句 ＆<br/>三代媽媽冷凍庫救星金句\"]:::spread\n        W8[\"武器 8：公關新聞引爆點<br/>揭開台灣 500 萬人早餐脹氣真相：<br/>錯不在小麥，在 30 分鐘急就章速發！\"]:::spread\n    end\n\n    MindEntry --> MindBattle --> MindSpread\n```\n\n---\n\n## 🗡️ 武器 1：【語言釘子 (The Verbal Nail)】（嚴守 ≤ 15 字封喉律）\n\n* **【軌道 A・階段 1 主釘子（直擊敏感胃痛點）】**：  \n  > **「壓扁 3 秒彈回來，進胃才不脹氣！」** *(14 字)*\n* **【軌道 B・階段 2 跨界主釘子（打劫白領咖啡早餐）】**：  \n  > **「配黑咖啡也不脹氣的東方酸種！」** *(14 字)*\n* **【慢酵所品牌靈魂副標】**：  \n  > *「慢酵所——我們多等 12 小時老麵預分解，換你一整個上午胃部平坦清爽。」*\n\n---\n\n## 🔨 武器 2：【視覺錘 (The Visual Hammer)】（物理道具與超級符號）\n\n拒絕抽象美工排版，全通路（短影音前 2 秒、官網首屏動圖、團購開箱）強制重複敲擊兩大具象物理動作：\n1. **【A 軌超級符號：雙聯指壓 3 秒回彈實測儀】**  \n   * **左畫面（黑白灰暗）**：市售速發饅頭手指一壓，塌成 1 公分死麵餅，黏在桌上彈不起來（字幕：`死麵糰＝進胃結塊產氣`）。  \n   * **右畫面（暖金蒸氣）**：【慢酵所】雙色起司老麵饅頭，手掌重壓到底貼平桌面，手一鬆開，**計時器跳動 `1s.. 2s.. 3s` 慢動作 100% 彈回圓潤飽滿原狀**（字幕：`3秒回彈活氣孔＝12h預分解`）。\n2. **【B 軌超級符號：黑咖啡旁的熱氣老麵切面】**  \n   * 白領餐桌美式黑咖啡旁，電鍋掀蓋熱氣直衝鏡頭，雙手掰開慢酵所老麵，露出**立體切丁雙色起司微牽絲、黃金番薯地瓜捲與飽滿核桃南瓜子**。\n\n---\n\n## 🧭 武器 3：【品類新坐標 (The Category Coordinate)】\n\n| 對決維度 | 舊品類（對手困住的紅海） | 慢酵所新品類（我們獨佔的藍海第一階梯） |\n| :--- | :--- | :--- |\n| **階段 1（軌道 A）坐標** | 一般手工饅頭 ／ 網紅爆漿流沙包 | **【12h 預分解・回彈老麵饅頭】** |\n| **階段 2（軌道 B）坐標** | 傷胃高奶油生吐司 ／ 160元刮嘴硬殼歐包 | **【100% 純水蒸・東方酸種輕主食 (Steamed Sourdough)】** |\n| **一句話物種定義公式** | *「如果你吃吐司麵包會脹氣溢酸、啃歐式酸種包又嫌硬刮嘴——慢酵所就是用 100% 東方純水蒸做出的溫潤版酸種輕主食。」* |\n\n---\n\n## 🎯 武器 4：【戰略公敵標靶 (The Strategic Anti-Position)】\n\n我們不攻擊任何一家小店個人，我們精準審判現代工業烘焙傷害台灣人腸胃的**「三大結構性原罪」**：\n1. **原罪一：【30 分鐘商用速發催熟體制】**  \n   工廠為了翻桌率，用商業快速酵母與含鋁泡打粉 30 分鐘吹氣催大。大分子支鏈澱粉與麩質完全沒被分解，你的胃被迫當發酵缸，開會當然脹氣打嗝！\n2. **原罪二：【假養生之名、行高糖流沙之實的網紅內餡】**  \n   市面許多老麵捲為了拍照好看，塞滿高糖煉乳、人造奶油奶黃流沙與化學香精芋泥。高油高糖直接讓賁門鬆弛，吃一顆火燒心一上午！\n3. **原罪三：【高溫烘烤重油重糖的精緻早點】**  \n   生吐司、可頌與鐵板麵靠大量油脂維持柔軟，配黑咖啡堪稱敏感胃災難。\n\n---\n\n## 🛡️ 武器 5：【三大硬核信任狀 (The 3 Physical RTBs)】\n\n1. **【物理結構鐵證】手指就是測謊儀：壓扁到底 3 秒 100% 回彈**  \n   無需相信廣告詞，收到貨自己壓！唯有經 12~16 小時野生酵母與乳酸菌慢發酵並反覆壓延的活氣孔筋膜網，才能壓成薄餅後 3 秒回彈，連放涼吃都 Q 彈不乾硬。\n2. **【時間與潔淨檢驗鐵證】竹北 30 年原型工藝 ✕ SGS 零添加 ✕ 原塊原粒 ✕ 雙規格設計**  \n   承襲全台胃最挑剔的新竹竹北生活圈 30 年老字號原型工藝；通過 SGS 無防腐劑、無化學膨脹劑檢驗；堅持只放**純白原麥、黑金剛黑糖、切丁雙色起司、黃金地瓜捲、整粒綜合堅果**，果斷剔除易反酸之桂竹筍捲。並首創「經典大老麵（主食）＋ 迷你一口包（點心）」雙規格，兼顧白領慢碳與幼兒零浪費。\n3. **【單向風險倒置制度】試吃 2 顆「不回彈或悶脹」免退回全額退費！**  \n   首購【NT$ 499 免運雙享受破冰體驗箱】（大老麵 6 入 ＋ 迷你一口包 12 粒），打開吃 2 顆配你平常喝的黑咖啡；只要壓下去不回彈，或一上午覺得悶脹不合胃口，**剩下的不用寄回來，LINE 客服 24 小時內無條件全額退費**！\n\n---\n\n## 💣 武器 6：【致命異議爆破彈 (The 3 Objection Killers)】\n\n| 買家掏錢前一秒的內心恐懼 | 慢酵所 5 秒鋼鐵擊碎答辯 |\n| :--- | :--- |\n| **異議 1：「巷口無糖饅頭一顆才 15 元，你們組合箱為什麼要 499 元／980 元？」** | **「我們純白原麥 6 入包單算也才 120 元、地瓜捲 6 入 150 元！線上組合箱把全程 -18°C 低溫冷鏈免運都包進去了，比起買一片 90 元生吐司或一顆 160 元酸種歐包，慢酵所用 12 小時幫你預分解澱粉，一頓舒坦早餐不到 40 元，直接省下一半預算！」** |\n| **異議 2：「我早上趕出門上班，哪有時間慢慢等加熱？」** | **「完全免顧火！早上起床電鍋外鍋倒半杯水按下開關，刷牙洗臉換好衣服 8~10 分鐘剛好跳起，熱騰騰出籠直接帶出門；一口小慢包更只要 5 分鐘，比你在瓦斯爐前煎蛋顧火輕鬆太多！」** |\n| **異議 3：「主打不脹氣純天然，會不會乾硬無味？大顆饅頭我家幼兒每次吃兩口就丟掉好浪費！」** | **「專門為媽媽解決了！我們除了 42% 高保水、蒸熱鹹香牽絲的『雙色切丁起司大老麵』與『黑金剛黑糖老麵』，更把原店隱藏爆款做成『一口回彈小慢包（迷你黑金剛12粒入 $160／綜合分享袋 $120）』——小孩手掌大小一口一顆剛剛好，零浪費秒殺光光！」** |\n\n---\n\n## 💬 武器 7：【市井轉述口金句 (Street Social Currency)】\n\n* **茶水間白領轉述金句（軌道 B）**：  \n  > *「欸你早上喝美式會脹氣喔？別再配吐司了啦！我都訂竹北那個『慢酵所』，早上電鍋蒸一顆切丁起司大老麵，壓下去真的 3 秒彈回來，開會一整天肚子超平！」*\n* **媽媽群組轉述金句（軌道 A/B）**：  \n  > *「我家冰庫現在固定囤『慢酵所』！阿公吃純白原麥跟黃金地瓜捲不會喊溢酸，大寶搶吃雙色起司，二寶吃『迷你黑金剛一口包』再也不會咬兩口丟掉浪費，電鍋按下去刷牙出門剛剛好！」*\n\n---\n\n## 📰 武器 8：【公關新聞與社群爭議引爆點 (PR Spike Agenda)】\n\n* **引爆議題主標**：  \n  **《台灣每 4 人就有 1 人早餐後胃脹氣！發酵職人揭密：害你悶脹的往往不是麵粉，而是被偷走的「11.5 小時發酵時間」》**\n* **傳播切角**：發起 **#3秒指壓早餐測謊挑戰**——邀請網友、營養師與竹科工程師拿手邊常買的超商包子、吐司與【慢酵所】同時重壓 3 秒，實測誰塌成死麵糰、誰彈回原狀，引爆 Threads / Reels 自發實測熱潮！\n"
        },

吃完照樣火燒心、泛酸水——因為你買到了披著老麵外皮的「高油糖流沙炸彈」！\n\n【第 2 層：底層機制與利益鏈剖析（9~28s）】\n現在團購為了拍照好看，流行在老麵裡塞滿金沙奶黃、熔岩巧克力、或是加了大量砂糖與人造奶油的化學芋泥。消化醫學早就證實，高精製糖加上高油脂，會直接讓我們食道下方的賁門括約肌鬆弛！就算外皮真是老麵，裡面那坨流沙醬一進胃，照樣讓你溢酸難受一整個早上。\n\n【第 3 層：交付拿走即用的查驗武器（29~48s）】\n挑真正對胃溫和的麵食，記住兩個鐵標準：第一，翻開背面成分表，不准有泡打粉、乳化劑與人工香精；第二，撕開切面看內餡，必須是「原塊切丁」而不是「甜膩泥醬」！看得見一塊塊真實雙色起司丁、大甲芋頭丁、台灣地瓜丁與整顆核桃堅果，才有天然香氣又不給胃添亂。\n\n【第 4 層：必然邏輯收斂確立定位（49~60s）】\n在「慢酵所」，我們堅決不做任何一款爆漿流沙包。十二小時預分解回彈老麵，只揉進百分百原塊切丁真食材與純白原麥。主頁連結 499 免運體驗箱五大招牌一次吃齊，讓你的胃感受什麼叫真正的零負擔！\n```\n\n---\n\n### 🎙️ 大師深稿 03：【軌道 B 跨界旗艦・T7-01/T7-02 東方蒸製酸種對決歐包與吐司】\n* **標題**：**《早上必喝黑咖啡卻不敢配吐司？試試比 180 元酸種歐包更軟彈的「東方蒸製酸種」》**\n\n```text\n【第 1 層：逆常識現象引爆（0~8s）】\n早上一定要喝一杯黑咖啡醒腦，但只要配兩片吐司或可頌，十點胃就開始翻江倒海？這不是咖啡的錯，是你配錯了澱粉！\n\n【第 2 層：底層機制與利益鏈剖析（9~28s）】\n生吐司跟丹麥麵包為了鬆軟，加了驚人的奶油與精製糖，碰到黑咖啡就是胃酸逆流雙重暴擊。這幾年竹科跟歐美白領都在瘋一顆賣一百八十塊的「Sourdough 酸種麵包」，因為它靠天然野生酵母跟乳酸菌慢發酵十幾個小時，先把麩質跟澱粉分解掉所以不脹氣——但歐包兩百三十度烤出來外殼硬得像石頭，早上啃一顆上顎都刮破了！\n\n【第 3 層：交付拿走即用的查驗武器（29~48s）】\n其實亞洲人根本不用委屈啃硬歐包！同樣是十二到十六小時天然野生酵母加乳酸菌預分解，當我們改用「一百度純水蒸氣」取代高溫焦化烘烤，做出來的就是零烤焦、零奶油、保水度超過四成、壓扁三秒回彈的「東方蒸製酸種輕主食」！\n\n【第 4 層：必然邏輯收斂確立定位（49~60s）】\n「慢酵所」承襲竹北三十年純天然老麵配方，早上電鍋外鍋半杯水蒸八分鐘，切丁雙色起司與綜合堅果香氣直接配黑咖啡，單顆不到歐包四分之一價格！立即點下方搶訂早安慢碳體驗箱，拯救你的早晨咖啡時光！\n```\n\n---\n\n### 🎙️ 大師深稿 04：【軌道 A/B 定價與算帳・T4-01 擊碎 40 元比價異議】\n* **標題**：**《一顆 40 元的老麵饅頭貴嗎？算完生吐司跟冷凍運費的帳，你會覺得太划算》**\n\n```text\n【第 1 層：逆常識現象引爆（0~8s）】\n常有新朋友問：「巷口饅頭一顆十五塊，你們慢酵所組合箱平均一顆四十塊，為什麼貴兩倍？」今天我直接把烘焙業的成本底牌攤開算給你看！\n\n【第 2 層：底層機制與利益鏈剖析（9~28s）】\n做一顆十五塊的饅頭很簡單：一袋麵粉加幾公克商業酵母跟泡打粉，機器攪拌三十分鐘發好蒸熟，一小時能出幾千顆。但「慢酵所」承襲竹北三十年老麵原型工藝，光是恆溫養老麵、慢發酵預分解就要耗掉十二到十六小時，發酵室佔地與時間成本是速發廠的十倍；再加上我們揉進去的是真實雙色切達起司丁、台農黃金地瓜與整顆核桃，外加全程負十八度低溫冷鏈免運！\n\n【第 3 層：交付拿走即用的查驗武器（29~48s）】\n你換個座標算這筆帳：去連鎖健康烘焙店買一顆雜糧麵包要九十塊、一片生吐司八十塊、一顆酸種歐包一百六十塊，有些吃完還會悶脹；而慢酵所一顆四十出頭，電鍋蒸透熱騰騰出籠，給你整上午清爽專注的工作狀態。\n\n【第 4 層：必然邏輯收斂確立定位（49~60s）】\n每天省下一半買麵包的錢，把胃照顧得服服貼貼。新朋友先別買大箱，點下方連結帶走 499 免運雙享受破冰箱（大6＋小12），連超商冷凍運費我們都幫你出，吃兩顆不滿意全額退！\n```\n\n---\n\n### 🎙️ 大師深稿 05：【軌道 B 純蒸工藝・T6-02 電鍋 8 分鐘免顧火的極致彈潤】\n* **標題**：**《為什麼老麵一定要純水蒸才最好吃？電鍋 8 分鐘蒸出彈牙活氣孔的秘密》**\n\n```text\n【第 1 層：逆常識現象引爆（0~8s）】\n很多人以為早餐吃麵包比較快，但你算過熱鍋、煎蛋、洗油膩鍋子要花多少時間嗎？而且高油精製吐司吃進肚子，十點開會胃就開始泛酸！\n\n【第 2 層：底層機制與利益鏈剖析（9~28s）】\n西方烘焙用兩百多度高溫烤麵包，梅納反應烤出厚厚硬殼，既燥熱又容易刮嘴。但東方老麵最迷人的靈魂，是「一百度純水蒸氣」熟成——在溫潤水氣循環中，老麵十二小時培養出的微米級筋膜活氣孔完全舒展，保水度超過四成，既無油焦化，又絕不上火！\n\n【第 3 層：交付拿走即用的查驗武器（29~48s）】\n真正聰明的早晨覆熱，其實比你想像的更輕鬆：早上起床不用退冰，直接把慢酵所老麵放進電鍋，外鍋倒半杯水按下開關——你轉身去刷牙、洗臉、換衣服，八到十分鐘電鍋跳起，掀開鍋蓋熱氣直竄，壓扁三秒瞬間彈回原狀，裡面的起司丁還在微牽絲！\n\n【第 4 層：必然邏輯收斂確立定位（49~60s）】\n免開火、免顧爐、不用洗油膩煎鍋，刷牙洗臉出來直接有熱騰騰彈潤老麵配黑咖啡！點下方連結，把八分鐘舒坦早餐放進你家冰庫！\n```\n\n---\n\n### 🎙️ 大師深稿 06：【軌道 B 家庭常備箱・T8-01 三代早晨戰場救星】\n* **標題**：**《阿公怕溢酸、兒子挑嘴愛起司、媽媽控糖：一箱慢酵所搞定三代早晨戰場！》**\n\n```text\n【第 1 層：逆常識現象引爆（0~8s）】\n家裡有老又有小的媽媽，每天早上六點五十分是不是都像在打仗？買鐵板麵怕小孩吃進一堆添加物，買養生全麥麵包兒子又不肯咬、阿公吃了甜麵包又喊胃溢酸！\n\n【第 2 層：底層機制與利益鏈剖析（9~28s）】\n因為長輩、小孩跟大人的生理需求本來就不一樣：長輩消化慢，最怕未發酵完全的澱粉跟精製糖；成長期小孩需要鈣質跟鹹香口感才會大口吃；而我們大人上班配咖啡需要優質油脂跟穩定慢碳。市面上很難找到同一種早餐能同時過這三關！\n\n【第 3 層：交付拿走即用的查驗武器（29~48s）】\n這就是為什麼竹北跟雙北媽媽都在囤「慢酵所三代安心常備箱」：底層全部是十二小時預分解、零泡打粉的回彈老麵——純白原麥跟微甜真芋頭丁地瓜丁給長輩，溫和好消化；滿滿雙色切丁起司給挑嘴小孩，鹹香濃郁早上自動吃光光；多穀養生堅果留給夫妻倆配黑咖啡帶去公司！\n\n【第 4 層：必然邏輯收斂確立定位（49~60s）】\n不用洗鍋子、不用開油煙，電鍋外鍋半杯水蒸透全家三代同時開動，媽媽早上直接多睡二十分鐘！點擊下方先訂 499 免運雙享受體驗箱（大6＋小12）讓全家試吃投票，喜歡再升級 24 入自選常備箱！\n```\n"

          "raw": "# 🧪 慢酵所 (MANXIAO LAB) 行動承諾與真金白銀微型測謊漏斗\n\n> **專案代號**：`mantou` ｜ **正式品牌**：**【慢酵所｜12h 預分解老麵輕主食】**  \n> **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **法源依據**：《特勞特定位最高憲法》【公理 18：行動承諾測謊公理】——播放量、按讚與「看起來好好吃」留言全屬零價值虛榮指標，唯有消費者掏出真金白銀刷卡或留下私密聯絡方式搶候補，才算通過市場測謊！\n\n---\n\n## 🪜 一、【慢酵所】三級行動承諾測謊階梯 (Skin-in-the-Game Ladder)\n\n```mermaid\nflowchart TD\n    classDef l1 fill:#ffebee,stroke:#c62828,stroke-width:1px,color:#111827;\n    classDef l2 fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef l3 fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px,color:#111827;\n\n    T1[\"🚫 階梯 1：注意力虛榮信號（嚴禁作為擴產依據！）<br/>• 短影音破 10 萬觀看、網友按讚留言『流口水』<br/>• 商業價值 ＝ NT$ 0（看熱鬧壓饅頭不等於願意買單）\"]:::l1\n    -->\n    T2[\"🟡 階梯 2：隱私與時間摩擦承諾（初級有效信號）<br/>• 加入【慢酵所 LINE 官方帳號】填寫 3 題敏感胃早安偏好<br/>• 領取『本週新鮮出籠限量 50 箱開搶通知＋免運碼』<br/>• 考核硬指標：有效名單成本 CPL ≤ NT$ 65\"]:::l2\n    -->\n    T3[\"🟢 階梯 3：真金白銀貨幣承諾（終極測謊綠燈！）<br/>• 階段1尖刀：直接刷卡 NT$ 499 購買【10入免運回彈破冰箱】<br/>• 階段2升維：直接刷卡 NT$ 980【24入家庭箱】或 NT$ 1,380【36入月配箱】<br/>• 考核硬指標：首單保本 CPA ≤ NT$ 207 ｜ 30 天回購轉常備箱率 ≥ 40%\"]:::l3\n```\n\n---\n\n## 🎯 二、雙階承接漏斗動線與結帳摩擦消除設計\n\n### 1. 短影音結尾強制導流指令（拒絕「歡迎按讚關注」）\n* **針對【階段 1：敏感胃破冰客】**：  \n  *「別聽我誇，讓你的手指跟胃親自驗貨！點下方連結搶訂本週限量出籠的【NT$ 499 超商冷凍免運雙享受體驗箱】（大老麵 6 入 ＋ 迷你一口包 12 粒），收到先吃 2 顆，壓扁不回彈或覺得悶脹，免退回直接全額退！」*\n* **針對【階段 2：黑咖啡白領與三代家庭客】**：  \n  *「把冰庫裡的傷胃吐司換掉！點下方直選【NT$ 980 三代安心 24 入自選常備箱】或【NT$ 1,380 東方酸種 36 入月配箱】，早晨享受舒坦慢碳！」*\n\n### 2. 結帳頁「順手加購（Order Bump）」拉高客單設計\n為抵銷 NT$ 499 免運破冰箱的低溫運費成本，在結帳按鈕上方設置單一勾選框：\n> ☑️ **【限首購加價 +NT$ 160（免加收運費）】多帶一袋辦公室下午茶神器《迷你黑金剛一口包 12 粒入》（或雙色起司老麵 4 顆）！** *(預估 35% 顧客勾選，使首單平均客單價從 $499 直接跳升至 $558~$659，首單淨邊際毛利大幅拉升！)*\n\n### 3. 極簡 3 題「出籠候補＆回購分流微型問卷」（嵌於結帳完成頁／LINE 歡迎語）\n不讓顧客填冗長表單，只問 3 個決定後續精準推播的黃金問題（10 秒點選完成）：\n1. **您平時早上吃一般麵包或吐司最困擾的是？**  \n   `[A. 早上開會容易胃悶脹/泛酸]` ｜ `[B. 怕化學添加物不敢給小孩長輩吃]` ｜ `[C. 單純熱愛老麵 Q 彈嚼勁]`\n2. **您平時最常用什麼方式加熱饅頭？**  \n   `[A. 家裡電鍋/蒸鍋（外鍋半杯水蒸透）]` ｜ `[B. 辦公室微波/蒸烤箱]` ｜ `[C. 氣炸鍋烘烤酥脆一口吃]`\n3. **試吃滿意後，哪種補貨頻率最方便您家冷凍庫空間？**  \n   `[A. 雙週配送 24 顆]` ｜ `[B. 每月配送 36 顆享最低單價]` ｜ `[C. 吃完再手動回購]`\n\n---\n\n## 🚦 三、真金白銀測謊判決「三色信號燈」矩陣 (Traffic Light Verdict)\n\n首輪投入 **NT$ 10,000 廣告測試金**（軌道 A 與軌道 B 各 NT$ 5,000，測試週期 7~10 天），依後台真實刷卡數據無情裁決：\n\n| 判決燈號 | 數據觸發條件（真金白銀硬指標） | 戰略診斷結論 | 強制執行下一步動作 |\n| :---: | :--- | :--- | :--- |\n| **🔴 紅燈<br>（切角止損）** | • 外連點擊率 `CTR < 1.2%`<br>• 或單筆成交成本 `CPA > NT$ 380`<br>• 50 箱破冰組 10 天賣不到 15 箱 | 前 3 秒痛點未刺穿，或受眾選錯（投到了只買 12 元便宜饅頭的價格敏感群）。 | **嚴禁盲目追加預算或訂做萬個彩盒！** 立即暫停末位素材，收窄受眾至「竹北＋雙北 30~52 歲精品咖啡／健康烘焙」興趣圈重測。 |\n| **🟡 黃燈<br>（信任補強）** | • 外連點擊率極高 `CTR ≥ 2.5%`<br>• 加入購物車多，但結帳率 `CVR < 1.8%` | **「不脹氣回彈老麵／東方酸種」藍海需求極旺！** 但消費者對新品牌仍有猶豫（怕不好吃或怕加熱麻煩）。 | 在落地頁首屏與結帳鈕正上方放大 **「電鍋免顧火蒸透動圖」＋「吃 2 顆不滿意免退回全額退費印章」＋「竹北 30 年原型口碑實證」**。 |\n| **🟢 綠燈<br>（藍海確立！）** | • 外連點擊率 `CTR ≥ 2.2%`<br>• 破冰箱成交成本 `CPA ≤ NT$ 210`（或常備箱 `CPA ≤ NT$ 340`）<br>• 首批 50~100 箱於 7 天內完售，且退費率 `< 3%` | **雙階藍海真空 100% 驗證成立！** 前端能保本獲客、後端靠 45%+ 回購躺賺複利現金流！ | **全面開火放量！** 正式啟動 [`../scale_defense/07_moat_and_fulfillment.md`](../scale_defense/07_moat_and_fulfillment.md) 擴產與月配訂閱鎖客！ |\n"

          "raw": "# 🛡️ 慢酵所 (MANXIAO LAB) 履約瓶頸排查與 7 Powers 防禦壁壘報告\n\n> **專案代號**：`mantou` ｜ **正式品牌**：**【慢酵所｜12h 預分解老麵輕主食】**  \n> **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **啟動時機**：當前端 `$499 破冰箱` 與 `$980/$1,380 常備箱` 測謊亮綠燈、日均訂單從 20 箱暴增至 200 箱（日產 4,000+ 顆）時，防止「爆單品質崩潰」與「巨頭 7 天抄襲」的戰略防禦工事。\n\n---\n\n## ⚙️ 一、供應鏈 TOC（限制理論）三大履約瓶頸排查與擴產 SOP\n\n天然老麵與化學速發饅頭最大的生產差異，在於**「時間與溫濕度不可壓縮」**。單量放大 10 倍時，以下三個環節會最先斷裂，必須提前部署模組化緩衝：\n\n```mermaid\nflowchart LR\n    classDef risk fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef fix fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n\n    B1[\"⚠️ 瓶頸 1：12~16h 老麵發酵槽空間與冬夏溫差失控\"]:::risk\n    --> S1[\"✅ 解法：導入『28°C / 75%RH 微電腦恆溫恆濕發酵箱陣列』<br/>夜間 20:00 投料慢發酵 ➔ 隔晨 08:00 準時壓延蒸製（零夜班人力浪費！）\"]:::fix\n\n    B2[\"⚠️ 瓶頸 2：出籠後常溫放涼導致澱粉回生老化（失去3秒回彈力）\"]:::risk\n    --> S2[\"✅ 解法：建立『出籠黃金 30 分鐘 -35°C 急速冷凍隧道（IQF）』<br/>瞬間鎖住 42% 水分與微米活氣孔，確保宅配電鍋蒸透後 100% 還原回彈！\"]:::fix\n\n    B3[\"⚠️ 瓶頸 3：雙尺寸（大老麵＋迷你小慢包）手工分切與冷凍倉儲爆倉\"]:::risk\n    --> S3[\"✅ 解法：導入『大顆標準滾圓＋迷你一口包雙模自動分割成型線』，地瓜/起司採標準切丁專供；<br/>果斷砍除易腐敗之鹹肉筍捲，全素/奶素潔淨產線零交叉污染，每週二、五批次急凍出貨！\"]:::fix\n```\n\n### 📦 產能三階段彈性擴張階梯表\n\n| 營運階段 | 日均單量規模 | 每日顆數需求 | 生產與冷鏈履約配置 | 品質防崩潰紅線 |\n| :--- | :---: | :---: | :--- | :--- |\n| **Phase 1：測謊驗證期** | 15 ~ 30 箱/日 | 300 ~ 600 顆 | 既有工坊雙門恆溫發酵箱＋商用蒸箱＋臥式急凍櫃＋7-11/全家冷凍店到店寄件 | 每批出籠抽檢 2 顆做「蒸透後 3 秒壓扁回彈測試」，不達標整籠報廢不准出貨。 |\n| **Phase 2：穩健放量期** | 80 ~ 150 箱/日 | 1,800 ~ 3,500 顆 | 增設自動壓延捲麵機（取代純手揉肌腱炎瓶頸，且壓延筋膜層次更均勻回彈）＋立體保鮮包裝機 | 網頁開啟「本週第 X 批老麵培養中・預計週四新鮮急凍寄出」批次預購進度條，把等待變成新鮮信任狀！ |\n| **Phase 3：全國訂閱期** | 300+ 箱/日 | 7,000 ~ 10,000 顆 | 標準化無塵中央發酵工坊＋第三方低溫倉儲代發（3PL WMS 系統自動揀貨裝箱） | 保留 60% 產能優先供給「$1,380 月配訂閱老客」，穩定基本盤現金流。 |\n\n---\n\n## 🏰 二、Hamilton Helmer《7 Powers》防抄襲結構性護城河\n\n當【慢酵所】在社群跑出高 ROAS，奇美／義美等食品巨頭、竹北老麵同行或西式連鎖烘焙若想在 7 天內抄襲，將撞上我們預先築起的 **4 道結構性壁壘**：\n\n### 1. 【反向定位 (Counter-Positioning)】—— 巨頭看得見卻不敢跟的最大殺器！\n* **對量販巨頭（奇美／義美）的死鎖**：巨頭工廠的核心資產是「每小時數萬顆的 40 分鐘速發連續產線」與超商低價供貨合約（出廠價僅 6~9 元）。若他們改推「12~16 小時慢發酵老麵」，工廠產能瞬間暴跌 80%，且等於公開承認自己賣了幾十年的主力包子饅頭是「速發易脹氣款」，直接自毀百億基本盤！\n* **對網紅老麵店（如老麵酵匠等爆料派）的死鎖**：他們 70% 營收來自「爆漿奶黃流沙、熔岩芝麻、芋泥火山捲」。若跟進我們喊出「高糖流沙害你火燒心，真養胃只吃原塊切丁＋3 秒整顆回彈」，等於親手砍掉自己最賺錢的爆漿產品線！\n\n### 2. 【品牌心智字眼壟斷 (Brand Mindshare Monopoly)】\n* 透過【慢酵所】商標註冊與高頻短影音轟炸，率先在全台敏感胃與竹科白領腦中完成等號綁定：**「慢酵所 ＝ 12h 預分解 ＝ 壓扁 3 秒回彈 ＝ 配黑咖啡不脹氣的東方酸種」**。後進模仿者再拍壓饅頭影片，只會被網友留言嘲笑：「這不是在抄慢酵所嗎？」\n\n### 3. 【轉換成本與家庭冰庫佔領 (Switching Costs)】—— 月配訂閱鎖定術\n* 敏感胃客群具有極強的**「生理安全感依賴（Physiological Trust Lock-in）」**：一旦一個胃容易脹氣的工程師或長輩發現「吃慢酵所真的連續一個月早上都很舒服」，他絕對不敢為了省 5 塊錢隨便換回未知品牌的饅頭拿自己的胃冒險！\n* 透過 **【階段 2：東方酸種 36 入月配箱】**（綁定信用卡定期定額、享最低單顆 $38.3 優惠、自由換口味、滿 3 期送陶瓷微波蒸氣盤），直接把顧客家裡的冷凍庫抽屜包年壟斷！\n\n### 4. 【專有工藝微生態資產 (Cornered Craft Resource)】\n* 承襲竹北 30 年老字號馴化傳承的老麵母種（野生酵母與在地乳酸菌共生菌群比例），搭配「原塊切丁揉入筋膜不斷裂參數」與「出籠急凍＋純水蒸氣還原曲線」，代工廠用現成冷凍麵糰根本無法複製「蒸熟後依然 3 秒 100% 回彈且冷掉不硬」的物理體感！\n"

          "raw": "# 單元經濟模型與冷凍宅配獲客破產防線 (Unit Economics & Breakeven Cap)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **核心任務**：算清低溫冷凍電商最殘酷的「運費與包材黑洞」，建立【階段 1 破冰／家庭箱】與【階段 2 月配跨界慢碳箱】的單單毛利結構，訂出絕不虧錢的最高容許獲客成本（CAC Cap）與保本轉換率紅線。\n\n---\n\n## 💰 一、為什麼傳統饅頭店做網購 90% 賠錢？（低溫物流成本真相）\n\n實體店賣一顆饅頭 NT$ 25，顧客自取 0 運費，毛利可達 NT$ 14~16。但一旦搬上網路冷凍宅配，每張訂單立刻多出三筆剛性變動成本：\n1. **低溫物流運費**：7-11／全家冷凍店到店大宗合約價約 **NT$ 99 ~ 115／件**；黑貓低溫宅配（60~90cm）合約價約 **NT$ 155 ~ 190／件**。\n2. **冷凍專用抗凍五層紙箱＋食品級獨立包裝袋**：每單約 **NT$ 28 ~ 42**。\n3. **金流手續費與發票稅費**：約佔客單價 **3.5%**。\n\n> 🛑 **鐵血財務結論**：若平均客單價（AOV）低於 NT$ 450，光運費就吃掉 30% 營收，投廣告必死無疑！因此我們設計「三階箱購火箭」，徹底封殺散顆零售。\n\n---\n\n## 📊 二、雙階三梯隊單單財務拆解表 (Single-Order P&L Matrix)\n\n```mermaid\nflowchart LR\n    classDef t1 fill:#fff3e0,stroke:#ef6c00,stroke-width:2px,color:#111827;\n    classDef t2 fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef t3 fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    B1[\"【階梯 1・階段1獲客破冰箱】<br/>10入免運體驗組 NT$ 499<br/>• 邊際貢獻 CM：NT$ 206 (41.3%)<br/>• 首單保本 CAC 上限：NT$ 200<br/>（戰略目標：零虧損圈進敏感胃新客）\"]:::t1\n    -->\n    B2[\"【階梯 2・階段1&2主力常備箱】<br/>24入三代家庭雙週箱 NT$ 980<br/>• 邊際貢獻 CM：NT$ 516 (52.7%)<br/>• 容許 CAC Cap：NT$ 361<br/>（戰略目標：首單即淨賺現金流）\"]:::t2\n    -->\n    B3[\"【階梯 3・階段2跨界訂閱旗艦】<br/>36入東方酸種月配箱 NT$ 1,380<br/>• 邊際貢獻 CM：NT$ 727 (52.7%)<br/>• 容許 CAC Cap：NT$ 509 ｜ 年 LTV 逾 $6,800<br/>（戰略目標：鎖定白領與家庭長期現金牛）\"]:::t3\n```\n\n### 詳細成本與毛利精算表（幣別：新台幣 TWD）\n\n| 財務指標項目 | 【階梯 1：雙享受破冰體驗箱】<br>大老麵 6 入 ＋ 迷你包 12 粒 | 【階梯 2：三代安心自選常備箱】<br>任選 4 組 6 入家庭包共 24 入 | 【階梯 3：東方酸種月配 36 入定期箱】<br>任選 6 組 6 入或混搭迷你袋 |\n| :--- | :---: | :---: | :---: |\n| **組合內容配置** | 大老麵 6 款（招牌各一）＋ 迷你黑金剛 6 粒 ＋ 迷你綜合 6 粒 | 4 組 6 入家庭包自由任搭（純白/黑金剛/地瓜/堅果/起司） | 36 入大老麵自由選配或混搭迷你袋 |\n| **終端售價 (Price, P)** | **NT$ 499** *(超商冷凍免運)* | **NT$ 980** *(折合 $40.8/顆，超商免運)* | **NT$ 1,380** *(折合 $38.3/顆，黑貓免運)* |\n| **食材與手工老麵製造成本 (COGS)** | NT$ 138 *(均 $13.8/份量比)* | NT$ 312 *(均 $13.0/顆)* | NT$ 440 *(均 $12.2/顆)* |\n| **產品毛利額 ／ 產品毛利率** | **NT$ 361 (72.3%)** | **NT$ 668 (68.2%)** | **NT$ 940 (68.1%)** |\n| **食品級密封袋＋抗凍紙箱包材** | NT$ 30 | NT$ 40 | NT$ 50 |\n| **低溫物流成本（品牌吸收免運）** | NT$ 105 *(超商冷凍大宗)* | NT$ 105 *(超商冷凍大宗)* | NT$ 165 *(黑貓低溫宅配到府)* |\n| **金流與電子發票手續費 (3.5%)** | NT$ 17 | NT$ 34 | NT$ 48 |\n| **變動總成本合計 (Total VC)** | NT$ 292 | NT$ 493 | NT$ 708 |\n| **單單邊際貢獻額 (CM = P - VC)** | **NT$ 207 (41.5%)** | **NT$ 487 (49.7%)** | **NT$ 672 (48.7%)** |\n| **單單獲客成本安全上限 ($CAC_{max} = CM \\times 0.7$)** | **NT$ 145** *(極限保本線 $207)* | **NT$ 341** *(極限保本線 $487)* | **NT$ 470** *(極限保本線 $672)* |\n\n*(註：加計結帳頁 Order Bump 機制「加購迷你黑金剛一口包 12 粒入 +NT$ 160（零額外運費，純邊際毛利 +NT$ 105）」或起司丁加購，階梯 1 實際平均客單價可拉升至 NT$ 580~659，邊際貢獻大幅提升！)*\n\n---\n\n## 🎯 三、LTV（顧客終生價值）與短影音投流保本卡尺\n\n### 1. 為什麼「敏感胃早餐」擁有驚人的 LTV / CAC 槓桿？\n* 假設新客首單購買【NT$ 499 破冰箱】（邊際貢獻 NT$ 207），廣告獲客成本（CPA）花費 NT$ 260，首單微幅投資 NT$ 53；\n* 一旦客人驗證「真的壓扁回彈、配咖啡真的不脹氣！」，依食品電商敏感族群留存模型，**45% 首購客將轉化為雙月／月度常備箱訂戶**（年均回購 5 次 NT$ 980~1,380 常備箱）：\n  * **12 個月單客累計邊際毛利貢獻（LTV_CM）** ＝ $207 + (5 \\times 487) = \\mathbf{NT\\$ 2,642}$（若為全體首購客平均，亦高達 **NT$ 1,300+**）！\n  * **LTV / CAC 倍數高達 5.0 倍以上**（遠超健康電商 3.0 倍及格線）。\n\n### 2. 短影音實彈測試保本及格線（Pass / Kill Benchmarks）\n\n| 關鍵漏斗指標 | 階段 1（打回彈不脹氣破冰箱 $499） | 階段 2（打東方酸種慢碳家庭箱 $980+） | 低於此線之紅隊止損動作 |\n| :--- | :---: | :---: | :--- |\n| **前 3 秒完播留存率 (3s Thumbstop)** | **≥ 32%**（靠指壓回彈特寫強抓眼球） | **≥ 28%**（靠黑咖啡配歐包對比抓白領） | 更換前 2 秒手壓饅頭慢動作與音效 |\n| **外連點擊率 (Outbound CTR)** | **≥ 2.2%** | **≥ 1.8%** | 重新檢查標題是否踩中「脹氣／早餐」痛點 |\n| **單次有效點擊成本 (Target CPC)** | **≤ NT$ 7.5** | **≤ NT$ 10.0** | 剔除泛美食受眾，鎖定 30-55 歲健康與咖啡興趣詞 |\n| **落地頁結帳轉換率 (Landing CVR)** | **≥ 3.6%**（保本 CPA ≤ NT$ 208） | **≥ 2.8%**（保本 CPA ≤ NT$ 357） | 強化「吃 2 顆不滿意免退回全額退」風險倒置橫幅 |\n"

          "raw": "# 【思維神經元母體】階段 1: 企業資產解構與去骨審計 (01_assets.yaml)\nproject_id: \"mantou\"\nversion: \"1.0.0\"\naudit_date: \"2026-11-24\"\n\nstripped_adjectives_graveyard:\n  - \"純天然 (空泛自稱，無檢驗標準，市面 99% 烘焙坊皆自稱天然)\"\n  - \"好吃 (主觀廢話，無法在首購前形成信任)\"\n  - \"用心手作 (傳統老店通用形容詞，零心智區隔度)\"\n  - \"健康養生 (高齡老氣標籤，年輕白領與小孩本能抗拒)\"\n\nassets:\n  heritage_benchmark:\n    reference_entity: \"新竹竹北『莒光饅頭店』（竹北市中山路 420 號，源自光復饅頭體系在地深耕逾 30 年）\"\n    organic_social_proof:\n      - \"深耕竹北高收入科技生活圈 30 餘年，累積大量在地居民與美食部落客自發性長文食記\"\n      - \"顧客一致自發高頻評論詞：『吃完不胃酸、不脹氣』、『放涼了一樣 Q 彈有勁』、『每一口都咬得到真芋頭丁與起司塊』\"\n    brand_equity_verdict: \"『莒光』具極高在地真實口碑，但字面帶有傳統眷村銅板價錨點與地名商標排他性弱點；最佳解為『創立全新高溢價藍海品牌 ＋ 標註源自竹北 30 年莒光老麵原型工藝實證』\"\n\n  core_capabilities:\n    AST-01:\n      name: \"12~16 小時野生酵母與乳酸菌『老麵慢發酵預分解工藝』\"\n      scientific_mechanism: \"老麵富含天然野生酵母與活性乳酸菌群，經長時恆溫慢發酵，乳酸菌與酵素預先將小麥中難消化的大分子支鏈澱粉與麩質蛋白質（Gluten）剪切分解為小分子胺基酸與單雙醣，進入胃部後不再劇烈產氣、不異常刺激胃酸衝開賁門。\"\n      user_benefit: \"敏感胃、易脹氣、怕溢酸族群早上吃完配黑咖啡或豆漿，開會一整個上午胃部平坦舒適。\"\n\n    AST-02:\n      name: \"『壓扁 3 秒瞬間回彈』高密度立體筋膜氣孔結構 (超級視覺錘)\"\n      physical_mechanism: \"無化學泡打粉（含鋁膨脹劑）與速發改良劑的虛胖大空洞；純靠老麵長時發酵與多次壓延揉製，形成如記憶海綿般緊密均勻的微米級立體筋膜網，蒸熟後重壓到底可在 3 秒內 100% 彈回原狀，且放涼不乾硬、不死麵。\"\n      user_benefit: \"消費者在家用兩根手指就能當場驗明正身——『會回彈的才不會在胃裡結成死麵塊』。\"\n\n    AST-03:\n      name: \"『原塊切丁真食材 ✕ 雙規格尺寸』精準剪裁產品矩陣（非化學香精泥與高油流沙）\"\n      original_store_price_audit:\n        mini_specs:\n          - \"綜合小饅頭（約 2 台斤重）：售價 NT$ 100\"\n          - \"迷你黑金剛（12 粒入）：售價 NT$ 160（每粒約 13.3 元）\"\n        regular_specs:\n          - \"無糖純白饅頭 / 微甜饅頭：單顆 NT$ 15（6 入家庭包 NT$ 120，平均 20 元/顆含包裝）\"\n          - \"全麥饅頭：單顆 NT$ 29（升級整粒堅果 6 入包 NT$ 210）\"\n          - \"黑金剛饅頭：6 入家庭包 NT$ 180（單顆約 30 元）\"\n          - \"蕃薯地瓜捲：6 入家庭包 NT$ 150（單顆約 25 元）\"\n          - \"桂竹筍捲：6 入家庭包 NT$ 210（【策略剔除】重油重蔥與輕主食定位衝突，易胃酸逆流且易變質，堅決不賣）\"\n      curated_sku_architecture:\n        regular_sourdough_line:\n          description: \"【回彈大老麵系列（一般規格 / 6 入家庭包）】早安慢碳與正餐主食\"\n          skus:\n            - \"純白原麥回彈老麵（無糖/微甜）：單顆 15 元，6 入家庭包 NT$ 120（0 糖 0 油極簡，百搭夾蛋，極敏胃首選）\"\n     // Build Sidebar Nav
    function buildSidebar(filterText = '') {
      const navContainer = document.getElementById('nav-tree');
      navContainer.innerHTML = '';
      
      const filter = filterText.toLowerCase().trim();

      DOCS_DATA.categories.forEach(cat => {
        const matchingFiles = cat.files.filter(f => {
          if (!filter) return true;
          return f.title.toLowerCase().includes(filter) || f.path.toLowerCase().includes(filter);
        });

        if (matchingFiles.length === 0) return;

        const catEl = document.createElement('div');
        catEl.className = 'nav-category';

        const catTitle = document.createElement('div');
        catTitle.className = 'category-title';
        catTitle.innerHTML = `<span>${cat.icon}</span> <span>${cat.name}</span>`;
        catEl.appendChild(catTitle);

        matchingFiles.forEach(file => {
          const item = document.createElement('a');
          item.className = 'nav-item' + (file.path === currentDocPath ? ' active' : '');
          item.href = '#' + encodeURIComponent(file.path);
          item.innerHTML = `<span class="nav-item-icon">${file.isYaml ? '🧠' : '📄'}</span> <span title="${file.path}">${file.title}</span>`;
          
          item.onclick = (e) => {
            e.preventDefault();
            loadDocument(file.path);
          };

          catEl.appendChild(item);
        });

        navContainer.appendChild(catEl);
      });
    }

    // Load Document

      // Render Markdown
      let html = marked.parse(rawMd);

      // Restore Mermaid blocks into interactive cards with toolbar & lightbox triggers
      mermaidBlocks.forEach((code, idx) => {
        const placeholder = `<!--MERMAID_PLACEHOLDER_${idx}-->`;
        const cardHtml = `
          <div class="mermaid-card" id="mermaid-card-${idx}">
            <div class="mermaid-toolbar">
              <div class="mermaid-badge">📊 架構流程圖</div>
              <div class="mermaid-actions">
                <button class="mermaid-btn" onclick="zoomCard(this, 1.25)" title="放大">+</button>
                <button class="mermaid-btn" onclick="zoomCard(this, 0.8)" title="縮小">−</button>
                <button class="mermaid-btn" onclick="resetCard(this)" title="還原">↺</button>
                <button class="mermaid-btn primary" onclick="openMermaidModal(this)" title="全螢幕互動放大檢視">🔍 放大檢視</button>
              </div>
            </div>
            <div class="mermaid-viewport" onclick="openMermaidModal(this)" title="點擊放大至全螢幕 (可滑鼠滾輪縮放、拖曳平移)">
              <div class="mermaid-canvas" style="transform: scale(1);">
                <pre class="mermaid">${escapeHtml(code)}</pre>
              </div>
            </div>
          </div>
        `;
        html = html.replace(placeholder, cardHtml);
      });

      container.innerHTML = html;

      // Render Mermaid diagrams
      try {
        await mermaid.run({
          nodes: container.querySelectorAll('.mermaid')
        });
      } catch (err) {
        console.warn('Mermaid render error:', err);
      }

      // Hijack internal links (.md or relative links)
      container.querySelectorAll('a').forEach(anchor => {
        const href = anchor.getAttribute('href');
        if (!href) return;

        // Check if relative markdown or yaml
        if (!href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('#')) {
          // Normalize path
          const cleanHref = href.replace(/^\.\//, '').split('#')[0];
          
          // Match against DOCS_DATA keys
          let targetPath = null;
          for (let key in DOCS_DATA.files) {
            if (key.endsWith(cleanHref) || cleanHref.endsWith(key)) {
              targetPath = key;
              break;
            }
          }

          if (targetPath) {
            anchor.style.color = 'var(--gold-primary)';
            anchor.style.textDecoration = 'underline';
            anchor.onclick = (e) => {
              e.preventDefault();
              loadDocument(targetPath);
            };
          }
        }
      });

      // Generate TOC
      buildTOC();

      // Scroll to top
      document.getElementById('main').scrollTop = 0;
    }

    // Build Table of Contents
    function buildTOC() {
      const container = document.getElementById('article-content');
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';

      const headings = container.querySelectorAll('h1, h2, h3');
      if (headings.length === 0) {
        document.getElementById('toc-container').style.display = 'none';
        return;
      }
      document.getElementById('toc-container').style.display = 'block';

      headings.forEach((h, idx) => {
        const id = 'heading-' + idx;
        h.id = id;

        const li = document.createElement('li');
        li.className = 'toc-item depth-' + h.tagName.substring(1);

        const a = document.createElement('a');
        a.className = 'toc-link';
        a.href = '#' + id;
        a.textContent = h.textContent.replace(/^[#\s]+/, '');
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
        };

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function copyMarkdown() {
      const fileData = DOCS_DATA.files[currentDocPath];
      if (fileData) {
        navigator.clipboard.writeText(fileData.raw).then(() => {
          alert('✅ 已複製本篇 Markdown 原始碼至剪貼簿！');
        });
      }
    }

    // Inline Card Zooming
    function zoomCard(btn, factor) {
      const card = btn.closest('.mermaid-card');
      const canvas = card.querySelector('.mermaid-canvas');
      let currentScale = parseFloat(canvas.dataset.scale || '1');
      currentScale = Math.min(Math.max(currentScale * factor, 0.5), 3.0);
      canvas.dataset.scale = currentScale;
      canvas.style.transform = `scale(${currentScale})`;
    }

    function resetCard(btn) {
      const card = btn.closest('.mermaid-card');
      const canvas = card.querySelector('.mermaid-canvas');
      canvas.dataset.scale = '1';
      canvas.style.transform = 'scale(1)';
    }

    // Lightbox Modal Interactive Zoom & Pan
    let modalScale = 1.0;
    let modalPanX = 0;
    let modalPanY = 0;
    let isDragging = false;
    let startDragX = 0;
    let startDragY = 0;

    function openMermaidModal(element) {
      const card = element.closest('.mermaid-card');
      if (!card) return;
      const originalSvg = card.querySelector('svg');
      if (!originalSvg) return;

      const modal = document.getElementById('mermaid-modal');
      const canvas = document.getElementById('modal-canvas');
      
      // Clone svg into modal canvas
      const clonedSvg = originalSvg.cloneNode(true);
      canvas.innerHTML = '';
      canvas.appendChild(clonedSvg);
      
      // Reset pan offset
      modalPanX = 0;
      modalPanY = 0;
      
      // Extract natural dimensions from viewBox string
      let naturalWidth = 800;
      let naturalHeight = 500;
      
      const vbAttr = clonedSvg.getAttribute('viewBox');
      if (vbAttr) {
        const parts = vbAttr.trim().split(/[\s,]+/);
        if (parts.length === 4) {
          naturalWidth = parseFloat(parts[2]) || naturalWidth;
          naturalHeight = parseFloat(parts[3]) || naturalHeight;
        }
      } else {
        const b = originalSvg.getBoundingClientRect();
        if (b.width > 0) naturalWidth = b.width;
        if (b.height > 0) naturalHeight = b.height;
      }
      
      // Set explicit dimensions on cloned SVG so it never collapses
      clonedSvg.setAttribute('width', naturalWidth + 'px');
      clonedSvg.setAttribute('height', naturalHeight + 'px');
      clonedSvg.style.width = naturalWidth + 'px';
      clonedSvg.style.height = naturalHeight + 'px';
      clonedSvg.style.maxWidth = 'none';
      clonedSvg.style.maxHeight = 'none';
      clonedSvg.style.display = 'block';

      // Smart Auto-Fit: Calculate optimal initial scale to comfortably fill 85% of modal
      const modalBody = document.getElementById('modal-viewport');
      const availW = modalBody && modalBody.clientWidth > 0 ? modalBody.clientWidth * 0.9 : window.innerWidth * 0.85;
      const availH = modalBody && modalBody.clientHeight > 0 ? modalBody.clientHeight * 0.85 : window.innerHeight * 0.75;
      let fitScale = Math.min(availW / naturalWidth, availH / naturalHeight);
      if (fitScale > 2.5) fitScale = 2.5;
      if (fitScale < 0.3) fitScale = 0.3;
      modalScale = parseFloat(fitScale.toFixed(2));

      updateModalTransform();
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeMermaidModal() {
      const modal = document.getElementById('mermaid-modal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
      const canvas = document.getElementById('modal-canvas');
      canvas.innerHTML = '';
    }

    function onModalBackdropClick(event) {
      // Only close if clicking outside modal dialog (the backdrop itself)
      if (event.target.id === 'mermaid-modal') {
        closeMermaidModal();
      }
    }

    function updateModalTransform() {
      const canvas = document.getElementById('modal-canvas');
      canvas.style.transform = `translate(${modalPanX}px, ${modalPanY}px) scale(${modalScale})`;
      document.getElementById('modal-zoom-text').textContent = `${Math.round(modalScale * 100)}%`;
    }

    function zoomModal(factor) {
      modalScale = Math.min(Math.max(modalScale * factor, 0.25), 6.0);
      updateModalTransform();
    }

    function resetModalZoom() {
      modalScale = 1.0;
      modalPanX = 0;
      modalPanY = 0;
      updateModalTransform();
    }

    function setupModalListeners() {
      const viewport = document.getElementById('modal-viewport');
      if (!viewport) return;

      // Mouse Wheel Zoom
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomModal(factor);
      }, { passive: false });

      // Mouse Drag Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // Left click only
        isDragging = true;
        startDragX = e.clientX - modalPanX;
        startDragY = e.clientY - modalPanY;
        viewport.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        modalPanX = e.clientX - startDragX;
        modalPanY = e.clientY - startDragY;
        updateModalTransform();
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          const viewport = document.getElementById('modal-viewport');
          if (viewport) viewport.style.cursor = 'grab';
        }
      });

      // Double click to reset
      viewport.addEventListener('dblclick', (e) => {
        if (e.target.closest('.modal-controls') || e.target.closest('.modal-header')) return;
        resetModalZoom();
      });

      // Keyboard Esc to close
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMermaidModal();
        }
      });
    }

    function toggleTheme() {
      const body = document.body;
      const isLight = body.classList.toggle('theme-light');
      document.getElementById('theme-icon').textContent = isLight ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = isLight ? '淺色模式' : '深色模式';
    }

    // Setup Search
    document.getElementById('search-box').addEventListener('input', (e) => {
      buildSidebar(e.target.value);
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      buildSidebar();
      setupModalListeners();

      // Check hash
      const hash = window.location.hash.substring(1);
      if (hash && DOCS_DATA.files[decodeURIComponent(hash)]) {
        loadDocument(decodeURIComponent(hash));
      } else {
        loadDocument(currentDocPath);
      }
    });
  </script>
</body>
</html>
