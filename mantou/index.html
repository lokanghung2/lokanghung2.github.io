<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢酵所 ManXiao Lab ｜ 商業戰略定位全案知識庫</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Markdown & Syntax & Mermaid Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/yaml.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
      
      /* Dark Theme (Default) */
      --bg-body: #090a0d;
      --bg-sidebar: #0f1117;
      --bg-card: #151821;
      --bg-surface: #1a1e2a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #e2b857;
      --gold-primary: #e2b857;
      --gold-light: #f6d88b;
      --gold-dark: #b88d30;
      --blue-accent: #38bdf8;
      --green-accent: #4ade80;
      --sidebar-width: 320px;
      --toc-width: 260px;
    }

    body.theme-light {
      --bg-body: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #b88d30;
      --gold-primary: #b88d30;
      --gold-light: #927021;
      --gold-dark: #745615;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 20px 18px 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .project-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(226, 184, 87, 0.25);
    }

    .project-title-group {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .project-name {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-badge {
      font-size: 0.72rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Search Box */
    .search-container {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Sidebar Navigation Tree */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }

    .nav-category {
      margin-bottom: 18px;
    }

    .category-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 6px;
      font-size: 0.86rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(226, 184, 87, 0.12);
      color: var(--gold-primary);
      font-weight: 600;
      border-left: 3px solid var(--gold-primary);
    }

    .nav-item-icon {
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn:hover {
      border-color: var(--gold-primary);
    }

    /* Main Content Area */
    #main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Action Bar */
    .top-bar {
      height: 52px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--bg-body);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .doc-breadcrumbs {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .doc-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Document Viewer Container */
    .content-layout {
      display: flex;
      flex: 1;
      position: relative;
    }

    .markdown-container {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 32px 100px 32px;
      overflow-wrap: break-word;
      line-height: 1.75;
      font-size: 1.02rem;
    }

    /* Right Table of Contents (TOC) */
    #toc-container {
      width: var(--toc-width);
      min-width: var(--toc-width);
      padding: 30px 20px 40px 10px;
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      font-size: 0.82rem;
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
    }

    .toc-title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .toc-list {
      list-style: none;
    }

    .toc-item {
      margin: 4px 0;
    }

    .toc-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1.4;
      transition: all 0.15s;
    }

    .toc-link:hover {
      color: var(--text-main);
      background: var(--bg-surface);
    }

    .toc-link.active {
      color: var(--gold-primary);
      font-weight: 600;
      border-left: 2px solid var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .toc-item.depth-3 .toc-link {
      padding-left: 20px;
      font-size: 0.78rem;
    }

    /* Markdown Typography & Styling */
    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 900;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 14px;
      margin-top: 10px;
      margin-bottom: 24px;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      font-weight: 800;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 38px;
      margin-bottom: 18px;
      color: var(--text-main);
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 16px;
    }

    .markdown-body strong {
      font-weight: 700;
      color: var(--gold-light);
    }

    body.theme-light .markdown-body strong {
      color: #92400e;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--gold-primary);
      background: rgba(226, 184, 87, 0.06);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 18px 0;
      color: var(--text-muted);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f472b6;
    }

    .markdown-body pre {
      background: #111318 !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.88rem;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.92rem;
    }

    .markdown-body table th,
    .markdown-body table td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body table th {
      background: var(--bg-surface);
      font-weight: 700;
      color: var(--text-main);
    }

    .markdown-body table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    body.theme-light .markdown-body table tr:nth-child(even) {
      background: #f8fafc;
    }

    /* Mermaid Card, Viewport & Interactive Zoom */
    .mermaid-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin: 24px 0;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .mermaid-card:hover {
      border-color: rgba(226, 184, 87, 0.4);
      box-shadow: 0 6px 28px rgba(226, 184, 87, 0.12);
    }

    .mermaid-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .mermaid-badge {
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
    }

    .mermaid-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mermaid-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .mermaid-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .mermaid-btn.primary {
      background: rgba(226, 184, 87, 0.18);
      border-color: var(--gold-primary);
      color: var(--gold-light);
      font-weight: 700;
    }

    .mermaid-btn.primary:hover {
      background: var(--gold-primary);
      color: #000;
    }

    .mermaid-viewport {
      min-height: 180px;
      max-height: 520px;
      overflow: auto;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
      position: relative;
      background: radial-gradient(circle at center, rgba(226, 184, 87, 0.02) 0%, transparent 70%);
    }

    .mermaid-canvas {
      display: inline-block;
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mermaid-canvas svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Mermaid Fullscreen Lightbox Modal */
    .mermaid-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 5, 8, 0.92);
      backdrop-filter: blur(14px);
      z-index: 9999;
      padding: 24px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
    }

    .mermaid-modal.active {
      display: flex;
    }

    .modal-dialog {
      width: 95vw;
      height: 92vh;
      background: #0d0f15;
      border: 1px solid var(--gold-primary);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), 0 0 30px rgba(226, 184, 87, 0.25);
    }

    .modal-header {
      height: 54px;
      background: #141721;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .modal-title {
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
    }

    .modal-scale-indicator {
      background: rgba(226, 184, 87, 0.18);
      color: var(--gold-primary);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      font-weight: 700;
      border: 1px solid rgba(226, 184, 87, 0.3);
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      background: #1a1e2a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .modal-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: rgba(226, 184, 87, 0.08);
    }

    .modal-btn.close-btn {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-weight: 700;
    }

    .modal-btn.close-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .modal-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 36, 52, 0.6) 0%, #08090d 100%);
      cursor: grab;
      user-select: none;
    }

    .modal-body:active {
      cursor: grabbing;
    }

    .modal-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.04s ease-out;
      will-change: transform;
    }

    .modal-canvas svg {
      display: block;
      filter: drop-shadow(0 12px 36px rgba(0, 0, 0, 0.7));
    }

    .modal-hint {
      position: absolute;
      bottom: 16px;
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid rgba(226, 184, 87, 0.25);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--gold-light);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* Callout Alerts */
    .callout {
      border-left: 4px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 18px 0;
    }

    .callout.important {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }

    .callout.warning {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    .callout.tip {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.08);
    }

    /* YAML Formatter */
    .yaml-viewer {
      background: #111318;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    /* Mobile Responsive */
    @media (max-width: 1024px) {
      #toc-container {
        display: none;
      }
    }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: -320px;
      }
      #sidebar.open {
        transform: translateX(320px);
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Document Tree -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="project-brand">
        <div class="project-icon">慢酵</div>
        <div class="project-title-group">
          <div class="project-name">慢酵所 ManXiao Lab</div>
          <div class="project-badge">商業戰略全案門戶</div>
        </div>
      </div>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-box" placeholder="搜尋全案文件與關鍵字...">
      </div>
    </div>

    <nav class="sidebar-nav" id="nav-tree">
      <!-- Generated Dynamically -->
    </nav>

    <div class="sidebar-footer">
      <span>28 份核心文檔</span>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">深色模式</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Viewer -->
  <main id="main">
    <div class="top-bar">
      <div class="doc-breadcrumbs" id="breadcrumbs">
        <span>文檔</span> / <strong id="current-doc-title">載入中...</strong>
      </div>
      <div class="doc-actions">
        <button class="action-btn" onclick="copyMarkdown()">📋 複製原始 MD</button>
        <button class="action-btn" onclick="window.print()">🖨️ 列印 / 轉 PDF</button>
      </div>
    </div>

    <div class="content-layout">
      <div class="markdown-container">
        <article class="markdown-body" id="article-content">
          <!-- Rendered by marked.js -->
        </article>
      </div>
      <aside id="toc-container">
        <div class="toc-title">📌 本頁目錄 (TOC)</div>
        <ul class="toc-list" id="toc-list">
          <!-- Rendered dynamically -->
        </ul>
      </aside>
    </div>
  </main>

  <!-- Mermaid Fullscreen Interactive Lightbox Modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="onModalBackdropClick(event)">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <span>🔍 Mermaid 架構圖檢視器</span>
          <span class="modal-scale-indicator" id="modal-zoom-text">100%</span>
        </div>
        <div class="modal-controls">
          <button class="modal-btn" onclick="zoomModal(1.2)" title="放大 (亦可滾動滑鼠滾輪)">➕ 放大</button>

      "isYaml": false,
      "raw": "# 階段一：資產解構與去骨審計報告 (Asset Audit & RTB Extraction)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/01_assets.yaml`](../_thinking/00_core/01_assets.yaml)  \n> **核心任務**：將創辦人原始輸入與網路「莒光饅頭店」口碑視為原礦證詞，啟動【形容詞過濾斷頭台】，剔除無效自誇形容詞，提煉具備高溢價支撐力的真實物理資產（RTB）。\n\n---\n\n## 🔪 一、形容詞斷頭台審計（去骨過濾）\n\n依循《特勞特定位最高憲法》【公理 7：信任狀物理原則】，市面 99% 烘焙坊與饅頭店都在自稱「純天然、好吃、用心手作」。若直接拿這些形容詞當廣告主標，獲客轉化率趨近於零：\n\n| 原始輸入詞彙 | 審判結果 | 處決／轉譯理由 | 物理級重構方向 (RTB 化) |\n| :--- | :---: | :--- | :--- |\n| **「純天然」** | ❌ **處決禁用** | 消費者早已免疫，超商與路邊攤也自稱天然。 | 轉譯為 **「0 泡打粉、0 化學改良劑、0 人工香精，撕開只見原塊切丁真食材」** |\n| **「好吃」** | ❌ **處決禁用** | 主觀形容詞，沒吃過的人無法在首購前相信。 | 轉譯為 **「放涼吃依然 Q 彈帶自然麥香，竹北挑剔客群連吃 30 年回購」** |\n| **「老麵發酵」** | ⚠️ **半成品（需具象化）** | 全台宅配饅頭店人人喊老麵，顧客分不清真假老麵。 | 綁定物理檢驗動作：**「12~16 小時野生酵母與乳酸菌預分解 ➔ 壓扁 3 秒瞬間回彈」** |\n| **「不脹氣、不傷胃」** | 👑 **核心金礦（需法規轉譯）** | 直擊全台 500 萬敏感胃剛需！但不可踩醫療療效紅線。 | 鎖定生理機制：**「大分子澱粉與麩質預先分解為小分子，早上配黑咖啡也不悶脹」** |\n| **「壓扁會回彈」** | 👑 **核彈級視覺錘** | 短影音前 1.5 秒無需配音就能秒懂的物理鐵證！ | 升級為品牌驗真標準：**「死麵糰才會在胃裡結塊；3 秒回彈活氣孔，進胃才輕鬆」** |\n\n---\n\n## 💎 二、四大不可替代真實硬資產 (Core RTB Inventory)\n\n```mermaid\nflowchart TD\n    classDef rtb fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef hammer fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef benefit fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    R1[\"【RTB-01 科學預分解】<br/>12~16h 老麵野生酵母＋乳酸菌慢發酵<br/>預先剪切大分子澱粉與麩質\"]:::rtb\n    R2[\"【RTB-02 物理視覺錘】<br/>高密度立體筋膜活氣孔網<br/>手掌壓扁到底 ➔ 3 秒 100% 彈回原狀\"]:::hammer\n    R3[\"【RTB-03 精準剪裁雙規格矩陣】<br/>回彈大老麵（純白／黑金剛／地瓜／全麥堅果／切丁起司）＋<br/>一口回彈迷你包（迷你黑金剛12入／綜合小慢包）\"]:::rtb\n    R4[\"【RTB-04 時間與地緣背書】<br/>源自新竹竹北 30 年老字號『莒光饅頭』原型工藝<br/>竹科高壓敏感胃家庭長期實證口碑\"]:::rtb\n\n    R1 & R2 & R3 & R4 --> B[\"終極顧客交付價值：<br/>『早上終於能大口吃香濃麵食配咖啡，一整個上午胃部平坦零悶脹！』\"]:::benefit\n```\n\n### 1. 【RTB-01】12~16 小時老麵乳酸菌「體外預消化」工藝\n* **食品科學真相**：市售麵包與速發饅頭使用商業快速酵母與泡打粉，30~60 分鐘極速催熟，大量未分解的大分子支鏈澱粉與麩質進入胃中繼續發酵產氣，推擠賁門引發溢酸與脹氣。\n* **我們的硬實力**：透過老麵中豐富的天然野生酵母與活性乳酸菌群進行 12 小時以上慢發酵，**等於在蒸籠裡先幫人類的胃完成了 50% 的大分子分解工作**。\n\n### 2. 【RTB-02】「壓扁 3 秒回彈」物理驗真標準（超級視覺錘）\n* **為什麼會回彈？** 化學泡打粉撐起的是脆弱虛胖的大氣泡，一捏就塌成黏牙死麵糰；唯有老麵長時間發酵搭配多次壓延揉製，才能織出如記憶枕般千萬個微米級立體筋膜氣孔。\n* **商戰殺傷力**：不需要顧客懂烘焙化學，只要拍一顆饅頭被手掌壓成 1.5 公分薄餅、鬆手 3 秒彈回圓潤飽滿，所有「假老麵」當場現形！\n\n### 3. 【RTB-03】「雙規格 ✕ 原粒真食材」潔淨精選矩陣（對齊原店實價與選品裁決）\n根據新竹竹北「莒光饅頭店」原始門市實價調研，剔除與品牌調性衝突之品項，精選並重構出「大老麵（主食）＋ 迷你一口包（點心）」雙規格產品矩陣：\n\n* **🚫 剔除品項裁決**：【桂竹筍捲】（原門市 6 入 210 元）——帶重油蔥與豬油鹹餡，容易誘發胃酸，且冷鏈易酸敗，與「12h 預分解、溫和清爽、黑咖啡輕主食」的精品品牌形象完全衝突，果斷剔除。\n* **🥖 經典大老麵系列（一般規格・6 入家庭包）**：\n  1. **【純白原麥回彈老麵】（無糖／微甜）**：門市單顆 15 元，6 入家庭包 NT$ 120。0 糖 0 油 0 餡料，針對胃部極度敏感期、幼兒副食品銜接，或夾顆荷包蛋即成完美早餐。\n  2. **【黑金剛・古法黑糖老麵】**：門市 6 入家庭包 NT$ 180（單顆 30 元）。傳承 30 年人氣招牌，古法柴燒黑糖醇厚蔗香，自然回甘暖胃。\n  3. **【黃金番薯地瓜捲／地瓜丁】**：門市 6 入家庭包 NT$ 150（單顆 25 元）。嚴選台農 57 號黃金地瓜，保留食材原型膳食纖維與自然甘甜。\n  4. **【全麥多穀養生堅果老麵】**：門市全麥 29 元升級款，6 入家庭包 NT$ 210（單顆 35 元）。揉入整顆核桃、南瓜子、葵花籽，純天然好油脂，黑咖啡絕配。\n  5. **【雙色切丁起司老麵】（部落客食記 No.1）**：門市 6 入家庭包 NT$ 240（單顆 40 元）。雙色起司實心切丁，蒸熱鹹香微牽絲不膩口，高鈣、小孩秒殺。\n* **👶 全新行銷爆款：一口回彈小慢包系列（迷你規格・零浪費神器）**：\n  1. **【迷你黑金剛一口包】（12 粒入）**：售價 NT$ 160（每粒約 13.3 元）。小孩手掌剛好不浪費，上班族下午 3 點低罪惡防低血糖。\n  2. **【綜合回彈小慢包分享袋】（約 2 台斤裝）**：售價 NT$ 120。多口味一口享受，露營、野餐、氣炸或沾無糖優格絕配。\n\n### 4. 【RTB-04】新竹竹北 30 年「莒光饅頭店」真實口碑資產解構\n* **外部調研實證**：位於竹北市中山路 420 號的「莒光饅頭店」（源於光復饅頭體系深耕在地逾 30 年），在 Pixnet 等美食部落格與在地社群累積了極為罕見的一致好評——顧客不約而同提到**「以前吃饅頭會胃酸脹氣，吃這家完全不會」**。\n* **品牌資產處置裁定（關鍵戰略決策）**：\n  * **為何不直接用「莒光饅頭店」打全國藍海？** 「莒光」二字在全台有多家同名傳統饅頭店（新北中和、馬祖、新竹等），商標專用權排他性弱；且字面帶有濃厚「15 元眷村銅板小吃」價格錨點，不利於線上冷凍組合箱定價（單顆 NT$ 38~52）。\n  * **最佳資產繼承法**：採用**【全新藍海主品牌（如：回彈號 / 慢酵所） ＋ 源自竹北 30 年莒光老麵原型工藝實證】**之雙層背書架構（詳見 [`../modules/cross_industry/03_category_naming_and_test.md`](../modules/cross_industry/03_category_naming_and_test.md)）。\n\n---\n\n## ⚠️ 三、營運與法規現實約束鎖定 (Strategic Constraints)\n\n1. **低溫物流剛性成本約束**：黑貓冷凍宅配單件運費高達 NT$ 160~225（超商冷凍店到店約 NT$ 99~120）。線上絕對禁止散顆零售，必須全面採取**「破冰免運體驗箱（NT$ 499）」＋「家庭雙週/月配常備箱（NT$ 980~1,380）」**組合銷售。\n2. **老麵長時發酵產能約束**：12 小時以上恆溫發酵無法像化學饅頭 30 分鐘臨時加單暴衝，適合走「批次新鮮出籠急凍・週期預訂制」，反而能營造稀缺品質感。\n3. **《食安法》第 28 條絕對紅線**：一般食品嚴禁宣稱「治療胃食道逆流、顧胃療效」。全案文案強制鎖定「老麵慢發酵小分子、好消化、吃完不悶脹、壓扁 3 秒回彈」之物理與日常體感表述。\n"
    },

      "title": "階段二（上）：顧客心智階梯探測與競爭裂縫解剖 (Mental Ladder Audit)",
      "name": "02_mental_ladder.md",
      "isYaml": false,
      "raw": "# 階段二（上）：顧客心智階梯探測與競爭裂縫解剖 (Mental Ladder Audit)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/02_ladder_landmines.yaml`](../_thinking/00_core/02_ladder_landmines.yaml)  \n> **核心任務**：不從「賣饅頭的同行」看世界，而是鑽進「早上 7:30 想吃澱粉早餐卻怕胃脹氣的消費者大腦」，掃描現存三大心智階梯與巨頭無法修補的結構性裂縫。\n\n---\n\n## 🪜 一、台灣早餐麵食三大現存心智階梯圖譜\n\n依循【公理 1：心智容量極限定律】與【公理 14：心智二元競爭法則】，目前台灣消費者腦中與「早餐饅頭／健康麵包」相關的心智階梯已被以下三股勢力佔據：\n\n```mermaid\nflowchart TD\n    classDef red fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef yellow fill:#fff8e1,stroke:#f57f17,stroke-width:2px,color:#111827;\n    classDef blue fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px,color:#111827;\n\n    subgraph L1 [\"階梯一：超商與量販工業冷凍饅頭（紅海巨頭）\"]\n        I1[\"代表玩家：奇美、義美、桂冠（單顆 NT$ 12~22）\"]:::red\n        I2[\"佔據心智詞：便宜、超商隨買隨蒸、家庭冷凍庫湊數備品\"]:::red\n        I3[\"致命差評裂縫：商用速發酵母＋改良劑，一壓就塌黏牙，敏感胃吃完脹氣溢酸！\"]:::red\n        I1 --> I2 --> I3\n    end\n\n    subgraph L2 [\"階梯二：網購傳統手工老麵／爆料饅頭（同質化泥潭）\"]\n        T1[\"代表玩家：老麵酵匠（同在竹北！）、孔子饅頭、台灣饅頭專賣店、福穀樂\"]:::yellow\n        T2[\"佔據心智詞：手工老麵、爆漿流沙／芋泥火山、傳統養生山東大饅頭（NT$ 25~48）\"]:::yellow\n        T3[\"致命差評裂縫：1. 爆料派高糖高油奶酥流沙，吃完照樣火燒心！<br/>2. 傳統山東派形象老氣乾硬，年輕白領與小孩拒吃！\"]:::yellow\n        T1 --> T2 --> T3\n    end\n\n    subgraph L3 [\"階梯三：西式健康烘焙／精品酸種歐包（高價替代品）\"]\n        W1[\"代表玩家：馬可先生、一禾堂、嵜本生吐司、精品酸種歐包 Sourdough（NT$ 80~220）\"]:::yellow\n        W2[\"佔據心智詞：都會白領質感早餐、雜糧健康、歐美天然酸種發酵\"]:::yellow\n        W3[\"致命差評裂縫：生吐司高奶油極易逆流；酸種歐包外皮乾硬刮上顎、單顆破百元、冷冰冰不合台灣胃！\"]:::yellow\n        W1 --> W2 --> W3\n    end\n\n    L1 & L2 & L3 --> GAP[\"🎯 未被佔領的黃金心智空位：<br/>【壓扁 3 秒回彈・不脹氣老麵輕主食（東方蒸製酸種）】<br/>兼具中式溫熱彈軟 ✕ 酸種預分解零脹氣 ✕ 原粒起司芋頭堅果美味！\"]:::blue\n```\n\n---\n\n## 🔍 二、三大競爭陣營「差評裂縫」深度解剖\n\n### 1. 量販工業巨頭（奇美／義美）的結構性死穴：快，就必然產氣\n* **巨頭為什麼改不了？** 量販工廠追求極致坪效與每小時數萬顆標準化產出，麵糰發酵時間必須壓縮在 40~60 分鐘內完成。一旦改用 12~16 小時天然老麵慢發酵，工廠發酵室面積需擴大 10 倍、毛利直接崩盤。\n* **真實消費者痛點原聲**：「早上趕時間在超商買顆熱饅頭配拿鐵，10 點進會議室胃開始鼓脹、喉嚨泛酸水，一上午坐立難安。」\n\n### 2. 網購老麵同行（特別是竹北在地強敵「老麵酵匠」）的結構性死穴：為了視覺爆漿，背叛了養胃初衷\n* **關鍵敵情偵察**：同樣發跡於新竹竹北的「老麵酵匠（光頭揉饅頭）」已是全台知名老麵網購品牌，擁有近 20 種口味與極強團購聲量。如果我們只喊「竹北手工老麵饅頭」，在網路上會瞬間撞進對方的防守陣地！\n* **對手的結構性裂縫在哪？**\n  1. **「爆料捲」形態無法做到「整顆壓扁 3 秒 100% 回彈」**：網紅宅配品牌為了社群拍照吸睛，大量主打「爆漿金沙奶黃、流沙芝麻、芋泥火山捲」。大量高糖高油醬料破壞了老麵單純的立體筋膜回彈結構，且**高糖＋高油脂正是誘發賁門鬆弛、胃酸逆流的頭號元兇**！\n  2. **心智標籤發散**：同時賣甜膩流沙包、辣味肉包與雜糧捲，在「極致敏感胃／怕脹氣白領」腦中並未獨佔「零脹氣專屬輕主食」的純粹心智。\n\n### 3. 西式健康烘焙與生吐司／酸種歐包（馬可先生／Sourdough）的結構性死穴：貴、硬、或暗藏高油陷阱\n* **都會白領與竹科家庭的真實困境**：許多胃敏感的工程師與媽媽不敢買傳統早餐店鐵板麵，轉而去買一條 NT$ 150~250 的生吐司、貝果或歐式酸種麵包（Sourdough）。\n* **結果卻踩中兩大痛點**：\n  * **生吐司／丹麥麵包**：為了柔軟口感添加大量鮮奶油、奶油與精製糖，吃兩片立刻「火燒心（胸口灼熱）」。\n  * **正統歐式酸種麵包（Sourdough）**：雖然同樣靠野生酵母與乳酸菌慢發酵分解麩質（不脹氣），但歐包經過 230°C 高溫烘烤，外殼堅硬刮嘴、內裡偏酸偏韌，長輩咬不動、小孩不愛吃，且一顆動輒 NT$ 120~180。\n\n---\n\n## 🎯 三、心智階梯結論：我們該搶佔哪一個「專屬字眼」？\n\n依循【公理 11：心智字眼獨佔律】，我們絕不能去搶已經擁擠不堪的「手工老麵」或「爆漿饅頭」，而必須將**物理工藝證據**與**生理剛需爽點**焊死在一起：\n\n* **前台物理字眼釘子**：**【3 秒回彈】**（一眼看穿真假老麵的黃金標準）\n* **底層生理利益釘子**：**【不脹氣】**（解決全台 500 萬敏感胃每天早上的切身之痛）\n* **跨界藍海品類身份**：**【東方蒸製酸種輕主食 ／ 敏感胃早安慢碳饅頭】**（用 100% 水蒸溫潤老麵，降維取代傷胃吐司與刮嘴歐包！）\n"
    },
    "00_core_positioning/02_white_space_verdict.md": {
      "path": "00_core_positioning/02_white_space_verdict.md",
      "title": "階段二（中）：空白市場與藍海真空審定報告 (White Space & Blue Ocean Verdict)",
      "name": "02_white_space_verdict.md",
      "isYaml": false,
      "raw": "# 階段二（中）：空白市場與藍海真空審定報告 (White Space & Blue Ocean Verdict)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/02_ladder_landmines.yaml`](../_thinking/00_core/02_ladder_landmines.yaml)  \n> **法源依據**：《特勞特定位最高憲法》【公理 17：心智空位絕對審定律】與【反駁規則 13：鹽鹼地偽空白排查】。\n\n---\n\n## ⚖️ 一、物理真空 vs 心智真空 雙重審判裁定書\n\n許多創業者誤以為「做奇怪口味的饅頭（例如松露龍蝦饅頭）」才叫藍海——那是沒人想回購的**鹽鹼地偽空白**！真正的商業藍海，是用**既有成熟可靠的極致工藝**，切入一個**痛感極強、人口極大、卻被所有現有品牌忽略的心智真空帶**。\n\n| 審定維度 | 審判結果 | 客觀證據與商業邏輯論證 |\n| :--- | :---: | :--- |\n| **1. 物理產品真空度** | **半真空（結構重組）** | 市面上有純白山東饅頭，也有爆漿網紅饅頭；但**「0 泡打粉 ＋ 12h 預分解回彈老麵 ＋ 100% 原塊切丁低負擔真食材（無甜膩泥醬）」**的現代機能常備箱極度稀缺。 |\n| **2. 心智認知真空度** | **🟢 100% 藍海真空** | 台灣目前**沒有任何一個品牌**在消費者腦中成功綁定：**「怕吃麵包脹氣溢酸？改吃壓扁 3 秒回彈的『東方酸種蒸輕食』！」** 這塊心智高地完全無人插旗。 |\n| **3. 鹽鹼地偽需求排查** | **🟢 通過（超高頻剛需金礦）** | 衛福部與臨床消化醫學推估台灣胃食道逆流與慢性脹氣潛在盛行率達 **25%~30%（約 500 萬成年人）**，且每天都得吃早餐（一年 365 次高頻決策），絕非偽需求！ |\n\n---\n\n## 🌊 二、藍海市場定位座標：從「20 元菜市場紅海」躍遷至「百億敏感胃早安藍海」\n\n為什麼同樣一顆老麵起司／堅果／純白饅頭，換一個品類座標系，毛利與市場空間立刻放大 3 倍？請看藍海價值重構矩陣：\n\n```mermaid\nflowchart LR\n    classDef redOcean fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef bridge fill:#fff3e0,stroke:#ef6c00,stroke-width:2px,color:#111827;\n    classDef blueOcean fill:#e0f7fa,stroke:#00838f,stroke-width:3px,color:#111827;\n\n    subgraph RED [\"❌ 傳統紅海座標：中式菜市場饅頭\"]\n        R_COMP[\"比價對象：巷口 15 元饅頭、奇美冷凍包、老麵酵匠\"]:::redOcean\n        R_PRICE[\"價格天花板：NT$ 15 ~ 30 / 顆（做宅配被運費吃光利潤）\"]:::redOcean\n        R_USER[\"受眾心態：月底省錢填肚子、配稀飯豆腐乳\"]:::redOcean\n    end\n\n    subgraph SHIFT [\"⚡ 特勞特藍海品類重構（ERRC 四步動作）\"]\n        S1[\"【剔除】泡打粉、化學香精、高糖爆漿流沙餡、單顆裸裝散賣\"]:::bridge\n        S2[\"【減少】發酵未完全的大分子澱粉負擔、傳統電鍋加水麻煩\"]:::bridge\n        S3[\"【提升】12~16h 乳酸菌預分解度、3秒壓扁回彈筋膜力、原塊切丁起司芋頭堅果比例\"]:::bridge\n        S4[\"【創造】『東方蒸製酸種輕主食』新身份 ＋ 早安黑咖啡慢碳常備箱\"]:::bridge\n    end\n\n    subgraph BLUE [\"🌊 全新藍海座標：敏感胃早安慢碳輕主食\"]\n        B_COMP[\"打劫對象：馬可先生雜糧麵包（$90）、生吐司（$150）、酸種歐包（$160）、無味水煮餐\"]:::blueOcean\n        B_PRICE[\"價格帶躍升：組合箱折合 NT$ 38 ~ 52 / 顆（顧客仍覺得比歐包便宜一半！）\"]:::blueOcean\n        B_USER[\"受眾心態：竹科工程師、都會白領、潔淨派媽媽——『配黑咖啡也不脹氣的救星！』\"]:::blueOcean\n    end\n\n    RED --> SHIFT --> BLUE\n```\n\n---\n\n## 🎯 三、三大高含金量藍海目標客群（由尖刀灘頭堡向外擴散）\n\n### 🥇 第一灘頭堡（痛感最強、付費最爽快）：【早起喝黑咖啡卻怕脹氣溢酸的「都會敏感胃白領／竹科工程師」】\n* **人口特徵**：28~52 歲，高工時、高壓力，早上一定要喝一杯美式或拿鐵醒腦，但只要配吐司、鐵板麵、可頌或超商包子，10 點就開始胃脹打嗝、胸口灼熱。\n* **為什麼他們是完美藍海客？**\n  1. 他們過去被迫吃冰冷超商地瓜或水煮蛋，內心極度渴望**「溫熱、有麥香嚼勁、有鹹香起司丁或堅果油脂香」**的真麵食！\n  2. 我們的配方發源地就在**新竹竹北**——這群全台灣最講究科學邏輯與數據的工程師聽見「12 小時乳酸菌預分解大分子澱粉＋壓扁 3 秒物理回彈」，一秒就能理解科學原理並成為死忠訂戶！\n\n### 🥈 第二擴散圈（客單價最高、復購最穩）：【一箱搞定全家三代胃口的「成分潔淨派媽媽（Clean-Label Moms）」】\n* **採購場景**：32~48 歲雙薪家庭主婦／職場媽媽，每天早上像打仗：\n  * **公婆爸媽（60+ 歲）**：消化退化怕甜怕胃酸 ➔ 吃**【純白原麥】**、**【真芋頭丁／地瓜丁】**，溫潤微甜零負擔。\n  * **國小國中孩子**：挑嘴不吃養生乾糧，但媽媽不敢天天買早餐店乳瑪琳吐司 ➔ 吃**【雙色切丁起司】**，真起司鈣質鹹香，小孩搶著吃。\n  * **夫妻自己**：控糖注重優質油脂 ➔ 吃**【多穀養生堅果】**配咖啡帶去公司或在家享用。\n* **商業威力**：直接撐起 **NT$ 980 ~ 1,380（24~36 入）家庭雙週常備箱**，冷凍庫一空就自動回購！\n\n### 🥉 第三潛力圈（跨界高溢價禮盒／團購）：【孕期害喜脹氣準媽媽 ＆ 健身慢碳增肌族】\n* **孕產婦剛需**：懷孕中後期黃體素升高導致腸胃蠕動變慢、極度容易脹氣與孕吐，對人工香精極為敏感。**「0 添加純白老麵饅頭與切丁起司老麵」**在媽媽社團具備極強口碑裂變力。\n\n---\n\n## 📌 四、鄰近替代品阻擊防禦圖譜\n\n| 顧客原本將就的替代方案 | 顧客忍受的隱藏痛苦 | 我們的藍海降維打擊話術 |\n| :--- | :--- | :--- |\n| **超商烤地瓜 ／ 水煮蛋 ／ 燕麥飲** | 像在吃減肥病號餐，冷冰冰或糊爛無嚼勁，吃完心裡空虛想偷吃零食（且地瓜空腹吃過量同樣易溢酸）。 | *「別再把早餐吃得像懲罰自己！12 小時預分解回彈老麵，咬得到濃郁起司丁與堅果香，好吃又不脹氣。」* |\n| **歐式酸種麵包 (Sourdough)** | 外皮硬如石頭刮傷口腔、酸味重、單顆 NT$ 150 起跳、還要噴水進烤箱回烤 10 分鐘。 | *「同樣是天然野生酵母＋乳酸菌慢發酵，我們用 100% 東方純水蒸取代高溫焦化烘烤——外彈內潤不刮嘴，單顆不到歐包三分之一價！」* |\n| **市售網紅爆漿流沙老麵捲** | 麵皮雖用老麵，但內餡塞滿高糖煉乳、人造奶油與化學芋泥，一吃照樣胃酸逆流。 | *「真養胃的老麵，絕不塞高油流沙餡害你火燒心！我們只放切丁真起司、原塊芋頭地瓜與整顆堅果。」* |\n"
    },

      "raw": "# 階段二（下）：戰略避坑與致命地雷排除報告 (Strategic Landmines & Pruning Tree)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/02_ladder_landmines.yaml`](../_thinking/00_core/02_ladder_landmines.yaml)  \n> **核心任務**：在投入任何一毛錢設計包裝與拍攝廣告前，先排清台灣烘焙電商前人踩死過的 **5 顆致命地雷**，繪製不可行死路排除樹。\n\n---\n\n## 🌳 一、不可行死路排除樹 (Strategic Pruning Tree)\n\n```mermaid\nflowchart TD\n    classDef root fill:#1e293b,stroke:#0f172a,stroke-width:2px,color:#ffffff;\n    classDef dead fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef live fill:#e8f5e9,stroke:#2e7d32,stroke-width:3px,color:#111827;\n\n    START[\"老麵饅頭新品牌商業化路徑選擇\"]:::root\n\n    START --> D1[\"❌ 死路 1：打『治胃食道逆流／健胃神物』醫療口號<br/>➔ 踩中《食安法》第28條，同行檢舉秒罰 4~400 萬！\"]:::dead\n    START --> D2[\"❌ 死路 2：打『竹北手工爆漿老麵』跟風流沙奶黃餡<br/>➔ 正面撞死在同城霸主『老麵酵匠』槍口下，且高糖餡毀掉不脹氣口碑！\"]:::dead\n    START --> D3[\"❌ 死路 3：線上開放單顆 NT$ 20~30 自由散買<br/>➔ 黑貓/超商冷凍運費包材吃掉 NT$ 130~210，每出一單倒賠一單！\"]:::dead\n    START --> D4[\"❌ 死路 4：直接拿『莒光饅頭店』當唯一主商標打高端電商<br/>➔ 全台同名老店分流商標權，且消費者錨定 15 元眷村銅板價拒買高毛利箱購！\"]:::dead\n    START --> WIN[\"✅ 唯一黃金生路：<br/>【全新藍海品牌（回彈號／慢酵所）＋竹北30年原型口碑背書】<br/>鎖定『壓扁3秒回彈・12h預分解不悶脹』✕『原塊切丁真食材常備箱』\"]:::live\n```\n\n---\n\n## 💣 二、五大致命地雷深度拆解與防爆對策\n\n### 🚨 地雷 1（一級法規死穴）：《食品安全衛生管理法》第 28 條「醫療效能」文字獄\n* **致命陷阱**：因為顧客真實評論都在誇「吃這家不會胃食道逆流、不會胃痛」，創辦人很容易興奮地把品牌取名為「治胃饅頭／顧胃王」，或在官網大字寫「專治胃食道逆流、改善胃潰瘍、健胃整腸」。\n* **慘烈後果**：在台灣做食品電商，一旦爆紅，競爭對手第一件事就是截圖向衛生局檢舉！依《食安法》第 28 條第 2 項，一般食品標示、宣傳或廣告涉及**「醫療效能」**（預防、改善、減輕、診斷或治療疾病，如「胃食道逆流、胃炎、胃潰瘍」）罰 NT$ 60 萬～500 萬；涉及誇張易生誤解（如「健胃整腸」）罰 NT$ 4 萬～400 萬！\n* **🛡️ 絕對安全且殺傷力更強的「合法轉譯字典」**：\n  * ❌ **絕對禁用詞**：治療／改善胃食道逆流、顧胃療效、治胃酸、健胃整腸、修復胃黏膜。\n  * ✅ **合法高轉化詞（講食品物理工藝＋日常飲食感受）**：\n    * *「12~16 小時天然老麵慢發酵，預先分解大分子澱粉，好消化、少負擔。」*\n    * *「專為挑剔敏感族打造，早上配黑咖啡吃完依然清爽不悶脹！」*\n    * *「壓扁 3 秒回彈的活氣孔老麵，告別速發麵食的沉重堵悶感。」*\n    * *（註：引用部落客自然食記心得時，亦不可由品牌官方帳號節錄醫療疾病字眼投遞付費廣告。）*\n\n---\n\n### 🚨 地雷 2（競爭定位死穴）：在竹北家門口與「老麵酵匠」打同質化爆料戰\n* **致命陷阱**：看到網路團購流行「芋泥流沙、黑糖珍奶爆漿、熔岩起司醬」，就跟著研發重甜重油的流沙內餡。\n* **慘烈後果**：\n  1. 同樣位於竹北的「老麵酵匠」早已憑藉近 20 種爆料捲佔據該心智，後進者獲客成本（CAC）將高出 2 倍以上。\n  2. 營養醫學鐵律：**精製糖漿＋人造奶油流沙會直接讓下食道括約肌（賁門）鬆弛**，敏感胃客人吃完立刻溢酸，一顆流沙包就能徹底摧毀我們「不脹氣、不傷胃」的核心招牌！\n* **🛡️ 防爆鐵律**：堅守**【100% 原塊切丁法則】**——起司用切丁真乾酪、芋頭地瓜用原塊切丁、堅果用整粒原果、白饅頭極致純粹。把「不爆漿、不流沙」反轉為最高級的信任狀：**「我們絕不塞一滴讓你火燒心的化學流沙醬！」**\n\n---\n\n### 🚨 地雷 3（財務破產死穴）：用路邊攤銅板定價思維做冷凍宅配\n* **致命陷阱**：「實體店一顆才賣 20~30 元，網路上一顆賣 45 元客人會不會嫌貴？不如單顆賣 25 元、滿 500 免運吧！」\n* **慘烈後果**：冷凍紙箱＋保冷袋＋7-11 冷凍店到店／黑貓低溫運費，每單剛性履約成本高達 NT$ 130~210。若滿 500 免運且單顆毛利僅 12 元，扣掉 Meta/Google 廣告獲客成本（約 NT$ 250~350/單），**每成交一單淨虧 NT$ 150 以上，賣越多倒越快！**\n* **🛡️ 防爆鐵律**：\n  1. **切換價格錨點**：不跟菜市場 15 元饅頭比價，而是跟「馬可先生雜糧麵包（NT$ 85~110）、精品貝果（NT$ 75）、酸種歐包（NT$ 150）」比價！一顆 12 小時慢發酵真起司丁／堅果回彈輕主食定價 **NT$ 42~52（純白款 NT$ 32~38）**，組合箱平均單顆 **NT$ 38~45**，在白領眼中簡直超值！\n  2. **只賣組合箱，不賣散顆**：最低入手門檻鎖定 **NT$ 499（10 入免運破冰箱，限首購測謊）**，主力推 **NT$ 980（24 入雙週家庭箱）** 與 **NT$ 1,380（36 入黑貓免運月配箱）**。\n\n---\n\n### 🚨 地雷 4（商標與品牌延伸死穴）：直接把「莒光饅頭店」當全國藍海主商標\n* **致命陷阱**：覺得網路上已經搜得到「莒光饅頭店」好評，就直接印紙箱叫「莒光饅頭店」投全台廣告。\n* **慘烈後果**：\n  1. **搜尋分流與商標撞車**：全台叫「莒光饅頭／莒光包子」的店不只一家（新北中和莒光路、外島莒光、竹北等），客人看完你的短影音去 Google 搜「莒光饅頭」，一半流量會買錯家，且智慧財產局第 30 類商標極難取得排他保護。\n  2. **眷村低價心智枷鎖**：「莒光」二字天然帶有 1970 年代眷村伯伯 15 元大饅頭的樸素印象，難以支撐「東方蒸製酸種輕主食」的現代精品溢價與年輕白領辦公桌場景。\n* **🛡️ 防爆鐵律**：創立高辨識度、可 100% 註冊排他商標的新主品牌（首推**【回彈號】**或**【慢酵所】**），並在副標與品牌故事中榮耀標註：**「承襲新竹竹北 30 年老字號『莒光老麵』原型工藝・在地萬人零脹氣口碑實證」**——既拿走 100% 歷史信任狀，又擁有 100% 全新溢價自由！\n\n---\n\n### 🚨 地雷 5（最後一哩體驗死穴）：錯誤覆熱「脫水變硬」影響回彈口感\n* **致命陷阱**：上班族或顧客若直接把裸裝冷凍饅頭丟進微波爐大火長時間加熱，水分易被抽乾，影響老麵回彈口感。\n* **🛡️ 防爆鐵律**：隨箱附贈**「正統黃金覆熱指南」**——最推薦電鍋外鍋半杯水蒸 8~10 分鐘，免顧火刷牙洗臉出來熱騰騰如現蒸；若需微波，建議表面噴微量水或加蓋保鮮微波 40~50 秒，把「老麵真實 Q 彈」完美還原。\n"
    },

      "isYaml": false,
      "raw": "# 階段三：特勞特四維正交定位假說與跨界藍海方案 (Positioning Hypotheses)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/03_hypotheses.yaml`](../_thinking/00_core/03_hypotheses.yaml)  \n> **核心任務**：運用特勞特古典四大刀法（品類分化、巨人對立、極致取捨、問題重構）生成**【軌道 A：存量精準切角】**四大假說，並結合跨界模組注入**【軌道 B：跨界藍海升維】**兩大假說，共 6 組候選方案進入紅隊生死審判。\n\n---\n\n## 🧭 一、雙軌六大定位假說全景拓撲圖\n\n```mermaid\nflowchart TD\n    classDef trackA fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef trackB fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n    classDef redteam fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n\n    subgraph TA [\"【軌道 A】本業存量分化軌（直球搶佔饅頭／中式早餐預算）\"]\n        A1[\"假說 A1（品類分化＋巨人對立）<br/>【不脹氣・3秒回彈老麵饅頭】<br/>專打 30 分鐘化學速發假蓬鬆\"]:::trackA\n        A2[\"假說 A2（極致取捨）<br/>【三代潔淨原粒冷凍早餐箱】<br/>專攻挑剔成分媽媽，一箱餵飽老中青\"]:::trackA\n        A3[\"假說 A3（問題重構）<br/>【3 秒指壓驗真老麵饅頭】<br/>別聽老闆自吹，壓扁彈回來才是真老麵\"]:::trackA\n        A4[\"假說 A4（地緣老店放大）<br/>【竹北 30 年排隊私藏手工饅頭】<br/>地方名店冷凍宅配化\"]:::trackA\n    end\n\n    subgraph TB [\"【軌道 B】跨界突變藍海軌（打劫西式精品烘焙與機能輕食預算）\"]\n        B1[\"假說 B1（跨界品類升維・藍海主力）<br/>【東方蒸製酸種輕主食 (Steamed Sourdough)】<br/>取代傷胃吐司與刮嘴歐包的 12h 預分解慢碳箱\"]:::trackB\n        B2[\"假說 B2（跨界醫療／產後通路）<br/>【產後月子與健檢術後溫和復食饅頭組】<br/>取代無味白粥的溫和主食\"]:::trackB\n    end\n\n    A1 & A2 & A3 & A4 & B1 & B2 --> RT[\"送入階段四：雙軌殘酷紅隊博弈審判\"]:::redteam\n```\n\n---\n\n## ⚔️ 二、【軌道 A：經典存量分化軌】四大正交假說詳解\n\n### 假說 A1（品類分化 ＋ 巨人對立）：【不脹氣・回彈老麵饅頭】\n* **開創新分化品類**：不脹氣回彈老麵饅頭（專為敏感胃打造的慢發酵饅頭）\n* **精準目標受眾**：全台吃一般麵包、吐司、超商包子容易胃悶脹、打嗝溢酸的 30~55 歲上班族、工程師與熟齡族。\n* **踩死的戰略公敵**：「30 分鐘化學速發酵母 ＋ 泡打粉催熟、一捏就塌成死麵糰、進胃繼續產氣」的市售麵包與工業冷凍饅頭。\n* **語言釘子（≤ 15 字主標）**：**「壓扁 3 秒彈回來，進胃才不脹氣！」**\n* **副標展開**：*「12 小時天然老麵預分解大分子澱粉，0 泡打粉真食材，連吃一週早上清爽無負擔。」*\n* **極致取捨**：堅決不做任何高糖高油爆漿流沙餡，堅決不打 15 元銅板低價戰。\n\n---\n\n### 假說 A2（極致取捨）：【三代潔淨原粒冷凍早餐箱】\n* **開創新分化品類**：兒童與長輩零添加原粒早餐饅頭箱\n* **精準目標受眾**：32~45 歲家有學齡孩童與同住／鄰居長輩、對食品添加物零容忍的雙薪媽媽。\n* **踩死的戰略公敵**：充滿反式脂肪乳瑪琳、化學奶精紅茶、加工組合肉與色素香精果醬的連鎖早餐店。\n* **語言釘子**：**「看得見起司塊與真芋頭丁，3 分鐘搞定全家安心早餐。」**\n* **極致取捨**：放棄單身獵奇重口味客群，全品項無辣、無加工肉品、無人工色素。\n\n---\n\n### 假說 A3（問題重構）：【3 秒指壓驗真老麵饅頭】\n* **顛覆衡量標準**：過去消費者買老麵饅頭只能「聽老闆良心自稱」；我們直接教消費者用「兩根手指壓到底，看能不能 3 秒彈回原狀」作為檢驗真假老麵的唯一物理鐵律！\n* **精準目標受眾**：熱愛老麵 Q 彈嚼勁、卻常在網購或市場買到「混商業酵母假老麵」的麵食老饕。\n* **踩死的戰略公敵**：掛羊頭賣狗肉、摻入速發酵母與品質改良劑充數的「偽老麵店」。\n* **語言釘子**：**「別聽老闆說老麵！敢壓扁 3 秒回彈才是真老麵。」**\n* **極致取捨**：放棄喜歡鬆軟如棉花糖般無筋性麵包的客群。\n\n---\n\n### 假說 A4（地緣傳奇放大）：【竹北 30 年私藏手工老麵饅頭】\n* **核心切角**：直接放大竹北中山路「莒光饅頭店」30 年在地老字號與部落客排隊口碑，走「地方排隊名店直送你家冷凍庫」路線。\n* **語言釘子**：**「竹北人連吃 30 年的老麵香，免排隊冷凍直送。」**\n* **潛在隱憂**：全台各縣市都有「30 年山東老店」，且竹北已有「老麵酵匠」佔據線上聲量，需接受紅隊嚴格拷問。\n\n---\n\n## 🚀 三、【軌道 B：跨界突變藍海軌】兩大新物種假說詳解\n\n> 詳細跨界偵察、能力橋接打分與品牌命名推演，請同步參閱擴展模組 [`../modules/cross_industry/`](../modules/cross_industry/) 全套三份報告。\n\n### 假說 B1（跨界品類升維・藍海頭號種子）：【東方蒸製酸種輕主食 (Eastern Steamed Sourdough)】\n* **跨界心智移植來源**：歐美與高階白領圈瘋搶的 **Sourdough（天然酸種麵包，單顆 NT$ 120~220）** ＋ **早安健康慢碳輕主食箱**。\n* **底層跨界洞察（為什麼這是絕妙藍海？）**：\n  1. 現代高收入白領與竹科家庭花大錢買「酸種麵包 Sourdough」，圖的就是**「野生酵母＋乳酸菌長時慢發酵分解麩質，低負擔、不脹氣」**。\n  2. 我們的 12~16 小時天然老麵饅頭，在微生物發酵學上**100% 就是東方版的 Sourdough**！甚至更勝一籌——因為我們採用**「100% 純水蒸熟（零高溫烤焦梅納反應燥熱、零奶油酥油、外彈內潤不刮上顎）」**！\n  3. 當我們把它從「配稀飯的中式饅頭」跨界重命名為**「配黑咖啡吃的【東方酸種回彈輕主食】」**，它的競爭對手瞬間從「15 元菜市場饅頭」變成「150 元生吐司與酸種歐包」！\n* **精準目標受眾**：每天喝黑咖啡／拿鐵上班、原本買馬可先生／生吐司／貝果卻常覺得脹氣溢酸，或覺得歐包太硬太貴的 28~50 歲都會白領與科技家庭。\n* **語言釘子**：**「吐司傷胃、歐包刮嘴？換成配黑咖啡也不脹氣的【東方酸種回彈饅頭】！」**\n* **本業能力逆向整合度（Fit Index）**：**4.8 / 5.0 分**（零新設備研發風險，既有純白、雙色起司丁、地瓜、堅果等口味 100% 完美契合西式咖啡／豆漿早餐桌！只需心智轉譯）。\n\n---\n\n### 假說 B2（跨界醫療／產後照護通路）：【產後月子與腸胃鏡術後溫和復食主食組】\n* **跨界心智移植來源**：健檢中心無痛腸胃鏡術後餐、產後月子中心防脹氣階段點心。\n* **精準目標受眾**：剛做完腸胃鏡檢查需溫和飲食者、剖腹產排氣後怕脹氣產婦。\n* **語言釘子**：**「比白粥更有營養與飽足感，術後與產後的第一口溫和老麵。」**\n* **本業能力逆向整合度（Fit Index）**：**3.6 / 5.0 分**（純白饅頭雖適用，但主力高毛利口味如堅果、地瓜、芋頭含豐富膳食纖維與乳製品起司，違反腸胃鏡低渣飲食規範，面臨紅隊處決風險）。\n"
    },

      "name": "05_red_team_debate.md",
      "isYaml": false,
      "raw": "# 階段四：雙軌殘酷紅隊博弈審判報告 (Red Team Stress-Test Debate)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/04_red_team_scores.yaml`](../_thinking/00_core/04_red_team_scores.yaml)  \n> **核心任務**：扮演最冷血的投資人、挑剔買家與競爭對手，以 **6 大極限壓力向量** 拷問軌道 A，以 **外來者三大死穴** 審判軌道 B，當場處決脆弱假說，收斂出唯一具備商業必勝把握的「雙階推進藍海火箭」。\n\n---\n\n## 📊 一、軌道 A（存量分化軌）六大極限壓力審判計分表\n\n> 評分標準：1~5 分（5 分代表抗壓極強，低於 22 分直接淘汰處決）。\n\n| 假說代號與名稱 | V1 獲客與毛利 | V2 巨頭反撲 | V3 產能穩定 | V4 現金流週轉 | V5 法規與客訴 | V6 心智護城河 | **總分 (30)** | **紅隊終局判決** |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **HYP-A1【不脹氣・3秒回彈老麵饅頭】** | **4.7** | **4.6** | 4.3 | 4.5 | 4.2 | **4.8** | **27.1** | 🏆 **軌道 A 冠軍（前端破冰尖刀）** |\n| **HYP-A3【3 秒指壓驗真老麵饅頭】** | 4.0 | 4.1 | 4.3 | 3.8 | **4.8** | 4.1 | **25.1** | 🔄 **降維收編（併入 A1 成為視覺錘）** |\n| **HYP-A2【三代潔淨原粒冷凍早餐箱】** | 4.2 | 3.5 | 4.2 | **4.6** | 4.7 | 3.6 | **24.8** | 🔄 **降維收編（併入下單頁家庭箱 SKU）** |\n| **HYP-A4【竹北 30 年排隊私藏饅頭】** | 3.1 | 2.5 | 4.0 | 3.2 | 4.8 | 2.8 | **20.4** | 💀 **淘汰處決（僅保留為歷史背書徽章）** |\n\n### 🔨 軌道 A 紅隊毒舌質詢實錄\n\n1. **為什麼當場處決【HYP-A4 竹北 30 年老店宅配】？**\n   * **紅隊拷問**：「全台灣從南到北至少有 200 家饅頭店掛著『30 年山東老店』招牌！更致命的是，同樣在新竹竹北，『老麵酵匠』早就把『竹北老麵宅配』的 Google 與團購版面佔滿了。你拿老店人設出去投廣告，客人心裡只想花 18 元買一顆，看到冷凍運費 160 元立刻關掉網頁！」\n   * **判決**：主定位處決！將「源自竹北 30 年老麵原型工藝・萬人零脹氣口碑」降維成網頁第三屏的**【時間信任狀】**。\n\n2. **為什麼將【HYP-A3 壓扁回彈】與【HYP-A2 三代家庭箱】合體收編進【HYP-A1】？**\n   * **紅隊拷問**：「單講『壓扁會回彈（A3）』，消費者會問：『好玩是好玩，我幹嘛買海綿？』但只要加上一句：**『死麵糰才會在你胃裡結塊產氣；壓扁 3 秒彈回來的活氣孔老麵，進胃才不脹氣（A1）！』** 瞬間把物理炫技轉化為全台 500 萬敏感胃掏錢買單的救命稻草！再搭配『純白給爸媽、起司丁給小孩、堅果給自己（A2）』湊成 NT$ 980 免運家庭箱，獲客、轉化、客單價三箭齊發！」\n\n3. **對手（奇美／老麵酵匠）明天也拍「壓扁回彈、不脹氣」怎麼辦？**\n   * **反向定位防禦（Counter-Positioning）**：\n     * **工業巨頭（奇美／義美）跟不了**：他們的 40 分鐘速發流水線一旦改 12~16 小時老麵慢發酵，產能直接腰斬 70%，根本無法供應超商通路。\n     * **爆料網紅店（老麵酵匠等）不敢跟**：他們營收主力是「爆漿奶黃流沙、黑糖珍奶、熔岩芋泥捲」，一壓就爆漿塌陷，且高糖高油正是脹氣火燒心元兇，若改打「零流沙極簡原塊切丁養胃定位」，等於自砍 70% 網紅爆款營收！\n\n---\n\n## 🚀 二、軌道 B（跨界藍海軌）外來者三大死穴審判\n\n| 跨界假說 | 死穴 1：痛點本質剛度 | 死穴 2：操作習慣摩擦力 | 死穴 3：既有壁壘突破 | 能力整合度 (Fit Index) | **紅隊終局判決** |\n| :--- | :---: | :---: | :---: | :---: | :--- |\n| **HYP-B1【東方蒸製酸種輕主食・早安慢碳箱】** | ✅ 極痛（每天喝咖啡配吐司脹氣） | ✅ 極順（電鍋蒸透或覆熱輕鬆） | ✅ 非對稱碾壓歐包與生吐司 | **4.8 / 5.0** | 🏆 **軌道 B 冠軍（藍海高溢價終局）** |\n| **HYP-B2【產後與腸胃鏡術後低渣復食組】** | ⚠️ 週期僅 2~3 天，無法長期復購 | ❌ 醫療通路敲門摩擦極高 | ❌ 堅果/芋頭/地瓜含粗纖維違規 | **3.6 / 5.0 (<4.0)** | 💀 **一級死刑處決** |\n\n### 🔨 軌道 B 最狠紅隊拷問：「一顆饅頭憑什麼賣到 NT$ 42~50，讓喝精品咖啡的白領買單？」\n\n* **紅隊質詢**：「台灣人從小到大覺得饅頭就是一顆 15~20 元配稀飯的粗食，你叫它『東方蒸製酸種輕主食』，會不會是自嗨文青病？」\n* **藍海防禦答辯（嚴守【公理 3】與【公理 9】）**：\n  1. **絕不拋棄大眾品類詞，而是「品類詞＋高維錨點對比」**：我們在標題上依然直球保留「老麵饅頭」，但用**「東方酸種（12h 預分解慢碳）」**去對標白領每天花 NT$ 85~160 買的「馬可先生雜糧麵包／生吐司／酸種歐包」！\n  2. **幫買家算一筆秒懂的帳**：\n     * 買一片高奶油生吐司或貝果 ＝ **NT$ 75 ~ 120**（吃完早上 10 點胃脹溢酸）。\n     * 買一顆正統歐式酸種麵包 ＝ **NT$ 150 ~ 220**（外皮硬到刮破上顎，還要烤箱預熱 10 分鐘）。\n     * 買我們一顆**【雙色切丁起司／綜合堅果・12h 預分解回彈老麵饅頭】** ＝ **組合箱折合僅 NT$ 40 ~ 49**！電鍋蒸透熱騰騰出籠，壓扁 3 秒回彈，配黑咖啡一整個上午胃部舒坦！**在買家腦中不是「貴了 20 元的饅頭」，而是「省了一半錢、更好吃且完全不傷胃的升級版酸種早安輕主食」**！\n\n---\n\n## 🏆 三、雙軌戰略收斂：【雙階推進藍海火箭】\n\n```mermaid\nflowchart LR\n    classDef s1 fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef s2 fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n    classDef moat fill:#fef3c7,stroke:#d97706,stroke-width:2px,color:#111827;\n\n    STAGE1[\"🚀 第一級火箭（前端獲客破冰・軌道 A1）<br/>【壓扁 3 秒回彈・不脹氣老麵饅頭】<br/>• 短影音前 3 秒指壓回彈視覺錘<br/>• NT$ 499 免運 10 入測謊破冰箱<br/>• 零教育成本收割全台敏感胃痛點流量\"]:::s1\n    -->\n    STAGE2[\"🌊 第二級火箭（中後端高毛利復購・軌道 B1）<br/>【東方蒸製酸種・早安慢碳常備訂閱箱】<br/>• 溫潤純水蒸（免顧火電鍋8分鐘即食）<br/>• NT$ 980 雙週家庭箱 ／ NT$ 1,380 月配箱<br/>• 全面取代家庭冷凍庫的傷胃吐司與貝果\"]:::s2\n    -->\n    MOAT[\"🏰 終局品牌護城河<br/>獨佔『回彈＝不脹氣老麵』心智標準<br/>LTV 終生價值突破 NT$ 6,500+\"]:::moat\n```\n"

      "raw": "# 🛑 階段五：人類戰略決策閘門拍板協議書 (HUMAN_DECISION_GATE)\n\n> **專案代號**：`mantou` ｜ **對應神經元母體**：[`../_thinking/00_core/05_final_strategy.yaml`](../_thinking/00_core/05_final_strategy.yaml)  \n> **正式拍板品牌**：**【慢酵所】(MANXIAO LAB — 12H Slow Ferment Studio)**  \n> **靈魂信任背書**：*承襲新竹竹北 30 年老字號「莒光老麵」原型工藝・萬人零脹氣口碑實證*  \n> **決策狀態**：**✅ APPROVED（已由創辦人正式拍板「慢酵所」＋雙階推進藍海火箭，授權全模組武器化執行）**\n\n---\n\n## 🏆 一、拍板定錨總覽：為什麼【慢酵所】是通殺雙軌藍海的王牌命名？\n\n1. **一秒刺穿戰略公敵死穴**：市面上 95% 讓人脹氣溢酸的麵包與饅頭，罪魁禍首就是「**30 分鐘化學速發**」；而**【慢酵所】**三個字一出場，就將「**12~16 小時野生酵母與乳酸菌慢發酵預分解**」刻進顧客腦海，不需長篇解釋就立於科學制高點！\n2. **完美撐起「東方蒸製酸種」精品溢價**：「所（Lab / Studio）」具備日式潔淨烘焙實驗室的高級專業感，無論是賣給竹科工程師配精品黑咖啡，還是賣給雙薪媽媽當三代安心常備箱，單顆定價 NT$ 38~50 皆順理成章，徹底甩開菜市場 15 元饅頭比價泥潭。\n3. **100% 商標排他性與《食安法》合規**：獨創品牌詞彙零同名分流風險，且完全不踩《食安法》第 28 條醫療療效紅線。\n\n```mermaid\nflowchart LR\n    classDef brand fill:#fef3c7,stroke:#d97706,stroke-width:3px,color:#111827;\n    classDef trackA fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef trackB fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    B[\"👑 拍板主品牌：【慢酵所 MANXIAO LAB】<br/>副標：12h 預分解老麵輕主食<br/>背書：源自竹北 30 年老麵原型工藝\"]:::brand\n\n    B --> TA[\"【階段 1：前端獲客尖刀（軌道 A）】<br/>品類：不脹氣・3秒回彈老麵饅頭<br/>語言釘子：壓扁 3 秒彈回來，進胃才不脹氣！<br/>破冰武器：NT$ 499 免運【大6+小12 雙享受破冰箱】\"]:::trackA\n\n    B --> TB[\"【階段 2：高溢價訂閱壁壘（軌道 B）】<br/>品類：東方蒸製酸種輕主食 (Steamed Sourdough)<br/>語言釘子：吐司傷胃、歐包刮嘴？電鍋 8 分鐘配黑咖啡也不脹氣！<br/>現金牛武器：NT$ 980 自選24入箱 ／ NT$ 1,380 月配箱\"]:::trackB\n```\n\n---\n\n## 📊 二、【慢酵所】雙階藍海戰略一屏執行憲章（全下游模組唯一母法）\n\n| 核心戰略維度 | 🥇 階段 1（存量破冰軌・軌道 A） | 🚀 階段 2（跨界升維軌・軌道 B） |\n| :--- | :--- | :--- |\n| **品牌與品類全稱** | **慢酵所｜不脹氣回彈老麵饅頭** | **慢酵所｜東方蒸製酸種輕主食** |\n| **核心語言釘子（≤15字）** | **「壓扁 3 秒彈回來，進胃才不脹氣！」** | **「配黑咖啡也不脹氣的東方酸種！」** |\n| **展開利益承諾** | 我們多等 12 小時老麵慢發酵預分解，換你一整個上午胃部平坦清爽。 | 100% 純水蒸無油焦化、電鍋 8 分鐘免顧火蒸透即食，取代傷胃吐司與刮嘴歐包。 |\n| **超級視覺錘** | 手掌重壓饅頭成薄餅 ➔ 鬆手 3 秒慢動作 100% 彈回圓潤原狀（對比速發饅頭塌陷成死麵） | 電鍋掀蓋熱氣直衝 ＋ 黑咖啡旁切開滿滿雙色起司丁與堅果橫切面 |\n| **戰略公敵 (Enemy)** | 30 分鐘商用速發酵母＋含鋁泡打粉假蓬鬆饅頭、高糖高油網紅流沙包 | 高奶油誘發火燒心的生吐司／可頌、單顆 160 元硬刮嘴的歐式酸種包、冰冷如飼料的水煮餐 |\n| **主力精選 SKU 矩陣** | **【經典大老麵 5 大款】**<br>① 純白原麥（無糖/微甜，6入 $120）<br>② 黑金剛古法黑糖（6入 $180）<br>③ 黃金番薯地瓜捲（6入 $150）<br>④ 全麥多穀養生堅果（6入 $210）<br>⑤ 雙色切丁起司（6入 $240）<br>*(剔除桂竹筍捲等重油蔥易反酸品項)* | **【一口回彈小慢包 2 大款】**<br>⑥ 迷你黑金剛一口包（12粒入，NT$ 160）<br>⑦ 綜合回彈小慢包分享袋（約 2 台斤，NT$ 120）<br>*(幼兒手掌不浪費、辦公室午茶 0 罪惡感神器)* |\n| **三階定價與組合箱設計** | **階梯 1【雙享受破冰體驗箱】NT$ 499**<br>（大老麵 6 入 ＋ 迷你黑金剛 6 粒 ＋ 迷你綜合小慢包 6 粒，超商免運；吃 2 顆不回彈或悶脹全額退！） | **階梯 2【三代安心自選常備箱】NT$ 980**<br>（任選 4 組 6 入家庭包共 24 入，超商冷凍免運）<br>**階梯 3【東方酸種月配 36 入定期箱】NT$ 1,380**<br>（任選 6 組 6 入大老麵或混搭迷你袋，黑貓免運） |\n\n---\n\n## 🔍 三、事實查證沙盒與法規安全護欄\n\n1. **[竹北 30 年「莒光饅頭」真實食記口碑查驗](https://www.google.com/search?q=%22%E8%8E%92%E5%85%89%E9%A5%85%E9%A0%AD%22+%E8%80%81%E9%BA%B5+%E4%B8%8D%E8%84%B9%E6%B0%A3)**：確認真實買家原聲聚焦於「不胃酸、不脹氣、起司丁與芋頭顆粒真材實料」。\n2. **[早餐吃麵包吐司脹氣火燒心社群痛點查驗](https://www.google.com/search?q=%E6%97%A9%E9%A4%90+%E9%BA%B5%E5%8C%85+%E8%84%B9%E6%B0%A3+%E8%83%83%E9%A3%9F%E9%81%93%E9%80%86%E6%B5%81+ptt+dcard)**：確認全台逾 500 萬敏感胃族群每日早晨主食缺口。\n3. **⚖️《食安法》第 28 條合規鐵律**：下游所有短影音與官網文案，一律以「12h 老麵慢發酵預分解大分子澱粉、好消化少負擔、吃完清爽不悶脹」表述，嚴禁出現「治療胃食道逆流／治胃病／健胃療效」等醫療詞彙。\n\n---\n\n## ✅ 四、決策簽署紀錄與下游模組全面解鎖\n\n* **2026-11-24 23:15 創辦人拍板指令**：「**選 慢酵所**」\n* **已授權並執行完畢之下游實戰模組**：\n  1. 🎯 **心智作戰四部曲 (`modules/mental_weapons/`)**：8 大心智武器庫、40 條雙軌標題庫＋四層認知口播大師深稿、P-1~P-5 實拍載體與微短劇、慢酵所四大頻道 IP 欄目。\n  2. 🧪 **真金白銀測謊漏斗 (`modules/pretotyping_funnel/06_skin_in_the_game.md`)**：NT$ 499 回彈破冰箱三級承諾漏斗與紅黃綠判決燈。\n  3. 🛡️ **放量防禦壁壘 (`modules/scale_defense/07_moat_and_fulfillment.md`)**：12h 恆溫發酵室 TOC 擴產 SOP 與巨頭反向定位護城河。\n  4. 💻 **品牌受眾轉化官網 (`index.html` & `modules/web_translation/index.html`)**：0% 行銷術語、溫潤職人實驗室美學之【慢酵所】官方電商落地頁。\n"

      "raw": "# 【思維神經元母體】階段 1: 企業資產解構與去骨審計 (01_assets.yaml)\nproject_id: \"mantou\"\nversion: \"1.0.0\"\naudit_date: \"2026-11-24\"\n\nstripped_adjectives_graveyard:\n  - \"純天然 (空泛自稱，無檢驗標準，市面 99% 烘焙坊皆自稱天然)\"\n  - \"好吃 (主觀廢話，無法在首購前形成信任)\"\n  - \"用心手作 (傳統老店通用形容詞，零心智區隔度)\"\n  - \"健康養生 (高齡老氣標籤，年輕白領與小孩本能抗拒)\"\n\nassets:\n  heritage_benchmark:\n    reference_entity: \"新竹竹北『莒光饅頭店』（竹北市中山路 420 號，源自光復饅頭體系在地深耕逾 30 年）\"\n    organic_social_proof:\n      - \"深耕竹北高收入科技生活圈 30 餘年，累積大量在地居民與美食部落客自發性長文食記\"\n      - \"顧客一致自發高頻評論詞：『吃完不胃酸、不脹氣』、『放涼了一樣 Q 彈有勁』、『每一口都咬得到真芋頭丁與起司塊』\"\n    brand_equity_verdict: \"『莒光』具極高在地真實口碑，但字面帶有傳統眷村銅板價錨點與地名商標排他性弱點；最佳解為『創立全新高溢價藍海品牌 ＋ 標註源自竹北 30 年莒光老麵原型工藝實證』\"\n\n  core_capabilities:\n    AST-01:\n      name: \"12~16 小時野生酵母與乳酸菌『老麵慢發酵預分解工藝』\"\n      scientific_mechanism: \"老麵富含天然野生酵母與活性乳酸菌群，經長時恆溫慢發酵，乳酸菌與酵素預先將小麥中難消化的大分子支鏈澱粉與麩質蛋白質（Gluten）剪切分解為小分子胺基酸與單雙醣，進入胃部後不再劇烈產氣、不異常刺激胃酸衝開賁門。\"\n      user_benefit: \"敏感胃、易脹氣、怕溢酸族群早上吃完配黑咖啡或豆漿，開會一整個上午胃部平坦舒適。\"\n\n    AST-02:\n      name: \"『壓扁 3 秒瞬間回彈』高密度立體筋膜氣孔結構 (超級視覺錘)\"\n      physical_mechanism: \"無化學泡打粉（含鋁膨脹劑）與速發改良劑的虛胖大空洞；純靠老麵長時發酵與多次壓延揉製，形成如記憶海綿般緊密均勻的微米級立體筋膜網，蒸熟後重壓到底可在 3 秒內 100% 彈回原狀，且放涼不乾硬、不死麵。\"\n      user_benefit: \"消費者在家用兩根手指就能當場驗明正身——『會回彈的才不會在胃裡結成死麵塊』。\"\n\n    AST-03:\n      name: \"『原塊切丁真食材 ✕ 雙規格尺寸』精準剪裁產品矩陣（非化學香精泥與高油流沙）\"\n      original_store_price_audit:\n        mini_specs:\n          - \"綜合小饅頭（約 2 台斤重）：售價 NT$ 100\"\n          - \"迷你黑金剛（12 粒入）：售價 NT$ 160（每粒約 13.3 元）\"\n        regular_specs:\n          - \"無糖純白饅頭 / 微甜饅頭：單顆 NT$ 15（6 入家庭包 NT$ 120，平均 20 元/顆含包裝）\"\n          - \"全麥饅頭：單顆 NT$ 29（升級整粒堅果 6 入包 NT$ 210）\"\n          - \"黑金剛饅頭：6 入家庭包 NT$ 180（單顆約 30 元）\"\n          - \"蕃薯地瓜捲：6 入家庭包 NT$ 150（單顆約 25 元）\"\n          - \"桂竹筍捲：6 入家庭包 NT$ 210（【策略剔除】重油重蔥與輕主食定位衝突，易胃酸逆流且易變質，堅決不賣）\"\n      curated_sku_architecture:\n        regular_sourdough_line:\n          description: \"【回彈大老麵系列（一般規格 / 6 入家庭包）】早安慢碳與正餐主食\"\n          skus:\n            - \"純白原麥回彈老麵（無糖/微甜）：單顆 15 元，6 入家庭包 NT$ 120（0 糖 0 油極簡，百搭夾蛋，極敏胃首選）\"\n            - \"黑金剛・古法黑糖老麵：6 入家庭包 NT$ 180（原店 30 年招牌，純天然黑糖蔗香慢發酵，溫潤暖胃）\"\n            - \"黃金番薯地瓜捲：6 入家庭包 NT$ 150（台農 57 號原型地瓜，粗糧膳食纖維，微甜香軟）\"\n            - \"全麥多穀養生堅果：6 入家庭包 NT$ 210（原店全麥升級整粒核桃、南瓜子、葵花籽，優質慢碳好油，黑咖啡絕配）\"\n            - \"雙色切丁起司老麵：6 入家庭包 NT$ 240（在地部落客食記第 1 名，雙色切達起司丁鹹香牽絲，高鈣、小孩秒殺）\"\n        mini_sourdough_bites_line:\n          description: \"【一口回彈・迷你小慢包系列（Mini Sourdough Bites）】點心與幼兒行銷神器\"\n          skus:\n            - \"迷你黑金剛一口包（12 粒入）：售價 NT$ 160（小孩手掌剛好不浪費，辦公室下午 3 點低罪惡防低血糖）\"\n            - \"綜合回彈小慢包分享袋（約 2 台斤裝）：售價 NT$ 120（多口味一口包，野餐露營、氣炸或蘸優格一口小點心）\"\n\nrtb:\n  - id: \"RTB-01\"\n    title: \"3 秒壓扁回彈物理實測\"\n    proof_type: \"視覺物理鐵證 (Visual Physical Proof)\"\n    detail: \"整顆饅頭手掌壓扁至 1.5 公分厚，鬆手 3 秒內恢復飽滿原狀；對比市售速發饅頭一壓即塌陷黏牙。\"\n  - id: \"RTB-02\"\n    title: \"12 小時以上老麵乳酸菌預分解（0 泡打粉・0 化學改良劑・0 防腐劑）\"\n    proof_type: \"食品科學與 SGS 潔淨檢驗 (Clean-Label Proof)\"\n    detail: \"以時間換取胃部輕鬆，拒絕 30 分鐘商用速發酵母與含鋁泡打粉，可出具無防腐劑、無人工甜味劑第三方 SGS 檢驗。\"\n  - id: \"RTB-03\"\n    title: \"竹北 30 年老店配方基因與萬名挑剔客群零脹氣實證\"\n    proof_type: \"時間與地緣社會認證 (30-Year Heritage & Tech-Hub Proof)\"\n    detail: \"源自全台高壓胃敏感密度最高的新竹竹北生活圈 30 年實戰口碑，多篇獨立部落客食記公開背書。\"\n  - id: \"RTB-04\"\n    title: \"100% 原粒切丁投料（看得見起司塊、芋頭丁、地瓜丁、整顆堅果）\"\n    proof_type: \"切面肉眼可見證據 (Cross-Section Proof)\"\n    detail: \"撕開饅頭切面即見真實原塊食材，絕不使用高糖高油化學芋泥餡、人工奶酥流沙或色素香精。\"\n\noperational_constraints:\n  - \"手工老麵受溫濕度與 12+ 小時發酵週期限制，單日產能具物理上限，不適合打 15 元低毛利批發價格戰。\"\n  - \"冷凍宅配單箱黑貓低溫運費高達 NT$ 160~225（超商冷凍店到店約 NT$ 99~120），單賣散顆必虧，必須設計 NT$ 499~1,280 週期家庭常備箱。\"\n  - \"台灣《食品安全衛生管理法》第 28 條嚴格禁止食品宣稱『治療胃食道逆流、健胃整腸醫療效能』，品牌命名與文案必須鎖定『老麵慢發酵、小分子好消化、不悶脹、壓扁回彈』之物理與日常體感描述。\"\n"
    },

      "raw": "# 【思維神經元母體】階段 2: 心智階梯、空白審定與避坑地雷 (02_ladder_landmines.yaml)\nproject_id: \"mantou\"\nversion: \"1.0.0\"\naudit_date: \"2026-11-24\"\n\nladder:\n  existing_categories:\n    tier_1_industrial_frozen:\n      category_name: \"量販/超商工業冷凍包子饅頭\"\n      leaders: [\"奇美食品\", \"義美食品\", \"桂冠\"]\n      occupied_word: \"便宜方便、超商蒸包機隨買隨吃 (NT$ 12~22/顆)\"\n      structural_flaw: \"為求工廠數小時極速量產與冷凍穩定，普遍採用商業速發酵母與品質改良劑，澱粉未經長時預分解；敏感胃族群吃完極易胃脹氣、打嗝溢酸，壓扁易塌陷黏牙。\"\n\n    tier_2_traditional_laomian_ec:\n      category_name: \"傳統手工老麵饅頭宅配品牌 (同質化紅海)\"\n      leaders: [\"老麵酵匠（光頭揉饅頭，同處新竹竹北強敵！）\", \"孔子饅頭\", \"台灣饅頭專賣店\", \"福穀樂\"]\n      occupied_word: \"手工老麵、爆料大份量、傳統養生山東饅頭 (NT$ 25~48/顆)\"\n      structural_flaw: \"全體陷入『我們也是純手工老麵、我們餡料更多更爆漿』的同質化內捲；其中爆料流沙/奶黃/黑糖珍奶路線高糖高油，反而誘發胃酸逆流；純山東大饅頭路線則形象老氣，像長輩病號乾糧。\"\n\n    tier_3_trendy_bakery_toast:\n      category_name: \"精品生吐司 / 歐式酸種麵包 (Sourdough) / 連鎖健康烘焙\"\n      leaders: [\"馬可先生\", \"一禾堂\", \"嵜本生吐司\", \"獨立酸種歐包工坊\"]\n      occupied_word: \"精緻早午餐儀式感、雜糧歐包健康形象 (NT$ 80~220/顆)\"\n      structural_flaw: \"生吐司高奶油高糖極易火燒心；歐式酸種麵包雖同樣長時發酵好消化，但外皮乾硬刮嘴、單價動輒破百、亞洲胃早上愛吃溫熱柔軟食物，難以天天當家庭日常主食。\"\n\n  white_space_verdict:\n    physical_vacuum: \"PARTIAL_VACUUM (老麵饅頭物理產品已存在，但『零高油甜膩流沙 ＋ 原粒切丁真食材 ＋ 專為敏感胃設計的分級常備組』缺乏標準化精品品牌)\"\n    mental_vacuum: \"TRUE_BLUE_OCEAN (沒有任何一個品牌獨佔『3秒壓扁回彈 ＝ 敏感胃早上吃不脹氣的東方酸種輕主食』這顆心智釘子！)\"\n    salt_flat_check: \"PASS_HIGH_PAIN_GOLDMINE (衛福部與消化醫學統計台灣胃食道逆流與慢性脹氣潛在人口高達 25%~30% 約 500 萬人，每天早上都在忍受『吃麵包吐司脹氣 vs 吃水煮蛋燕麥像吃飼料』的劇烈痛苦，絕非無痛感鹽鹼地！)\"\n    blue_ocean_definition: \"跳出『20 元菜市場中式饅頭』紅海，切入介於『傷胃精緻烘焙吐司』與『昂貴乾硬歐式酸種麵包』之間的【敏感胃早安回彈輕主食（東方蒸製酸種慢碳）】藍海！\"\n\nlandmines:\n  - id: \"LM-01\"\n    name: \"《食安法》第 28 條醫療效能文字獄地雷\"\n    severity: \"FATAL\"\n    trap: \"在品牌名稱、包裝或廣告直接寫『治療胃食道逆流、治胃痛、健胃整腸、顧胃神物』。\"\n    consequence: \"同業檢舉即觸犯《食品安全衛生管理法》第 28 條涉及醫療效能，單次開罰 NT$ 4 萬至 400 萬元並強制下架。\"\n    safe_countermeasure: \"全面改用法規安全且體感更強的物理與日常語彙：『12小時老麵慢發酵預分解』、『小分子好消化、吃完不悶脹』、『溫和無負擔、早上配黑咖啡也舒服』。\"\n\n  - id: \"LM-02\"\n    name: \"與同城強敵『老麵酵匠』正面硬剛傳統爆料老麵地雷\"\n    severity: \"HIGH\"\n    trap: \"叫『XX手工老麵饅頭』並主打『20種口味、爆漿流沙、芋泥火山』。\"\n    consequence: \"新竹竹北已有年銷千萬級宅配霸主『老麵酵匠（光頭揉饅頭）』佔據『老麵＋爆料捲』心智；跟風必淪為二流模仿者，且高糖流沙直接背叛敏感胃客群！\"\n    safe_countermeasure: \"執行【極致取捨律】與【巨人對立律】：堅決不做高糖流沙與化學泥餡！只做『原塊切丁真食材 ＋ 3秒壓扁回彈 ＋ 專為怕脹氣敏感胃打造』。\"\n\n  - id: \"LM-03\"\n    name: \"冷凍物流吃光毛利之散顆低價地雷\"\n    severity: \"FATAL\"\n    trap: \"在網路上沿用實體店思維，單顆賣 NT$ 20~25 且開放任選幾顆出貨。\"\n    consequence: \"冷凍店到店/黑貓低溫包材與運費每單剛性成本 NT$ 130~210，客單價低於 NT$ 500 扣除廣告費每單必賠。\"\n    safe_countermeasure: \"線上全面取消單顆散賣，改為『14 日敏感胃早安常備箱（NT$ 699~1,180）』與『NT$ 499 免運回彈測謊破冰箱（10~12入）』。\"\n\n  - id: \"LM-04\"\n    name: \"直接沿用『莒光饅頭店』作為全國電商主商標地雷\"\n    severity: \"MEDIUM_HIGH\"\n    trap: \"直接以『莒光饅頭店』打全國高單價冷凍電商。\"\n    consequence: \"1.『莒光』地名全台多家同名饅頭店（新北中和、馬祖、竹北），第 30 類商標難以取得全國獨家排他權；2. 消費者一聽『莒光饅頭』心理錨定在 15 元眷村大饅頭，對單顆 NT$ 42~55 精品常備箱產生比價抗拒。\"\n    safe_countermeasure: \"採用『新銳藍海主品牌（如：回彈號 / 慢酵所） ＋ 源自竹北 30 年莒光老麵原型口碑實證』背書制，兼得高溢價商標護城河與 30 年真實好評資產。\"\n\n  - id: \"LM-05\"\n    name: \"覆熱失敗變乾硬客訴地雷\"\n    severity: \"MEDIUM\"\n    trap: \"白領上班族沒有掌握正確加熱方式，直接裸放微波爐大火長時間加熱導致老麵脫水變硬。\"\n    consequence: \"產品明明極好，卻因錯誤加熱方式影響口感。\"\n    safe_countermeasure: \"隨箱附贈『黃金覆熱指南』：電鍋外鍋半杯水蒸 8~10 分鐘最極致彈潤，或噴微量水覆蓋微波 40~50 秒即食。\"\n"

dough)\"\n\nraw_idea:\n  one_sentence: \"【慢酵所 ManXiao Lab】：承襲竹北 30 年『莒光饅頭店』等級純天然老麵慢發酵原型工藝，以 12~16 小時野生酵母與乳酸菌預分解大分子澱粉，打造『壓扁 3 秒回彈、配黑咖啡也不脹氣』的純天然老麵饅頭與東方蒸製酸種早安輕主食箱（涵蓋純白原麥、雙色切丁起司、真芋頭丁、台灣地瓜丁、多穀養生堅果）。\"\n  target_audience_hint: \"核心灘頭堡：早上必喝黑咖啡/拿鐵卻吃吐司麵包易胃脹氣溢酸的竹科工程師與雙北白領；擴散主力圈：想一箱搞定全家三代（長輩怕溢酸、小孩愛起司、夫妻控糖）無添加早餐的潔淨標章媽媽。\"\n  target_problem_hint: \"市售麵包與一般饅頭採 30 分鐘化學速發酵母與泡打粉，大分子澱粉未分解導致吃完脹氣火燒心；歐式酸種麵包一顆 160 元又硬到刮嘴；網紅流沙包高糖高油更傷胃；【慢酵所】用 100% 純水蒸 12h 預分解老麵＋單顆微波鎖水蒸氣袋，50 秒還原剛出籠回彈口感。\"\n\nexisting_business:\n  reference_benchmark: \"新竹竹北『莒光饅頭店』（新竹縣竹北市中山路420號1樓，在地深耕逾 30 年老麵口碑標竿）\"\n  website_url: \"搜尋引擎關鍵字：竹北 莒光饅頭店 評價 / 部落客食記\"\n  original_store_menu_data:\n    mini_specs:\n      - item: \"綜合小饅頭\"\n        spec: \"袋裝（約 2 台斤重）\"\n        price_twd: 100\n        notes: \"迷你規格，適合作為點心或分次食用\"\n      - item: \"迷你黑金剛\"\n        spec: \"12 粒入袋裝\"\n        price_twd: 160\n        notes: \"古法黑糖一口小饅頭，平均約 13.3 元/粒\"\n    regular_specs:\n      - item: \"無糖純白饅頭 / 微甜饅頭\"\n        spec: \"單顆\"\n        price_twd: 15\n      - item: \"全麥饅頭\"\n        spec: \"單顆\"\n        price_twd: 29\n      - item: \"蕃薯地瓜捲\"\n        spec: \"6 入家庭包\"\n        price_twd: 150\n        per_unit_twd: 25\n      - item: \"黑金剛饅頭\"\n        spec: \"6 入家庭包\"\n        price_twd: 180\n        per_unit_twd: 30\n      - item: \"桂竹筍捲\"\n        spec: \"6 入家庭包\"\n        price_twd: 210\n        per_unit_twd: 35\n        curation_verdict: \"【策略剔除】重油重蔥鹹餡與輕主食/黑咖啡早安定位衝突，易引發胃酸且冷鏈易酸敗，不納入慢酵所核心產品線\"\n  curated_brand_offerings:\n    hero_regular_line:\n      description: \"【慢酵所・回彈大老麵系列】單顆微波鎖水袋 / 6入家庭包\"\n      items:\n        - name: \"純白原麥回彈老麵（無糖/微甜）\"\n          original_price: 15\n          pack_6_twd: 120\n          positioning: \"極敏胃、孕婦幼兒副食品、0糖0油純粹回甘麥香、百搭夾蛋\"\n        - name: \"黑金剛・古法黑糖老麵\"\n          original_price: 30\n          pack_6_twd: 180\n          positioning: \"原店 30 年招牌！純天然蔗糖慢酵，濃郁黑糖蔗香暖胃，大人小孩最愛\"\n        - name: \"黃金番薯地瓜捲／地瓜丁\"\n          original_price: 25\n          pack_6_twd: 150\n          positioning: \"台農57號黃金地瓜，原型粗糧膳食纖維，微甜香軟不膩胃\"\n        - name: \"全麥多穀養生堅果老麵\"\n          original_price: 29\n          pack_6_twd: 210\n          positioning: \"原店全麥升級整粒核桃、南瓜子、葵花籽，優質植物慢碳好油，黑咖啡絕配\"\n        - name: \"雙色切丁起司老麵\"\n          original_price: 40\n          pack_6_twd: 240\n          positioning: \"部落客食記第 1 名！真起司切丁鹹香牽絲，高鈣、小孩秒殺、黑咖啡靈魂搭檔\"\n    hero_mini_line:\n      description: \"【慢酵所・一口回彈小慢包系列（Mini Sourdough Bites）】\"\n      items:\n        - name: \"迷你黑金剛一口包 (12 粒入)\"\n          price_twd: 160\n          positioning: \"小孩手掌剛剛好不浪費，上班族下午 3 點低罪惡防低血糖一口吃\"\n        - name: \"綜合回彈小慢包分享袋 (約 2 台斤裝)\"\n          price_twd: 120\n          positioning: \"家庭分次享用、露營野餐、氣炸或蘸優格一口小點心\"\n    curated_boxes:\n      box_1: \"【雙享受破冰體驗箱】NT$ 499 免運（大老麵 6 入 ＋ 迷你小黑金剛 6 粒 ＋ 迷你綜合 6 粒）\"\n      box_2: \"【三代安心家庭 24 入常備箱】NT$ 980 免運（自由選配 4 組 6 入家庭包）\"\n      box_3: \"【東方酸種月配 36 入定期箱】NT$ 1,380 黑貓免運（自由配大老麵 6 入包或混搭迷你袋）\"\n  boss_notes:\n    - \"【價格與品項更新】引進原店真實尺寸與價格（小饅頭約2台斤100元、迷你黑金剛12粒160元；一般尺寸無糖15元、全麥29元；6入包黑金剛180元、地瓜150元、筍捲210元）。\"\n    - \"【精準取捨與品牌剪裁】果斷剔除油膩易酸敗的『桂竹筍捲』，嚴格鎖定『不脹氣・12h預分解輕主食』品牌定位。\"\n    - \"【王牌雙尺寸架構】大老麵主打『早安咖啡慢碳/三代早餐』；迷你一口包主打『幼童手指食物/辦公室低罪惡下午茶點心』，行銷切角爆發力極強。\"\n\n# ==============================================================================\n# 🔄 創辦人持續回饋與戰略決策記憶庫 (Evolving Feedback & Decision History)\n# ==============================================================================\niteration_history:\n  - timestamp: \"2026-11-24T22:50:27+08:00\"\n    user_directive: \"建立 projects/mantou 專案：1.老麵發酵純天然 2.有純白饅頭無餡料 3.有起司/地瓜/芋頭/堅果等純天然餡料 4.不脹氣好吃不傷胃 5.壓扁會回彈。網路搜尋『莒光饅頭店』正面評價與 BLOG 資訊極佳。幫我產生定位資訊、找出藍海市場，不一定要用莒光饅頭店品牌，先給品牌名建議。\"\n    notes: \"完成竹北『莒光饅頭店』30年口碑與台灣敏感胃市場（25%~30% 盛行率約 500 萬人）調研，提出五大品牌命名與雙階推進藍海戰略。\"\n    action_taken: \"產出階段 1~5 核心定位報告與四大前置/跨界模組報告，停駐於決策閘門等待品牌名拍板。\"\n  - timestamp: \"2026-11-24T23:15:48+08:00\"\n    user_directive: \"選 慢酵所\"\n    notes: \"創辦人正式拍板品牌名稱為【慢酵所 (ManXiao Lab)】！鎖定『12小時老麵慢發酵 vs 30分鐘化學速發』核心對立與『東方蒸製酸種輕主食』高溢價精品實驗室調性，雙階推進火箭正式點火。\"\n    action_taken: \"更新決策閘門為 APPROVED，全面啟動並完成 mental_weapons（心智作戰四部曲＋40條雙軌標題＋四層認知口播深稿）、pretotyping_funnel（$499 破冰箱測謊漏斗）、scale_defense（12h 發酵產能 TOC 與反向定位壁壘）及 web_translation（慢酵所官方高轉化電商落地頁 index.html），同步重建全案門戶 README.html。\"\n  - timestamp: \"2026-11-25T09:29:48+08:00\"\n    user_directive: \"更新價格與品項，另外，我不一定要賣他的全品項，要對的上我的品牌的，好行銷的。原店資訊：小饅頭綜合小饅（約2台斤）100元、迷你黑金剛（12粒）160元；一般尺寸單顆15~29元（無糖/微甜15元、全麥29元），6入家庭包黑金剛180元、地瓜捲150元、桂竹筍捲210元。\"\n    notes: \"【精準剪裁與定價對齊】：1. 果斷剔除與健康輕主食衝突之油膩『桂竹筍捲』；2. 確立【回彈大老麵系列】（純白無糖$15/全麥堅果$29/地瓜$25/黑金剛$30/切丁起司$40）與【一口回彈迷你小慢包系列】（迷你黑金剛12入$160、綜合小慢包分享袋$120）；3. 重構宅配三階箱（$499破冰大+小雙享受箱、$980家庭24入自選箱、$1,380月配36入箱），行銷穿透力與毛利更佳！\"\n    action_taken: \"全面同步更新 _thinking SSOT、00_core_positioning、mental_weapons 四部曲、落地頁 index.html、單元經濟與 README。\"\n  - timestamp: \"2026-11-25T20:30:54+08:00\"\n    user_directive: \"免搬電鍋、免退冰！50 秒微波鎖水蒸氣袋黑科技 沒有這一項東西，要移除。下列的異議 2也要移除或修改：異議 2：「我早上趕打卡／下午 3 點在辦公室嘴饞，哪有時間搬電鍋蒸 15 分鐘？」 「完全不用電鍋！大老麵採用食品級『微波鎖水蒸氣獨立袋』，免退冰撕開一小角微波 50 秒即食；更推薦帶一袋『迷你黑金剛一口包（12粒 $160）』放辦公室，下午三點微波 20 秒一口一粒配黑咖啡，防低血糖又不怕胖！」\"\n    notes: \"創辦人明確指示實體並無專利微波鎖水蒸氣袋，必須全面剔除『微波鎖水蒸氣袋黑科技』之包裝虛構，回歸傳統電鍋蒸熱或一般保鮮/微波復熱真實烹調方式，異議2修正為正統電鍋蒸透極致Q彈（或免顧火定時蒸）體現真實老麵風味。\"\n    action_taken: \"全面排查並剔除所有文件中『微波鎖水蒸氣袋』、『免搬電鍋50秒微波黑科技』相關文案、章節、包材成本與異議話術，落地頁改為『蒸出原汁麥香：電鍋/蒸鍋加熱指南』，異議2重構為『電鍋外鍋半杯水8分鐘免顧火，出籠就是剛出爐現做口感』。\"\n"

      "isYaml": false,
      "raw": "# 跨界子流程一：目標界三大漏斗篩選與特勞特定位先驗偵察 (Target Industry Reconnaissance)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **核心哲學**：遵循《跨界突變憲法》【公理 1：目標界先驗解剖律】——先放下「我們是做中式饅頭的」自我本位，由外而內偵察台灣高毛利主食與健康烘焙市場，找出能讓單顆饅頭身價翻倍的真正藍海目標界！\n\n---\n\n## 🔭 一、高價值目標界三大篩選漏斗掃描\n\n我們對周邊四個潛在跨界目標市場進行漏斗過篩，尋找**「客單價高、現有巨頭有結構性死穴、顧客天天受罪」**的黃金獵場：\n\n| 候選跨界目標界 | 漏斗 1：高溢價空間<br>*(單份願付 ≥ NT$ 45)* | 漏斗 2：既有巨頭結構性死穴<br>*(顧客一邊買一邊罵)* | 漏斗 3：高頻剛需復購<br>*(每週消費 ≥ 3 次)* | **綜合偵察裁定** |\n| :--- | :---: | :---: | :---: | :--- |\n| **目標界 A：都會白領「精品酸種歐包／健康雜糧烘焙」市場**<br>*(代表：馬可先生、生吐司、Sourdough 工坊)* | ✅ **極高**<br>(單顆 $80~$220) | ✅ **極明顯**<br>(生吐司高油逆流；歐包乾硬刮嘴又貴) | ✅ **極高頻**<br>(每日配黑咖啡早餐) | 🏆 **頭號藍海獵場（鎖定進攻！）** |\n| **目標界 B：健身減脂「超商即食慢碳／雞胸肉搭餐」市場** | 🟡 中<br>(地瓜/御飯糰 $35~$49) | 🟡 中<br>(冰冷無嚼勁、吃膩地瓜) | ✅ 高頻 | 🔄 **次級延伸場景**（可用純白與堅果款切入） |\n| **目標界 C：醫療健檢「腸胃鏡術後低渣餐」市場** | ✅ 高 | ❌ 堅果/芋頭/地瓜含粗纖維違規 | ❌ 極低頻（數年一次） | 💀 **淘汰不進** |\n| **目標界 D：精緻下午茶甜點伴手禮市場** | ✅ 高 | ❌ 顧客追求罪惡甜膩爆漿，與養胃背道而馳 | ❌ 低頻送禮 | 💀 **淘汰不進** |\n\n---\n\n## 🧠 二、目標界 A（精品健康烘焙／都會咖啡早點界）心智階梯先驗解剖\n\n在雙北、竹北、台中高收入白領與質感家庭主婦的早餐桌上，現存心智階梯與裂縫如下：\n\n```mermaid\nflowchart TD\n    classDef giant fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef niche fill:#fff8e1,stroke:#f57f17,stroke-width:2px,color:#111827;\n    classDef vacuum fill:#e0f7fa,stroke:#00838f,stroke-width:3px,color:#111827;\n\n    G1[\"【西式健康雜糧連鎖】馬可先生 / 聖德科斯烘焙<br/>• 客單：單條/單顆 NT$ 85 ~ 160<br/>• 差評裂縫：部分款式仍含油脂糖分，或全麥乾澀難吞，單價偏高\"]:::giant\n    G2[\"【網紅生吐司 / 貝果專門店】嵜本 / 好丘 / 團購貝果<br/>• 客單：單片/單顆 NT$ 75 ~ 130<br/>• 差評裂縫：生吐司重奶油易火燒心；貝果偏硬難消化，敏感胃吃完易脹氣\"]:::giant\n    G3[\"【歐美精品酸種麵包】獨立 Sourdough 烘焙坊<br/>• 客單：單顆 NT$ 150 ~ 260<br/>• 差評裂縫：230°C 烘烤外殼硬如石頭刮傷口腔、發酵酸味重、需烤箱回烤 10 分鐘\"]:::niche\n\n    G1 & G2 & G3 --> VAC[\"🌊 目標界未被滿足的超級心智真空：<br/>顧客想要 Sourdough『天然菌種預分解、配咖啡不脹氣』的科學好處，<br/>但渴望它是『溫熱柔軟 Q 彈、100% 無油焦化、50 秒微波即食、單顆只要 40 多元』！\"]:::vacuum\n```\n\n---\n\n## 💡 三、跨界破局洞察：為什麼「東方蒸製酸種」是一記降維絕殺？\n\n1. **借用高維認知，零成本教育市場（【公理 9：心智不可逆律】）**：\n   * 在竹科與都會白領圈，越來越多人從醫師、營養師與歐美健康頻道聽過 **「酸種發酵（Sourdough）能分解麩質與大分子澱粉，所以不會脹氣」**。\n   * 我們不需要從頭教育什麼叫老麵微生物學，只需一句話點破天機：**「你知道歐美賣 180 元不脹氣的酸種麵包嗎？我們傳承 30 年的 12 小時天然老麵，就是 100% 純水蒸、外彈內潤不刮嘴的『東方酸種輕主食』！」**\n2. **「水蒸 100°C」對決「烘烤 230°C」的非對稱健康優勢**：\n   * 西式麵包高溫烘烤必須抹油、加糖上色，且表皮產生梅納反應焦化物，對敏感食道與胃黏膜較具刺激性；\n   * 中式純蒸工藝恆溫 100°C 水蒸氣熟成，**0 烤焦燥熱、0 酥油塗抹、保水度高達 42% 以上**，天生更適合亞洲人的早晨腸胃！\n"
    },
    "modules/cross_industry/02_capability_bridge.md": {
      "path": "modules/cross_industry/02_capability_bridge.md",
      "title": "跨界子流程二：本業能力逆向整合度評估與防禦邊界隔離 (Capability Bridge & Boundary Isolation)",
      "name": "02_capability_bridge.md",
      "isYaml": false,
      "raw": "# 跨界子流程二：本業能力逆向整合度評估與防禦邊界隔離 (Capability Bridge & Boundary Isolation)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **法源依據**：《跨界突變憲法》【公理 2：能力逆向整合度 ≥ 4.0 紅線律】與【公理 3：防守邊界隔離律】。\n\n---\n\n## 🧮 一、本業核心能力逆向橋接打分表 (Fit Index = 4.8 / 5.0)\n\n我們檢驗既有老麵饅頭資產（對標竹北莒光饅頭店 30 年工藝與五大口味）能否在**「不買昂貴新產線、不改變核心配方靈魂」**的前提下，無縫填補【都會敏感胃咖啡早點／東方酸種輕主食】的目標界空位：\n\n| 目標界（都會白領／家庭早安輕主食）核心需求 | 我們既有的本業核心能力 | 橋接改造難度與動作 | 整合度評分 (1~5) |\n| :--- | :--- | :--- | :---: |\n| **1. 吃完配黑咖啡不脹氣、不溢酸** | 12~16 小時天然老麵野生酵母與乳酸菌慢發酵預分解工藝（已有 30 年萬人實證） | **零配方風險**：核心製程 100% 現成，只需將「老麵」科學轉譯為「12h 預分解慢碳」。 | **5.0 / 5.0** |\n| **2. 與精品咖啡、豆漿百搭的西式／現代風味** | 現有五大主力 SKU：**雙色切丁起司、養生綜合堅果、純白原麥、真芋頭丁、台灣地瓜丁** | **天生絕配**！「切丁起司＋黑咖啡」與「綜合堅果＋拿鐵」本就是白領最愛的鹹香堅果風味組合！純白款更可橫切夾酪梨水煮蛋做成「老麵回彈漢堡」。 | **4.9 / 5.0** |\n| **3. 肉眼可見的品質差異化證據** | 壓扁到底 3 秒瞬間彈回原狀的高密度立體筋膜結構 | **零額外成本**：直接拍成手機微距實測短片與隨箱驗真挑戰卡。 | **5.0 / 5.0** |\n| **4. 早晨匆忙覆熱體驗** | 目前傳統饅頭店多為塑膠大袋散裝，需用電鍋蒸 15 分鐘 | **升級早安覆熱指南**：電鍋外鍋半杯水免顧火 8~10 分鐘跳起，或噴微量水加蓋微波 40~50 秒，出籠如剛出蒸籠！ | **4.8 / 5.0** |\n| **🏆 綜合能力逆向整合度 (Overall Fit Index)** | **完美通過 ≥ 4.0 分憲法門檻！屬於「產品不用重做、換個戰場與包裝即降維通殺」的教科書級跨界！** | — | **4.8 / 5.0** |\n\n---\n\n## 🛡️ 二、非對稱防禦邊界隔離宣告（做什麼 vs 堅決不碰什麼）\n\n許多傳統食品廠跨界做健康輕食時，因為貪心而踏入重資產泥潭導致虧損。我們嚴格劃定以下神聖防禦紅線：\n\n```mermaid\nflowchart LR\n    classDef doZone fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef noZone fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n\n    subgraph DO [\"✅ 我們死守的高毛利核心區（極致聚焦）\"]\n        D1[\"1. 專注中央老麵慢發酵與急凍鎖鮮工藝\"]:::doZone\n        D2[\"2. 只做 5~6 款經 30 年驗證的『原塊切丁／純白』長青高周轉 SKU\"]:::doZone\n        D3[\"3. 箱購標準化與雙尺寸設計（大老麵主食＋迷你一口包點心）\"]:::doZone\n    end\n\n    subgraph DONT [\"🚫 我們堅決不碰的泥潭禁區（絕對隔離）\"]\n        N1[\"❌ 禁區 1：絕不在雙北高租金地段開連鎖實體早午餐咖啡廳（避開重房租與餐飲缺工泥潭）\"]:::noZone\n        N2[\"❌ 禁區 2：絕不研發保存期極短的生鮮夾肉沙拉三明治（避開冷鏈腐敗報廢風險）\"]:::noZone\n        N3[\"❌ 禁區 3：絕不跟風研發高糖奶酥、流沙爆漿、珍奶等季節獵奇口味（死守不脹氣純淨防線）\"]:::noZone\n        N4[\"❌ 禁區 4：絕不自建車隊配送散單（100% 委外 7-11/全家冷凍店到店與黑貓冷鏈）\"]:::noZone\n    end\n```\n\n---\n\n## 🔄 三、階段 1 與階段 2 產線共用與毛利躍升協同效應\n\n* **同一顆老麵饅頭，零庫存分裂風險**：工廠端生產的依然是那 5 款極致穩定的「純白、雙色起司丁、芋頭丁、地瓜丁、養生堅果」老麵饅頭，完全沒有雙軌庫存積壓風險！\n* **分階段包裝與溝通**：\n  * **階段 1（前端破冰）**：用最直白的「壓扁 3 秒回彈・不脹氣老麵饅頭」快速清空流量疑慮、建立首批 3,000 名鐵粉；\n  * **階段 2（跨界鎖客）**：透過「單顆微波鎖水袋 ＋ 早安咖啡慢碳訂閱箱」將品牌定錨為都會家庭冷凍庫必備的「東方蒸製酸種輕主食」，建立對手抄不走的長期訂閱護城河。\n"
    },
    "modules/cross_industry/03_category_naming_and_test.md": {
      "path": "modules/cross_industry/03_category_naming_and_test.md",
      "title": "跨界子流程三：新品牌命名戰略工程、品類命名與零代碼預售測謊 (Brand & Category Naming + Pre-Sell Protocol)",
      "name": "03_category_naming_and_test.md",
      "isYaml": false,
      "raw": "# 跨界子流程三：新品牌命名戰略工程、品類命名與零代碼預售測謊 (Brand & Category Naming + Pre-Sell Protocol)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **核心任務**：正面解答創辦人核心提問——**「要不要繼續用『莒光饅頭店』？如果不一定用，新品牌應該叫什麼名字最能打穿藍海？」**，並制定品類命名與零風險預售測謊 SOP。\n\n---\n\n## 🏛️ 一、「莒光饅頭店」品牌資產留捨審計：為何推薦【新主品牌 ＋ 30 年原型背書】？\n\n我們對網路上「莒光饅頭店」的真實口碑資產進行了特勞特品牌延伸與商標法務雙重評估：\n\n| 評估維度 | 直接沿用「莒光饅頭店」當全國主品牌 | 採用【新藍海主品牌 ＋ 竹北30年莒光老麵原型背書】 |\n| :--- | :--- | :--- |\n| **1. 網路既有口碑繼承度** | 🟢 可直接搜尋到舊部落客食記 | 🟢 **同樣 100% 繼承！** 在官網與包裝寫明「源自竹北 30 年莒光老麵原型配方・在地萬人零脹氣實證」，搜尋流量照吃不誤！ |\n| **2. 全國商標排他保護力（第30類）** | 🔴 **高風險**：全台有多家同名「莒光饅頭／包子」（新北中和莒光路、馬祖莒光、竹北等），地名／既有詞彙極難壟斷全國電商關鍵字，廣告費會幫別家店導流！ | 🟢 **100% 獨家壟斷**：全新獨創品牌詞，顧客一搜 100% 只會進到我們的官網與團購頁，零流量漏損！ |\n| **3. 藍海溢價心智天花板** | 🔴 **受限於銅板價錨點**：「XX饅頭店」讓人直覺聯想巷口一顆 15~20 元眷村早餐，賣一箱 NT$ 980 會遭遇比價心理抗拒。 | 🟢 **徹底打開溢價天花板**：新品牌可直接定錨在「回彈養胃機能老麵／東方酸種輕主食」，單顆賣 NT$ 40~50 順理成章！ |\n\n> 👑 **顧問終極建議**：採用奢侈品與頂級食品最經典的 **「背書品牌制（Endorsed Brand Architecture）」**——對外用極具殺傷力的新品牌名打天下，底下壓一行金色小字：**`承襲新竹竹北 30 年老字號老麵原型工藝`**！\n\n---\n\n## 🏷️ 二、五大新品牌命名提案深度評比（特勞特心智釘子命名法）\n\n好的品牌名本身就是免費廣告（遵循：1. 一聽就懂核心賣點 2. 好唸好記無生僻字 3. 避開《食安法》醫療違規字眼 4. 具商標獨特識別性）：\n\n### 👑 第一名首推：【回彈號】(HuiTan Hao)\n* **完整品牌呈現**：**回彈號｜不脹氣老麵慢酵饅頭** *(英文副標：REBOUND BUN — 12H Fermented Sourdough Mantou)*\n* **命名戰略殺傷力**：\n  1. **把「視覺錘」直接變成「品牌名」**：其他饅頭店的名字（某記、某匠、某村）都跟產品物理特性無關；唯有**【回彈號】**，消費者只要在滑手機時看到那 1.5 秒「手掌把饅頭壓成薄餅、鬆手 3 秒彈回原狀」的畫面，大腦瞬間完成**「壓扁回彈 ＝ 回彈號 ＝ 活氣孔不脹氣真老麵」**的永久記憶鎖定！\n  2. **兼容新潮與老字號底蘊**：「回彈」充滿現代物理機能感，「號」字（如百年老號）則完美承接竹北 30 年手工傳承的厚重信任感，年輕白領與長輩通吃！\n* **專屬品牌口號**：*「回彈號——壓扁 3 秒彈回來，進胃才不脹氣！」*\n\n---\n\n### 🚀 第二名首推（最適合走高端跨界白領路線）：【慢酵所】(ManXiao Lab)\n* **完整品牌呈現**：**慢酵所｜12h 預分解老麵輕主食** *(英文副標：12H SLOW FERMENT LAB)*\n* **命名戰略殺傷力**：\n  1. **一秒刺穿敵人死穴**：市售麵包饅頭為什麼脹氣？因為「30 分鐘化學速發」！我們為什麼不脹氣？因為在**【慢酵所】**裡經過 12~16 小時野生酵母與乳酸菌慢速預分解！\n  2. **極致拉高品牌身價**：「所（Lab / Studio）」帶有日本東京與台北精品烘焙實驗室的潔淨專業感（對標一禾堂、馬可先生），賣進竹科辦公室團購、高質感母嬰圈與百貨快閃櫃毫不違和，客單價支撐力最強！\n* **專屬品牌口號**：*「慢酵所——我們多等 12 小時慢發酵，換你一整個上午胃部清爽。」*\n\n---\n\n### 🌿 第三名推薦（溫潤親和、家庭三代通吃）：【順麥號】(ShunMai Hao)\n* **完整品牌呈現**：**順麥號｜溫和回彈老麵專門店**\n* **命名戰略殺傷力**：\n  1. **合法傳遞養胃順暢體感**：《食安法》第 28 條嚴禁品牌名叫「顧胃王、健胃堂」（涉誇張或醫療效能必遭檢舉開罰）；而**【順麥號】**以「順著小麥與時間的自然節奏發酵、吃完順暢舒服不頂胃」雙關切入，100% 合法安全，且長輩、孕婦與媽媽族群聽了倍感溫暖安心。\n* **專屬品牌口號**：*「順麥號——順著時間養老麵，順著脾胃吃好麥。」*\n\n---\n\n### 🌾 第四名備選（直球真材實料派）：【真麵目】(ZhenMianMu)\n* **完整品牌呈現**：**真麵目｜0 泡打粉原粒老麵饅頭**\n* **命名亮點**：取「真面目」諧音，主打「撕開看得見整塊起司丁、真芋頭丁與堅果，0 泡打粉還原老麵真面目」，團購直播口播極為順口。\n\n---\n\n### 🏛️ 第五名備選（原名資產升級派）：【竹北莒光老麵所】\n* **完整品牌呈現**：**竹北莒光老麵所｜始於 1990 年代的回彈老麵**\n* **命名亮點**：若創辦人與原店有深度直接傳承關係、希望直接收割「莒光饅頭」搜尋量，務必加上地名限定詞「竹北」與品類升級詞「老麵所」，與外縣市同名傳統小店做出視覺與商標區隔。\n\n---\n\n## 🎯 三、品類命名心理學：徹底告別自嗨與低價標籤\n\n在廣告與包裝上，品類命名嚴格執行「雙階精準呼叫」：\n\n```mermaid\nflowchart TD\n    classDef bad fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef goodA fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef goodB fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    BAD[\"❌ 錯誤品類命名<br/>『純天然手工養生饅頭』<br/>➔ 顧客心裡OS：無聊、老氣、菜市場一顆15元！\"]:::bad\n\n    GOODA[\"✅ 階段 1 品類命名（直球痛點）<br/>【不脹氣・3秒回彈老麵饅頭】<br/>➔ 敏感胃秒懂：原來這顆吃了不會溢酸悶脹！\"]:::goodA\n\n    GOODB[\"✅ 階段 2 跨界品類命名（拉高客單錨點）<br/>【東方蒸製酸種輕主食 (Steamed Sourdough)】<br/>➔ 咖啡白領秒懂：比 160 元歐包更軟彈好消化的早安慢碳！\"]:::goodB\n\n    BAD -. \"淘汰重構\" .-> GOODA & GOODB\n```\n\n---\n\n## 🧪 四、零代碼／零重資產「7 天真金白銀預售測謊 SOP」\n\n在正式花幾十萬印製公版彩盒與大量囤積包材前，先按以下 3 步完成低成本市場測謊（遵循【公理 18：行動承諾測謊公理】）：\n\n1. **第 1 步（雙命名 A/B 廣告卡對決，預算 NT$ 3,000）**：\n   * 用手機實拍一段 15 秒「手掌壓扁雙色起司老麵饅頭 ➔ 3 秒彈回原狀 ➔ 撕開起司塊熱氣蒸騰」真實影片，分別掛上 **A 組【回彈號｜不脹氣老麵饅頭】** 與 **B 組【慢酵所｜東方酸種老麵輕主食】** 兩頁極簡一頁式預購單，投放給「新竹竹北＋雙北 30~52 歲關注咖啡／健康飲食／腸胃保養」受眾。\n2. **第 2 步（驗證 NT$ 499 免運破冰箱真實刷卡率）**：\n   * 不看按讚數！只看有多少人願意掏錢預訂 **「NT$ 499 超商冷凍免運 10 入測謊破冰箱（每週限量出籠 50 箱）」**。\n3. **第 3 步（綠燈放行標準）**：\n   * 若 **CTR ≥ 2.2%** 且 **每單獲客成本 CPA ≤ NT$ 220**（50 箱在 7 天內售罄），即證明藍海定位與品牌名 100% 命中金礦，立即啟動全套品牌包裝印製與階段六 60 支短影音矩陣放量！\n"

      "raw": "# JTBD 痛點剛度與前進四力分析矩陣 (JTBD & Four Forces Pain Matrix)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **核心任務**：運用克里斯汀生 JTBD（Jobs To Be Done）與莫勒顧客前進四力模型，解剖【階段 1 敏感胃饅頭客】與【階段 2 咖啡白領／三代媽媽跨界客】的真實受苦場景，提煉短影音前 3 秒致命 Hook。\n\n---\n\n## ⏰ 一、核心受雇情境解構 (When / Trigger Moments)\n\n消費者買的不是「麵粉糰」，而是在以下三個崩潰瞬間，雇用我們的產品幫他完成任務：\n\n1. **【情境 A：週一早上 10:15 會議室裡的悶脹尷尬】（白領／工程師高頻觸發）**\n   * *When*：早上 8:00 趕上班喝了一杯熱美式配超商吐司／麵包，10:15 跟主管客戶開會時，胃裡開始像吹氣球一樣鼓脹、喉嚨湧上酸水，想打嗝又不敢打。\n   * *Hire Goal*：「給我一個能配黑咖啡、50 秒弄熱、有起司或堅果香氣，但讓我一整個上午胃部平坦安靜的早餐主食！」\n2. **【情境 B：早上 6:50 廚房裡的雙薪媽媽戰場】（家庭採購者高頻觸發）**\n   * *When*：小孩嫌健康雜糧難吃吵著要吃早餐店鐵板麵奶精奶茶，同住長輩吃甜麵包又喊胃酸，媽媽自己還要趕 8:30 打卡。\n   * *Hire Goal*：「給我一箱放冷凍庫、3 分鐘蒸熱／微波好，小孩搶著吃起司丁、爸媽吃白饅頭與芋頭丁不溢酸、0 泡打粉讓我毫無罪惡感的救命常備箱！」\n3. **【情境 C：連吃兩週水煮蛋＋冰地瓜後的飲食憂鬱】（養生／孕產婦觸發）**\n   * *When*：為了怕脹氣或控管腸胃，強迫自己戒掉所有麵包糕點，每天啃冷地瓜與水煮蛋，吃到懷疑人生、極度想念大口咀嚼溫熱麵香的幸福感。\n\n---\n\n## ⚡ 二、顧客前進四力動能模型 (The Four Forces Engine)\n\n```mermaid\nflowchart TD\n    classDef push fill:#ffebee,stroke:#c62828,stroke-width:2px,color:#111827;\n    classDef pull fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef habit fill:#fff3e0,stroke:#e65100,stroke-width:2px,color:#111827;\n    classDef anxiety fill:#ede7f6,stroke:#4527a0,stroke-width:2px,color:#111827;\n\n    subgraph PROPELLING [\"🚀 前進推動力總和：18.6 / 20（極強剛需動能）\"]\n        F_PUSH[\"1. 現狀痛苦推力 Push（9.4 / 10）<br/>• 吃吐司/麵包/速發包必脹氣溢酸一上午<br/>• 吃水煮蛋/燕麥糊像吃病號飼料毫無滿足感<br/>• 早餐店滿滿反式脂肪與含鋁泡打粉不敢給小孩吃\"]:::push\n        F_PULL[\"2. 新品類吸引力 Pull（9.2 / 10）<br/>• 『壓扁 3 秒瞬間回彈』肉眼可見的活氣孔療癒感<br/>• 12h 老麵預分解＋原塊切丁起司/地瓜/堅果真美味<br/>• 電鍋 8 分鐘免顧火蒸透或日常覆熱（階段 2 跨界爽點）\"]:::pull\n    end\n\n    subgraph DRAGGING [\"⚓ 後退阻力總和：8.5 / 20（可被制度完全化解）\"]\n        F_HABIT[\"3. 既有習慣重力 Habit（4.5 / 10）<br/>• 巷口超商或早餐店順手買很方便<br/>• 家庭冷凍庫空間有限、傳統用電鍋蒸嫌麻煩\"]:::habit\n        F_ANXIETY[\"4. 嘗新焦慮摩擦 Anxiety（4.0 / 10）<br/>• 『網路上每家都說自己老麵，萬一買一箱回來還是脹氣怎麼辦？』<br/>• 『冷凍運費好貴、萬一小孩不愛吃放著佔冰庫？』\"]:::anxiety\n    end\n\n    PROPELLING ==>|\"18.6 >> 8.5（破局成立！）\"| DRAGGING\n```\n\n### 🛡️ 消除後退阻力（Habit & Anxiety）的產品制度武器：\n* **擊碎 Habit（懶得顧火蒸煮）**：電鍋外鍋倒半杯水按下開關，刷牙洗臉 8~10 分鐘自動蒸好，免顧火、免洗油膩煎鍋，比去早餐店排隊還輕鬆！\n* **擊碎 Anxiety（怕買一整箱踩雷或脹氣）**：推出**「NT$ 499 超商冷凍免運 10 入測謊破冰箱（5 種招牌口味各 2 顆）」＋【雙重風險倒置承諾】**：「收到先吃 2 顆，若壓扁不回彈、或吃完覺得悶脹不合胃口，免退回剩餘饅頭，LINE 客服無條件全額退款！」\n\n---\n\n## 🧩 三、雙階演化三層 Jobs 深度對照表\n\n| 任務層級 | 【階段 1：存量分化軌】（不脹氣回彈饅頭） | 【階段 2：跨界藍海軌】（東方蒸製酸種輕主食） |\n| :--- | :--- | :--- |\n| **功能性任務 (Functional Job)** | 攝取溫熱飽足的澱粉主食，且在 12h 老麵預分解下避免胃部產氣與悶脹。 | 在辦公室或早晨 60 秒內快速搭配精品黑咖啡／無糖豆漿，獲得穩定慢碳能量不昏沉。 |\n| **情感性任務 (Emotional Job)** | 擺脫「每次吃完麵食就後悔胃不舒服」的身體焦慮，重拾大口咀嚼麥香的安心感。 | 享受媲美歐美精品 Sourdough 的純淨生活品味，不再覺得吃饅頭是「將就省錢」。 |\n| **社交身分任務 (Social Job)** | 在家人面前成為「懂得用指壓回彈分辨真假老麵、守護爸媽與孩子食安」的聰明採購者。 | 早上自帶老麵配美式黑咖啡，或辦公室下午茶分享迷你黑金剛一口包，成為同事詢問團購的健康達人。 |\n\n---\n\n## 🎬 四、短影音前 3 秒致命 Hook 彈藥庫（依 Push 痛點直球提煉）\n\n> 遵循《最高憲法》單句 ≤ 15 字短促有力原則，拍板品牌名後可直接開拍：\n\n1. **【指壓視覺暴力 Hook】**（畫面：一隻手把市售饅頭壓成死麵餅彈不起來，另一隻手把我們的饅頭壓到底 3 秒彈回原狀）  \n   👉 *「你吃的饅頭壓下去彈不起來？難怪進胃裡脹氣一上午！」*\n2. **【黑咖啡白領痛點 Hook】**（畫面：上班族早上喝美式配吐司，10 點按著胸口皺眉）  \n   👉 *「早上喝黑咖啡不敢配麵包？換這顆 12 小時預分解老麵！」*\n3. **【踢爆網紅流沙黑幕 Hook】**（畫面：撕開高油流沙包 vs 撕開我們滿滿真實起司方丁與芋頭塊）  \n   👉 *「別再買爆漿流沙饅頭傷胃了！真老麵只放切丁真起司。」*\n4. **【東方酸種跨界降維 Hook】**（畫面：160 元硬邦邦酸種歐包敲桌子 vs 蒸氣騰騰軟彈老麵）  \n   👉 *「酸種歐包一顆 160 刮破嘴？這顆東方純蒸酸種只要 40 元！」*\n5. **【竹北 30 年工程師實證 Hook】**（畫面：剛出籠白胖饅頭陣列熱氣直衝鏡頭）  \n   👉 *「在胃最挑剔的新竹竹北，為什麼這顆老麵能賣 30 年？」*\n"
    },
    "modules/market_sizing/02_market_size_census.md": {
      "path": "modules/market_sizing/02_market_size_census.md",

      "name": "02_market_size_census.md",
      "isYaml": false,
      "raw": "# 官方普查與藍海商業規模測算報告 (Market Sizing & Demographic Census)\n\n> **專案代號**：`mantou` ｜ **從屬最高憲章**：[`../../00_core_positioning/HUMAN_DECISION_GATE.md`](../../00_core_positioning/HUMAN_DECISION_GATE.md)  \n> **核心任務**：調閱台灣衛福部、主計總處與經濟部統計處公開普查數據，驗證【階段 1：敏感胃不脹氣回彈饅頭】與【階段 2：東方蒸製酸種早安輕主食】雙軌藍海的 TAM / SAM / SOM 容量天花板。\n\n---\n\n## 📊 一、官方統計與醫學普查基準數據源 (Official Census Sources)\n\n1. **人口與家戶基數（內政部戶政司／主計總處家庭收支調查）**：\n   * 台灣總人口約 **2,340 萬人**，20 歲以上成年人口約 **1,960 萬人**，全國家庭總戶數約 **920 萬戶**（其中六都＋新竹縣市都會核心區佔比逾 **74%，約 680 萬戶**）。\n   * 新竹縣竹北市與新竹市東區（竹科核心生活圈）平均每戶可支配所得位居全台前茅（逾 NT$ 145 萬／年），雙薪高工時工程師家庭對「無添加、省時冷凍常備早餐」願付價格（WTP）極高。\n2. **敏感胃與脹氣剛需人口普查（衛生福利部健保署／台灣消化系醫學會臨床統計）**：\n   * 台灣胃食道逆流（GERD）每年健保就醫突破 **55~60 萬人次**；臨床流行病學普查指出，若計入未就醫而經常出現「餐後胃脹氣、溢酸、火燒心、消化不良」之潛在成年人口，盛行率高達 **25% ~ 30%（約 490 萬 ～ 588 萬名成年人）**——平均每 4 個台灣成年人就有 1 人在吃精製麵包吐司後感到腸胃不適！\n3. **烘焙炊蒸與低溫調理食品產值（經濟部統計處工業產銷存統計 細類 0891 / 0897）**：\n   * 台灣整體早餐外食與居家早點年消費總盤突破 **NT$ 1,600 億元**；其中「烘焙炊蒸食品製造業（含麵包、吐司、包子饅頭）」與家庭冷凍麵點零售規模合計逾 **NT$ 320 億元／年**，且隨小家庭冷凍常備習慣普及穩定成長。\n\n---\n\n## 🪜 二、三級市場容量漏斗測算 (TAM / SAM / SOM)\n\n```mermaid\nflowchart TD\n    classDef tam fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef sam fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n    classDef som fill:#fff3e0,stroke:#e65100,stroke-width:3px,color:#111827;\n\n    TAM[\"1. TAM（全國烘焙炊蒸與居家早餐主食大盤）<br/>• 全台 1,960 萬成年人日常早餐澱粉主食消費<br/>• 烘焙炊蒸與冷凍麵點零售總規模：NT$ 320 億元／年\"]:::tam\n    --> SAM[\"2. SAM（都會區敏感胃／潔淨飲食之冷凍網購可服務盤）<br/>• 490 萬敏感胃成年人 ∩ 六都＋新竹都會區具低溫網購習慣家庭（約 68 萬活躍戶）<br/>• 階段1存量盤 NT$ 24.5 億 ＋ 階段2跨界歐包替代盤 NT$ 24.4 億 ＝ 合並 SAM NT$ 48.9 億元／年\"]:::sam\n    --> SOM[\"3. SOM（新品牌前 1~3 年實際可奪取藍海份額）<br/>• 僅需圈粉 6,000 ~ 15,000 個忠實家庭／白領訂戶（佔 SAM 0.9%~2.2%）<br/>• 年均復購 5.5 箱 × 客單 NT$ 980 ➔ 年營收 NT$ 3,234 萬 ～ NT$ 8,085 萬元\"]:::som\n```\n\n---\n\n## ⚖️ 三、雙階演化軌道容量拆解對照（階段 1 vs 階段 2）\n\n| 測算層級 | 【階段 1：存量分化軌】<br>不脹氣・3秒回彈老麵饅頭 | 【階段 2：跨界藍海升維軌】<br>東方蒸製酸種・早安慢碳輕主食箱 | 商業戰略意涵 |\n| :--- | :--- | :--- | :--- |\n| **目標受眾母體** | 原本就會網購冷凍饅頭／包子，但對化學速發與甜膩流沙感到脹氣不適的家庭（約 34 萬戶） | 原本買馬可先生、生吐司、貝果、酸種歐包配黑咖啡，卻嫌貴、嫌硬或胃食道逆流的白領與媽媽（約 34 萬戶） | **雙軌疊加直接將市場母體翻倍至 68 萬高價值家庭戶！** |\n| **願付價格天花板 (WTP)** | 單顆 NT$ 32 ~ 45（對標老麵酵匠、福穀樂） | 單顆 NT$ 42 ~ 55（對標單顆 $90~$160 歐包與貝果，消費者反而覺得超便宜！） | 階段 2 成功打破傳統饅頭 25 元價格魔咒，毛利率拉升逾 10 個百分點。 |\n| **年度家庭消費額** | 每戶年購約 NT$ 3,600（約 4 箱） | 每戶年購約 NT$ 7,200（雙月或月配訂閱常備主食，約 6~7 箱） | 轉化為「每日配咖啡固定慢碳基底」後，LTV 終生價值翻倍。 |\n| **分軌 SAM 容量** | **NT$ 12.2 億 ～ 24.5 億元／年** | **NT$ 24.4 億元／年**（增量藍海池） | 合計 **NT$ 48.9 億元** 真實可觸達藍海。 |\n| **前 3 年 SOM 目標** | Year 1 穩健破冰：**NT$ 1,800 萬／年**（約 3,300 名回購訂戶） | Year 2~3 訂閱放量：**NT$ 5,500 萬 ～ 8,000 萬／年**（約 10,000~15,000 名忠實訂戶） | 單一中央老麵工坊即可支撐年營收破五千萬之高獲利小巨人！ |\n\n---\n\n## 🏆 四、創辦人投資門檻審判結論 (Go / No-Go Verdict)\n\n* **審判結果**：**🟢 強烈推薦投入（STRONG GO — 高剛需、高復購、低退貨率金礦）**。\n* **關鍵財務底氣**：不同於三年才買一次的耐用品，早餐是**「一年 365 天每天早上 7:30 準時發生的剛性生理需求」**。只要透過前端「NT$ 499 免運回彈破冰箱」讓敏感胃客人親身體驗到「吃完一整個上午真的不脹氣！」，其自然回購率可達 45%~60%，獲客成本在第二單即全數賺回，第三單起全為純利複利！\n"
    },

      "raw": "# 📺 慢酵所 (MANXIAO LAB) 品牌頻道 IP 矩陣與敏捷開機手冊\n\n> **專案代號**：`mantou` ｜ **正式品牌**：**【慢酵所｜12h 預分解老麵輕主食】**  \n> **戰略對齊**：[`06_mental_weapons_kit.md`](./06_mental_weapons_kit.md) ＆ [`06_video_testing_scripts.md`](./06_video_testing_scripts.md)  \n> **核心哲學**：**「世界觀只是後置收納箱，直球賣貨與認知破局才是核心！」** 打造輕量化、零網紅離職風險、一人加一支手機即可穩定日更／週更的品牌自媒體頻道 IP。\n\n---\n\n## 🏛️ 模組 1：輕量化品牌世界觀外殼 ——【慢酵所 12H 東方發酵實驗室】\n\n* **頻道名稱設定**：**慢酵所 MANXIAO LAB｜不脹氣老麵輕主食**\n* **頻道 Bio 一句話簡介**：\n  > 🧪 我們多等 12 小時天然老麵預分解，換你一整個上午胃部平坦清爽。  \n  > 承襲竹北 30 年零脹氣口碑原型工藝｜0 泡打粉・壓扁 3 秒回彈・電鍋 8 分鐘蒸透免顧火  \n  > 👇 首購 $499 超商免運【雙享受回彈測謊箱】（大6＋小12，吃 2 顆不滿意免退回全額退）\n* **視覺與聽覺記憶錨點（零成本高質感）**：\n  * **色彩調性**：溫潤原麥米白色 `#F8F5EE` ＋ 發酵琥珀暖金 `#C88A3B` ＋ 實驗室炭墨綠 `#1E2D24`（兼具日式職人烘焙溫度與潔淨科學信賴感）。\n  * **固定開場 ASMR 聽覺錘（前 1.5 秒）**：「電鍋掀蓋熱氣嘶——聲」或「手指壓扁彈回清脆啵！一聲」。\n\n---\n\n## 📂 模組 2：雙階貫穿「四大直球欄目」規約（IG Reels / TikTok / YT Shorts 精選輯）\n\n嚴格對應【階段 1 存量破冰】與【階段 2 跨界藍海】，頻道首頁置頂四大直球精選欄目，讓新訪客點進主頁 10 秒內完成自我對號入座：\n\n```mermaid\nflowchart LR\n    classDef colA fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px,color:#111827;\n    classDef colB fill:#e1f5fe,stroke:#0277bd,stroke-width:2px,color:#111827;\n\n    subgraph S1 [\"【階段 1：敏感胃破冰欄目群（軌道 A）】\"]\n        C1[\"🔬 欄目 ①：《3秒回彈・真假老麵測謊室》<br/>主打暴力指壓對比與踢爆流沙包黑幕\"]:::colA\n        C2[\"🧬 欄目 ②：《12小時慢酵・敏感胃科普台》<br/>白話拆解乳酸菌預分解與竹北30年配方\"]:::colA\n    end\n\n    subgraph S2 [\"【階段 2：跨界輕主食與家庭訂閱欄目群（軌道 B）】\"]\n        C3[\"☕ 欄目 ③：《早安黑咖啡・東方酸種輕食》<br/>直擊竹科與都會白領早晨溫潤配咖啡場景\"]:::colB\n        C4[\"🏡 欄目 ④：《三代安心餐桌・潔淨冰庫開箱》<br/>雙薪媽媽搞定阿公小孩與月配箱精算\"]:::colB\n    end\n```\n\n---\n\n## 🎭 模組 3：三大零綁架風險角色卡 (Anti-Fragile Role Cards)\n\n為避免「花大錢捧紅單一網紅員工，離職後頻道歸零」的慘劇，設計三張可隨時替換或由創辦人／手模兼任的角色卡：\n\n1. **角色卡 R-1：【慢酵研究員／主理人】（權威信任擔當）**\n   * **人設特徵**：穿著乾淨亞麻色或墨綠色【慢酵所】工作圍裙，說話溫和但講科學數據極度篤定，不喊電視購物口號，只拿計時器、白板與 SGS 報告說話。\n   * **負責任務**：講透 12 小時發酵機制、算清成本帳、宣告「吃 2 顆不滿意免退回全額退」兜底承諾。\n2. **角色卡 R-2：【敏感胃茶水間學長／白領特派員】（場景共鳴擔當）**\n   * **人設特徵**：襯衫或竹科休閒 Polo 衫、掛識別證帶、手邊永遠有一杯美式黑咖啡，用過來人語氣分享「以前吃吐司開會必脹氣、換吃慢酵所後一上午超清爽」。\n   * **負責任務**：演繹軌道 B 東方酸種跨界短劇、辦公室/居家蒸透實測與團購破冰。\n3. **角色卡 R-3：【第一人稱匿名指壓手模】（極低成本日更主力！）**\n   * **人設特徵**：**完全不需露臉、不需化妝背稿！** 乾淨雙手在木紋砧板上進行「雙指重壓 3 秒回彈、手撕起司丁牽絲、橫切白饅頭夾嫩蛋」，搭配旁白配音即可量產高點擊素材！\n\n---\n\n## 🗺️ 模組 4：44 條心智子彈 ✕ 四大欄目 ✕ 三大角色 收納速查總表 (Master Sorting Matrix)\n\n| 欄目歸屬 | 推薦出鏡角色 | 收納之 `06_video_testing_scripts.md` 標題編號 | 建議掛載 CTA 積木 |\n| :--- | :---: | :--- | :---: |\n| **🔬 欄目 ①：《3秒回彈・真假老麵測謊室》** *(14支)* | **R-3 匿名手模** 為主<br>R-1 主理人 為輔 | `T1-01`, `T1-05`, `T1-06`, `T2-01`, `T2-02`, `T2-04`, `T2-05`, `T3-01`, `T3-02`, `T3-04`, `T3-05`, `T6-03`, `T6-04`, `T6-05` | `CTA-1 ($499破冰箱)`<br>`CTA-4 (SGS官網驗貨)` |\n| **🧬 欄目 ②：《12小時慢酵・敏感胃科普台》** *(13支)* | **R-1 主理人** | `T1-02`, `T1-04`, `T2-03`, `T2-06`, `T3-03`, `T4-01`, `T4-02`, `T4-04`, `T5-01`, `T5-02`, `T5-03`, `T5-04`, `T5-05`, `T6-01` *(含 T6-01 共14支)* | `CTA-1 ($499破冰箱)`<br>`CTA-5 (留言暗號)` |\n| **☕ 欄目 ③：《早安黑咖啡・東方酸種輕食》** *(8支)* | **R-2 白領特派員**<br>或 **R-3 匿名手模** | `T1-03`, `T3-06`, `T4-03`, `T4-05`, `T6-02`, `T7-01`, `T7-02`, `T7-03`, `T7-04`, `T7-05` *(共10支)* | `CTA-2 (白領早安慢碳)`<br>`CTA-1 ($499破冰箱)` |\n| **🏡 欄目 ④：《三代安心餐桌・潔淨冰庫開箱》** *(6支)* | **R-2 媽媽視角**<br>或 **R-3 餐桌手模** | `T4-06`, `T8-01`, `T8-02`, `T8-03`, `T8-04`, `T8-05` *(共6支)* | `CTA-3 ($980家庭常備箱)` |\n\n---\n\n## 🚀 模組 5：第 1 ~ 4 週敏捷開機與投放測謊 SOP（每週僅需拍攝 2.5 小時）\n\n| 週次 | 當週戰略目標 | 拍攝清單（共 4 支/週） | 投放與數據復盤動作 |\n| :---: | :--- | :--- | :--- |\n| **Week 1<br>（視覺錘破冰週）** | 用最低拍攝門檻驗證「壓扁 3 秒回彈」與「黑咖啡東方酸種」雙軌 CTR | • **免露臉手模 2 支**：`T1-01 (指壓對比)`、`T3-02 (撕開雙色起司丁)`<br>• **主理人口播 1 支**：`T2-01 (踢爆流沙包)`<br>• **茶水間微波 1 支**：`T7-02 (對決180元硬歐包)` | 每日 NT$ 500 投 Meta (IG/FB) 導流至【慢酵所落地頁】，檢視外連 CTR 是否 ≥ 2.2%、$499 破冰箱 CPA 是否 ≤ NT$ 207。 |\n| **Week 2<br>（消除異議放量週）** | 針對點擊未結帳受眾進行再行銷（Retargeting），擊碎價格與微波疑慮 | • `T6-02 (電鍋8分鐘極致彈潤實測)`<br>• `T4-01 (40元算帳深拆)`<br>• `T3-03 (試吃2顆免退回全額退對賭)`<br>• `T8-01 (三代家庭早晨救星)` | 將 Week 1 跑贏的冠軍素材放大預算 2 倍；把 `T6-02` 與 `T3-03` 設為瀏覽過官網 7 天內未結帳受眾之再行銷廣告。 |\n| **Week 3<br>（高客單拉升週）** | 推升 $980 家庭常備箱與 $1,380 月配箱佔比，回收首購顧客真實回彈好評 UGC | • 模組 C `B-1 (早會打嗝逆襲微短劇)`<br>• 模組 C `B-2 (偽Podcast老麵黑幕)`<br>• `T1-05 (純白無餡極敏胃白月光)`<br>• `T3-04 (真芋頭地瓜丁開箱)` | 對 Week 1 首購客發送 LINE 關懷訊息（領 $100 常備箱折價券），統計首購轉雙週／月配箱回購率（目標 ≥ 40%）。 |\n| **Week 4<br>（冠軍複製固防週）** | 淘汰末位 50% 素材，針對最佳單一標題進行「一源五態」裂變擴量 | 挑選前 3 週 ROAS 最高的 2 個切角，換不同開場前 3 秒畫面（啞鈴壓、拳頭壓、小孩咬起司）批量產出 6 支變體。 | 核算全月整盤毛利與真實 CAC，準備啟動中央發酵室批次排程擴產。 |\n"
